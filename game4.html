<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>打磚塊進化版 - 霓虹電玩館</title>
    <style>
        :root { 
            --primary: #00f2ff; 
            --bg: #0d0d1a; 
            --danger: #e94560; 
            --text: #e0e0e0;
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            text-align: center; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            touch-action: none;
        }
        .stats-bar { 
            display: flex; 
            gap: clamp(10px, 3vw, 30px); 
            margin-bottom: clamp(10px, 3vw, 15px); 
            font-size: clamp(1rem, 3vw, 1.2rem); 
            color: var(--primary); 
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }
        canvas { 
            background: #000; 
            border: min(3px, 0.5vw) solid #333; 
            box-shadow: 0 0 min(25px, 5vw) rgba(0, 242, 255, 0.2); 
            border-radius: min(8px, 1.5vw); 
            max-width: 90vw;
            max-height: 60vh;
        }
        .controls {
            margin-top: clamp(10px, 3vw, 20px);
            display: flex;
            gap: clamp(10px, 2vw, 15px);
        }
        .btn { 
            padding: clamp(8px, 2vw, 10px) clamp(15px, 3vw, 25px); 
            background: var(--danger); 
            color: white; 
            text-decoration: none; 
            border-radius: clamp(25px, 5vw, 50px); 
            font-weight: bold;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-size: clamp(12px, 3vw, 14px);
        }
        .btn:hover { 
            box-shadow: 0 0 15px var(--danger); 
            transform: scale(1.05); 
        }
        
        /* 觸控控制提示 */
        .touch-hint {
            position: fixed;
            bottom: clamp(20px, 4vw, 30px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: var(--primary);
            padding: clamp(5px, 2vw, 10px) clamp(15px, 3vw, 20px);
            border-radius: 20px;
            font-size: clamp(12px, 3vw, 14px);
            display: none;
            z-index: 1000;
        }
        
        @media (max-width: 768px) {
            .touch-hint { display: block; }
        }
    </style>
</head>
<body>

    <div class="stats-bar">
        <span>關卡: <span id="levelDisplay">1</span>/5</span>
        <span>得分: <span id="scoreDisplay">0</span></span>
        <span>用時: <span id="timeDisplay">0</span>s</span>
        <span>最高分: <span id="highScoreDisplay">0</span></span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <button class="btn" onclick="togglePause()" id="pauseBtn">暫停</button>
        <button class="btn" onclick="resetGame()">重新開始</button>
        <button class="btn" onclick="window.location.href='index.html#back'">返回大廳</button>
    </div>
    
    <div class="touch-hint">左右滑動控制球板</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 遊戲狀態
        let level = 1;
        let score = 0;
        let totalScore = 0;
        let startTime = Date.now();
        let gamePaused = false;
        let gameRunning = true;
        let highScore = 0;
        
        // 初始化高分
        function initHighScore() {
            const saved = localStorage.getItem('breakout_highscore');
            highScore = saved ? parseInt(saved) : 0;
            document.getElementById('highScoreDisplay').textContent = highScore;
        }
        
        // 更新高分
        function updateHighScore() {
            if (totalScore > highScore) {
                highScore = totalScore;
                document.getElementById('highScoreDisplay').textContent = highScore;
                localStorage.setItem('breakout_highscore', highScore.toString());
                
                // 顯示通知
                if (typeof GameUtils !== 'undefined') {
                    GameUtils.showNotification(`新紀錄！${highScore} 分！`, 'success');
                }
            }
        }
        
        // 暫停/繼續遊戲
        function togglePause() {
            gamePaused = !gamePaused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = gamePaused ? '繼續' : '暫停';
            
            if (!gamePaused && gameRunning) {
                requestAnimationFrame(update);
            }
        }
        
        // 重置遊戲
        function resetGame() {
            level = 1;
            score = 0;
            totalScore = 0;
            startTime = Date.now();
            gamePaused = false;
            gameRunning = true;
            document.getElementById('pauseBtn').textContent = '暫停';
            initLevel();
        }
        
        // 球與球板變數
        let x, y, dx, dy;
        const ballRadius = 8;
        const paddleHeight = 12;
        const paddleWidth = 100;
        let paddleX;
        let rightPressed = false;
        let leftPressed = false;

        // 磚塊設定
        let bricks = [];
        const levelConfig = [
            { rows: 3, cols: 6, width: 480, height: 320, speed: 3 },
            { rows: 4, cols: 7, width: 560, height: 380, speed: 4 },
            { rows: 5, cols: 8, width: 640, height: 440, speed: 4.5 },
            { rows: 6, cols: 9, width: 720, height: 500, speed: 5 },
            { rows: 7, cols: 10, width: 800, height: 560, speed: 6 }
        ];

        function initLevel() {
            const config = levelConfig[level - 1];
            canvas.width = config.width;
            canvas.height = config.height;
            
            x = canvas.width / 2;
            y = canvas.height - 30;
            dx = config.speed;
            dy = -config.speed;
            paddleX = (canvas.width - paddleWidth) / 2;
            
            // 初始化磚塊矩陣
            bricks = [];
            for (let c = 0; c < config.cols; c++) {
                bricks[c] = [];
                for (let r = 0; r < config.rows; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
            document.getElementById("levelDisplay").innerText = level;
        }

        // 鍵盤監聽
        document.addEventListener("keydown", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        });
        
        // 觸控控制
        let touchStartX = null;
        
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
        });
        
        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (touchStartX === null) return;
            
            const touchX = e.touches[0].clientX;
            const deltaX = touchX - touchStartX;
            
            // 直接設置球板位置
            const targetX = (canvas.width - paddleWidth) / 2 + deltaX;
            paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, targetX));
            
            // 根據移動方向設置按鍵狀態（用於同向加速）
            if (deltaX > 2) {
                rightPressed = true;
                leftPressed = false;
            } else if (deltaX < -2) {
                leftPressed = true;
                rightPressed = false;
            }
        });
        
        canvas.addEventListener("touchend", (e) => {
            e.preventDefault();
            touchStartX = null;
            rightPressed = false;
            leftPressed = false;
        });

        function collisionDetection() {
            const config = levelConfig[level - 1];
            // 計算與 drawBricks 相同的間距
            const padding = 10;
            const offsetTop = 40;
            const offsetLeft = 30;
            const brickWidth = (canvas.width - (offsetLeft * 2) - (padding * (config.cols - 1))) / config.cols;
            const brickHeight = 20;

            for (let c = 0; c < config.cols; c++) {
                for (let r = 0; r < config.rows; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        // 精確計算磚塊位置
                        let bx = c * (brickWidth + padding) + offsetLeft;
                        let by = r * (brickHeight + padding) + offsetTop;
                        
                        // 改進碰撞檢測：檢查球是否與磚塊相交
                        if (x + ballRadius > bx && x - ballRadius < bx + brickWidth &&
                            y + ballRadius > by && y - ballRadius < by + brickHeight) {
                            dy = -dy;
                            b.status = 0; // 磚塊消失
                            score++;
                            totalScore += 10; // 每個磚塊10分
                            document.getElementById("scoreDisplay").innerText = score;

                            // 檢查是否清空磚塊
                            if (score === config.rows * config.cols) {
                                if (level < 5) {
                                    // 關卡完成，不使用 alert
                                    totalScore += 100; // 關卡完成獎勵
                                    setTimeout(() => {
                                        if (typeof GameUtils !== 'undefined') {
                                            GameUtils.showNotification(`第 ${level} 關完成！進入第 ${level + 1} 關`, 'success');
                                        }
                                        level++;
                                        score = 0;
                                        initLevel();
                                    }, 300);
                                } else {
                                    // 所有關卡完成
                                    totalScore += 500; // 通關獎勵
                                    updateHighScore();
                                    const finalTime = document.getElementById("timeDisplay").innerText;
                                    setTimeout(() => {
                                        if (confirm(`全關卡達成！總耗時: ${finalTime}秒\n總得分: ${totalScore}\n要再玩一次嗎？`)) {
                                            resetGame();
                                        }
                                    }, 300);
                                }
                            }
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = varColor(0);
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight);
            ctx.fillStyle = "#00f2ff";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            const config = levelConfig[level - 1];
            const padding = 10;
            const offsetTop = 40;
            const offsetLeft = 30;
            const brickWidth = (canvas.width - (offsetLeft * 2) - (padding * (config.cols - 1))) / config.cols;
            const brickHeight = 20;

            for (let c = 0; c < config.cols; c++) {
                for (let r = 0; r < config.rows; r++) {
                    if (bricks[c][r].status === 1) {
                        let bx = c * (brickWidth + padding) + offsetLeft;
                        let by = r * (brickHeight + padding) + offsetTop;
                        bricks[c][r].x = bx;
                        bricks[c][r].y = by;
                        ctx.beginPath();
                        ctx.rect(bx, by, brickWidth, brickHeight);
                        ctx.fillStyle = varColor(r);
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function varColor(r) {
            const palette = ["#00f2ff", "#00d2ff", "#00b2ff", "#0092ff", "#e94560", "#ff0055"];
            return palette[r % palette.length];
        }

        function update() {
            if (gamePaused || !gameRunning) {
                // 顯示暫停訊息
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('遊戲暫停', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText('點擊「繼續」按鈕恢復遊戲', canvas.width / 2, canvas.height / 2 + 40);
                
                // 暫停時不繼續遊戲循環
                setTimeout(() => {
                    if (!gamePaused && gameRunning) {
                        requestAnimationFrame(update);
                    }
                }, 100);
                return;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // 更新計時
            document.getElementById("timeDisplay").innerText = Math.floor((Date.now() - startTime) / 1000);

            // 邊界反彈
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
            if (y + dy < ballRadius) dy = -dy;
            else if (y + dy > canvas.height - ballRadius - 5) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    // 同向加速物理邏輯
                    if ((rightPressed && dx > 0) || (leftPressed && dx < 0)) {
                        dx *= 1.2;
                    } else if ((rightPressed && dx < 0) || (leftPressed && dx > 0)) {
                        dx *= 0.8;
                    }
                    // 速度上下限保護
                    dx = Math.max(Math.min(dx, 10), -10);
                    dy = -dy;
                } else {
                    // 遊戲結束
                    gameRunning = false;
                    updateHighScore();
                    
                    // 使用更友好的遊戲結束提示
                    setTimeout(() => {
                        if (confirm(`遊戲結束！得分: ${totalScore}\n最高分: ${highScore}\n要再玩一次嗎？`)) {
                            resetGame();
                            requestAnimationFrame(update);
                        }
                    }, 100);
                    return;
                }
            }

            // 移動球板
            if (rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 8;
            else if (leftPressed && paddleX > 0) paddleX -= 8;

            x += dx;
            y += dy;
            requestAnimationFrame(update);
        }

        // 初始化並執行
        initLevel();
        update();
    </script>
</body>
</html>
