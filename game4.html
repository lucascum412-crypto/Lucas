<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>打磚塊進化版 - 遊戲館</title>
    <style>
        :root { --primary: #00f2ff; --bg: #0d0d1a; --danger: #e94560; }
        body { background: var(--bg); color: white; text-align: center; font-family: Arial; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .stats { display: flex; gap: 20px; margin-bottom: 10px; font-size: 1.2em; color: var(--primary); font-weight: bold; }
        canvas { background: #000; border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); border-radius: 5px; }
        .back-btn { margin-top: 20px; padding: 10px 20px; background: var(--danger); color: white; text-decoration: none; border-radius: 50px; transition: 0.3s; }
        .back-btn:hover { box-shadow: 0 0 15px var(--danger); transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="stats">
        <span>關卡: <span id="levelDisplay">1</span>/5</span>
        <span>時間: <span id="timeDisplay">0</span>s</span>
        <span>得分: <span id="scoreDisplay">0</span></span>
    </div>
    <canvas id="myCanvas"></canvas>
    <br><a href="index.html" class="back-btn">返回遊戲大廳</a>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        
        let level = 1;
        let score = 0;
        let startTime = Date.now();
        let ballRadius = 8;
        let x, y, dx, dy, paddleX;
        let paddleWidth = 90, paddleHeight = 12;
        let rightPressed = false, leftPressed = false;
        let bricks = [];
        
        // 關卡設定
        const levelConfig = [
            { r: 3, c: 5, w: 480, h: 320, speed: 3 },
            { r: 4, c: 6, w: 540, h: 360, speed: 3.5 },
            { r: 5, c: 7, w: 600, h: 400, speed: 4 },
            { r: 6, c: 8, w: 660, h: 440, speed: 4.5 },
            { r: 7, c: 9, w: 720, h: 480, speed: 5 }
        ];

        function initLevel() {
            const config = levelConfig[level-1];
            canvas.width = config.w;
            canvas.height = config.h;
            x = canvas.width / 2;
            y = canvas.height - 30;
            dx = config.speed;
            dy = -config.speed;
            paddleX = (canvas.width - paddleWidth) / 2;
            
            bricks = [];
            for(let c=0; c<config.c; c++) {
                bricks[c] = [];
                for(let r=0; r<config.r; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
            document.getElementById("levelDisplay").innerText = level;
        }

        document.addEventListener("keydown", (e) => {
            if(e.key == "Right" || e.key == "ArrowRight") rightPressed = true;
            else if(e.key == "Left" || e.key == "ArrowLeft") leftPressed = true;
        });
        document.addEventListener("keyup", (e) => {
            if(e.key == "Right" || e.key == "ArrowRight") rightPressed = false;
            else if(e.key == "Left" || e.key == "ArrowLeft") leftPressed = false;
        });

        // 請替換 game4.html 中的 collisionDetection 函數
function collisionDetection() {
    const config = levelConfig[level-1];
    let bw = (canvas.width - 60) / config.c - 10;
    for(let c=0; c<config.c; c++) {
        for(let r=0; r<config.r; r++) {
            let b = bricks[c][r];
            if(b.status == 1) {
                // 重新計算當前磚塊的精確位置
                let bx = c * (bw + 10) + 30;
                let by = r * (20 + 10) + 30;
                if(x > bx && x < bx + bw && y > by && y < by + 20) {
                    dy = -dy;
                    b.status = 0; // 隱藏磚塊
                    score++;
                    document.getElementById("scoreDisplay").innerText = score;
                    if(score == config.r * config.c) {
                        // 勝利邏輯...
                    }
                }
            }
        }
    }
}

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 畫磚塊
            const config = levelConfig[level-1];
            let bw = (canvas.width - 60) / config.c - 10;
            for(let c=0; c<config.c; c++) {
                for(let r=0; r<config.r; r++) {
                    if(bricks[c][r].status == 1) {
                        let bx = c * (bw + 10) + 30;
                        let by = r * (20 + 10) + 30;
                        bricks[c][r].x = bx; bricks[c][r].y = by;
                        ctx.fillStyle = varColor(r);
                        ctx.fillRect(bx, by, bw, 20);
                    }
                }
            }

            // 畫球
            ctx.beginPath(); ctx.arc(x, y, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#fff"; ctx.fill(); ctx.closePath();

            // 畫板
            ctx.fillStyle = levelConfig[level-1].speed > 4 ? "#e94560" : "#00f2ff";
            ctx.fillRect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);

            // 更新時間
            document.getElementById("timeDisplay").innerText = Math.floor((Date.now() - startTime) / 1000);

            // 碰撞邊界
            if(x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
            if(y + dy < ballRadius) dy = -dy;
            else if(y + dy > canvas.height - ballRadius) {
                if(x > paddleX && x < paddleX + paddleWidth) {
                    // 加速邏輯：同向加速，反向減速
                    if((rightPressed && dx > 0) || (leftPressed && dx < 0)) {
                        dx *= 1.3; // 同向加速
                    } else if((rightPressed && dx < 0) || (leftPressed && dx > 0)) {
                        dx *= 0.7; // 反向減速
                    }
                    // 限制最大最小速度，避免遊戲崩潰
                    dx = Math.min(Math.max(dx, -8), 8);
                    dy = -dy;
                } else {
                    alert("遊戲結束！"); location.reload(); return;
                }
            }

            if(rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 7;
            else if(leftPressed && paddleX > 0) paddleX -= 7;

            x += dx; y += dy;
            requestAnimationFrame(draw);
        }

        function varColor(r) {
            const colors = ["#00f2ff", "#00d2ff", "#00b2ff", "#0092ff", "#0072ff", "#0052ff", "#0032ff"];
            return colors[r % colors.length];
        }

        initLevel();
        draw();
    </script>
</body>
</html>
