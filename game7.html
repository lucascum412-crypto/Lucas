<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>霓虹方塊 - 遊戲博物館</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #0d0d1a;
        }
        body { 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
            padding: min(20px, 3vw);
        }
        #game-container { 
            position: relative; 
            border: min(4px, 0.8vw) solid #333; 
            box-shadow: 0 0 min(20px, 4vw) rgba(0, 242, 255, 0.2); 
            margin-bottom: min(20px, 4vw);
        }
        canvas { 
            background: #000; 
            display: block; 
            max-width: 90vw;
            max-height: 60vh;
        }
        .side-panel {
            position: absolute; left: 105%; top: 0; width: 150px; text-align: left;
            background: rgba(26, 26, 46, 0.8); padding: 15px; border-radius: 10px; border: 1px solid #444;
        }
        .stat { font-size: 1.2rem; color: var(--primary); margin-bottom: 10px; }
        .controls-hint { font-size: 0.8rem; color: #888; margin-top: 20px; }
        .back-btn {
            margin-top: min(20px, 4vw); 
            padding: min(10px, 2.5vw) min(30px, 6vw); 
            background: #e94560;
            color: white; text-decoration: none; 
            border-radius: clamp(25px, 5vw, 50px); 
            font-weight: bold;
            font-size: clamp(14px, 3.5vw, 16px);
        }
        
        /* 觸控控制 */
        .touch-controls {
            position: fixed;
            bottom: min(30px, 5vw);
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: min(15px, 3vw);
            z-index: 1000;
        }
        
        .touch-btn {
            width: min(60px, 12vw);
            height: min(60px, 12vw);
            background: rgba(0, 242, 255, 0.2);
            border: 2px solid var(--primary);
            border-radius: 50%;
            color: var(--primary);
            font-size: clamp(18px, 4vw, 24px);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .touch-btn:active {
            background: rgba(0, 242, 255, 0.4);
            transform: scale(0.9);
        }
        
        .touch-controls-row {
            display: flex;
            gap: min(15px, 3vw);
            align-items: center;
        }
        
        @media (max-width: 768px) {
            .touch-controls { display: flex; flex-direction: column; }
            .side-panel { display: none; }
        }
    </style>
</head>
<body>

    <h2 style="color: var(--primary); text-shadow: 0 0 10px var(--primary);">NEON TETRIS</h2>

    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        <div class="side-panel">
            <div class="stat">分數: <span id="score">0</span></div>
            <div class="stat">等級: <span id="level">1</span></div>
            <div class="controls-hint">
                [W/↑] 旋轉<br>
                [A/←] 左移<br>
                [D/→] 右移<br>
                [S/↓] 加速
            </div>
        </div>
    </div>

    <button onclick="window.location.href='index.html#back'">返回大廳</button>
    
    <!-- 觸控控制 -->
    <div class="touch-controls">
        <div class="touch-controls-row">
            <div class="touch-btn" id="rotateBtn">↻</div>
        </div>
        <div class="touch-controls-row">
            <div class="touch-btn" id="leftBtn">←</div>
            <div class="touch-btn" id="downBtn">↓</div>
            <div class="touch-btn" id="rightBtn">→</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        // 方塊形狀定義
        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
            if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
            if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
            if (type === 'O') return [[4, 4], [4, 4]];
            if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
            if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
        }

        const colors = [null, '#00f2ff', '#ff0077', '#00ff77', '#ffdb19', '#ff4d00', '#7000ff', '#ff0055'];

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.shadowBlur = 10;
                        context.shadowColor = colors[value];
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        context.lineWidth = 0.05;
                        context.strokeStyle = 'white';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        context.shadowBlur = 0;
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        function playerReset() {
            const pieces = 'TJLOSZI';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                updateScore();
            }
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function createArena(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = Math.floor(player.score / 100) + 1;
            dropInterval = 1000 - (Math.floor(player.score / 100) * 100);
        }

        const arena = createArena(12, 20);
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

        document.addEventListener('keydown', event => {
            if (event.keyCode === 37 || event.key === 'a') playerMove(-1);
            else if (event.keyCode === 39 || event.key === 'd') playerMove(1);
            else if (event.keyCode === 40 || event.key === 's') playerDrop();
            else if (event.keyCode === 38 || event.key === 'w') {
                rotate(player.matrix, 1);
                if (collide(arena, player)) rotate(player.matrix, -1);
            }
        });
        
        // 觸控控制
        function setupTouchControls() {
            const rotateBtn = document.getElementById('rotateBtn');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const downBtn = document.getElementById('downBtn');
            
            // 旋轉按鈕
            rotateBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                rotate(player.matrix, 1);
                if (collide(arena, player)) rotate(player.matrix, -1);
            });
            
            rotateBtn.addEventListener('click', () => {
                rotate(player.matrix, 1);
                if (collide(arena, player)) rotate(player.matrix, -1);
            });
            
            // 左移按鈕
            leftBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                playerMove(-1);
            });
            
            leftBtn.addEventListener('click', () => playerMove(-1));
            
            // 右移按鈕
            rightBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                playerMove(1);
            });
            
            rightBtn.addEventListener('click', () => playerMove(1));
            
            // 下移按鈕
            downBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                playerDrop();
            });
            
            downBtn.addEventListener('click', () => playerDrop());
            
            // 滑動控制
            let touchStartX = null;
            let touchStartY = null;
            
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (touchStartX === null || touchStartY === null) return;
                
                const touchX = e.touches[0].clientX;
                const touchY = e.touches[0].clientY;
                const deltaX = touchX - touchStartX;
                const deltaY = touchY - touchStartY;
                
                // 水平滑動控制左右移動
                if (Math.abs(deltaX) > 30) {
                    if (deltaX > 0) playerMove(1);
                    else playerMove(-1);
                    touchStartX = touchX;
                }
                
                // 垂直下滑加速下落
                if (deltaY > 50) {
                    playerDrop();
                    touchStartY = touchY;
                }
            });
            
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchStartX = null;
                touchStartY = null;
            });
        }
        
        // 初始化觸控控制
        if (window.innerWidth <= 768) {
            setupTouchControls();
        }

        playerReset();
        updateScore();
        update();
    </script>
</body>
</html>
