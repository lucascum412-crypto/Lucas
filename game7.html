<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>猜拳 - 遊戲館</title>
    <style>
        body { background: #1a1a2e; color: white; text-align: center; font-family: Arial; padding-top: 80px; }
        .btn { font-size: 3em; cursor: pointer; margin: 10px; background: #16213e; padding: 20px; border-radius: 50%; display: inline-block; border: 2px solid #00f2ff; }
        #res { font-size: 1.5em; margin: 20px; color: #00f2ff; }
        .back-btn { margin-top: 30px; display: inline-block; padding: 10px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>✊✌️🖐️ 猜拳大賽</h2>
    <div id="res">請出拳！</div>
    <div class="btn" onclick="play('🪨')">🪨</div>
    <div class="btn" onclick="play('✂️')">✂️</div>
    <div class="btn" onclick="play('🖐️')">🖐️</div>
    <br><a href="index.html" class="back-btn">回大廳</a>
    <script>
        function play(p) {
            const opts = ['🪨', '✂️', '🖐️'];
            const c = opts[Math.floor(Math.random()*3)];
            let r = "";
            if(p === c) r = `平手！電腦也出 ${c}`;
            else if((p==='🪨'&&c==='✂️')||(p==='✂️'&&c==='🖐️')||(p==='🖐️'&&c==='🪨')) r = `你贏了！電腦出 ${c}`;
            else r = `你輸了！電腦出 ${c}`;
            document.getElementById('res').innerText = r;
        }
    </script>
</body>
</html>
