<!DOCTYPE html>
<html>
<head>
    <title>井字遊戲 - 遊戲館</title>
    <style>
        body { background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: Arial; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; margin-bottom: 20px;}
        .cell { width: 100px; height: 100px; background: #0f3460; font-size: 2em; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; }
        .cell:hover { background: #16213e; }
        .back-btn { padding: 10px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 5px; }
        #status { font-size: 1.5em; margin-bottom: 20px; color: #e94560;}
    </style>
</head>
<body>
    <h2>❌⭕ 井字遊戲</h2>
    <div id="status">輪到 X 玩家</div>
    <div class="board" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>
    <button onclick="resetGame()" style="padding:10px; cursor:pointer; margin-bottom: 10px;">重置遊戲</button>
    <br>
    <a href="index.html" class="back-btn">回大廳</a>

    <script>
        let currentPlayer = 'X';
        let board = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;

        function makeMove(index) {
            if (board[index] === '' && gameActive) {
                board[index] = currentPlayer;
                document.getElementsByClassName('cell')[index].innerText = currentPlayer;
                checkWinner();
                if(gameActive) {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    document.getElementById('status').innerText = "輪到 " + currentPlayer + " 玩家";
                }
            }
        }

        function checkWinner() {
            const winConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (let condition of winConditions) {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    document.getElementById('status').innerText = "玩家 " + board[a] + " 獲勝！";
                    gameActive = false;
                    return;
                }
            }
            if (!board.includes('')) {
                document.getElementById('status').innerText = "平局！";
                gameActive = false;
            }
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            document.querySelectorAll('.cell').forEach(cell => cell.innerText = '');
            document.getElementById('status').innerText = "輪到 X 玩家";
        }
    </script>
</body>
</html>
