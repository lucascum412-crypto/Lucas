<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>猜數字 - 遊戲館</title>
    <style>
        body { background: #1a1a2e; color: white; text-align: center; font-family: Arial; padding-top: 100px; }
        input { padding: 10px; font-size: 1.2em; border-radius: 5px; border: none; width: 100px; text-align: center; }
        button { padding: 10px 20px; font-size: 1em; background: #00f2ff; border: none; border-radius: 5px; cursor: pointer; }
        #msg { margin-top: 20px; font-size: 1.5em; color: #e94560; }
        .back-btn { margin-top: 30px; display: inline-block; padding: 10px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>🔢 猜數字挑戰 (1-100)</h2>
    <input type="number" id="numInp" placeholder="數字">
    <button onclick="guess()">猜！</button>
    <div id="msg">來試試手氣吧！</div>
    <button onclick="window.location.href='index.html#back'">返回大廳</button>
    <script>
        let target = Math.floor(Math.random() * 100) + 1;
        let count = 0;
        function guess() {
            let val = document.getElementById('numInp').value;
            let m = document.getElementById('msg');
            if(!val) return; count++;
            if(val == target) { m.innerText = `猜對了！次數：${count}`; alert("恭喜！"); location.reload(); }
            else if (val > target) m.innerText = "太大了！再小一點";
            else m.innerText = "太小了！再大一點";
            document.getElementById('numInp').value = "";
        }
    </script>
</body>
</html>
