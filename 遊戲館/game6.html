<!DOCTYPE html>
<html>
<head>
    <title>猜數字 - 遊戲館</title>
    <style>
        body { background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: Arial; }
        .container { background: #16213e; padding: 30px; border-radius: 15px; border: 2px solid #e94560; text-align: center; }
        input { padding: 10px; font-size: 1.2em; width: 80px; text-align: center; border-radius: 5px; border: none; }
        button { padding: 10px 20px; font-size: 1em; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px; }
        #message { margin-top: 20px; font-size: 1.2em; color: #00d2ff; }
        .back-btn { margin-top: 20px; padding: 10px 20px; background: #fff; color: #222; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔢 猜數字挑戰</h2>
        <p>我已經選了一個 1 到 100 之間的數字。</p>
        <input type="number" id="guessInput" min="1" max="100">
        <button onclick="checkGuess()">送出</button>
        <div id="message">準備好就開始吧！</div>
        <p>嘗試次數: <span id="attempts">0</span></p>
    </div>
    <a href="index.html" class="back-btn">回大廳</a>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {
            const guess = document.getElementById("guessInput").value;
            const message = document.getElementById("message");
            const attemptsDisplay = document.getElementById("attempts");

            if (!guess || guess < 1 || guess > 100) {
                message.innerText = "請輸入 1 到 100 之間的有效數字！";
                return;
            }

            attempts++;
            attemptsDisplay.innerText = attempts;

            if (guess == randomNumber) {
                message.innerText = `🎉 恭喜！答案就是 ${randomNumber}！`;
                message.style.color = "#4ee44e";
                alert(`太厲害了！你花了 ${attempts} 次猜中。`);
                location.reload();
            } else if (guess > randomNumber) {
                message.innerText = "太大了！再小一點。";
                message.style.color = "#e94560";
            } else {
                message.innerText = "太小了！再大一點。";
                message.style.color = "#00d2ff";
            }
            document.getElementById("guessInput").value = "";
        }
    </script>
</body>
</html>
