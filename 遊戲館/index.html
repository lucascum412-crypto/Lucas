<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 超級遊戲館</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. 全局變數與基礎設定 --- */
        :root {
            --bg-color: #0b0c15;
            --card-bg: #151621;
            --primary-color: #00f2ff; /* 賽博藍 */
            --secondary-color: #ff0055; /* 霓虹紅 */
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --font-main: 'Noto Sans TC', sans-serif;
            --font-retro: 'Press Start 2P', cursive;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- 2. 背景裝飾 (網格效果) --- */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        /* --- 3. 標頭設計 --- */
        header {
            padding: 60px 20px;
            text-align: center;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            border-bottom: 2px solid var(--primary-color);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 2em;
            color: var(--primary-color);
            text-shadow: 2px 2px 0px var(--secondary-color);
            letter-spacing: 2px;
            line-height: 1.4;
            font-family: var(--font-retro); /* 標題使用像素字體 */
        }

        .subtitle {
            margin-top: 15px;
            font-size: 1.1em;
            color: var(--text-muted);
        }

        /* --- 4. 遊戲網格佈局 --- */
        .container {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
        }

        /* --- 5. 遊戲卡片設計 --- */
        .game-card {
            position: relative;
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px 20px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            height: 100%; /* 確保高度一致 */
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary-color);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.3);
        }

        .game-card:hover .icon-wrapper {
            transform: scale(1.2) rotate(5deg);
        }

        .icon-wrapper {
            font-size: 3.5em;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        .card-content h3 {
            margin: 10px 0 5px;
            font-size: 1.4em;
            color: #fff;
        }

        .card-content p {
            font-size: 0.9em;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }

        /* --- 6. 標籤 (Badges) --- */
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.7em;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .hot .badge { background-color: var(--secondary-color); color: white; }
        .new .badge { background-color: var(--primary-color); color: #000; }

        /* --- 7. 鎖定狀態樣式 --- */
        .locked {
            background-color: #1a1a1a;
            border-style: dashed;
            border-color: #444;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .locked:hover {
            transform: none;
            box-shadow: none;
            border-color: #444;
        }

        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .game-card.locked:hover .lock-overlay {
            opacity: 1;
        }

        .lock-icon {
            font-size: 3em;
        }

        /* --- 8. 頁尾 --- */
        footer {
            padding: 30px;
            text-align: center;
            color: #666;
            font-size: 0.8em;
            border-top: 1px solid #222;
            margin-top: auto;
        }

        /* 手機適配 */
        @media (max-width: 600px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <div class="header-content">
            <h1>🎮 HTML5 超級遊戲館 🕹️</h1>
            <p class="subtitle">READY PLAYER ONE? 選擇你的挑戰！</p>
        </div>
    </header>

    <main class="container">
        <div class="game-grid">
            <a href="game1.html" class="game-card hot">
                <span class="badge">🔥 熱門</span>
                <div class="icon-wrapper">🐍</div>
                <div class="card-content">
                    <h3>少林武俠</h3>
                    <p>經典不敗的貪吃蛇反應遊戲</p>
                </div>
            </a>

            <a href="game2.html" class="game-card new">
                <span class="badge">🆕 新品</span>
                <div class="icon-wrapper">❌⭕</div>
                <div class="card-content">
                    <h3>井字遊戲</h3>
                    <p>雙人對戰智力比拼</p>
                </div>
            </a>

            <a href="game3.html" class="game-card">
                <div class="icon-wrapper">⚡</div>
                <div class="card-content">
                    <h3>極速點擊</h3>
                    <p>測試你的手速極限 APM</p>
                </div>
            </a>

            <div class="game-card locked">
                <div class="lock-overlay"><span class="lock-icon">🔒</span></div>
                <div class="icon-wrapper">🧱</div>
                <div class="card-content">
                    <h3>打磚塊</h3>
                    <p>即將推出</p>
                </div>
            </div>

            <div class="game-card locked">
                <div class="lock-overlay"><span class="lock-icon">🔒</span></div>
                <div class="icon-wrapper">🃏</div>
                <div class="card-content"><h3>記憶翻牌</h3></div>
            </div>

            <div class="game-card locked">
                <div class="lock-overlay"><span class="lock-icon">🔒</span></div>
                <div class="icon-wrapper">🔢</div>
                <div class="card-content"><h3>猜數字</h3></div>
            </div>
            
            <div class="game-card locked">
                <div class="lock-overlay"><span class="lock-icon">🔒</span></div>
                <div class="icon-wrapper">🚀</div>
                <div class="card-content"><h3>太空射擊</h3></div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2024 HTML5 超級遊戲館 | Press Start to Play</p>
    </footer>

</body>
</html>
