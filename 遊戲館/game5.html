<!DOCTYPE html>
<html>
<head>
    <title>記憶翻牌 - 遊戲館</title>
    <style>
        body { background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: Arial; }
        .grid { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; }
        .card { width: 80px; height: 80px; background-color: #0f3460; display: flex; align-items: center; justify-content: center; font-size: 2em; cursor: pointer; border-radius: 5px; user-select: none; }
        .flipped { background-color: #fff; color: #000; }
        .matched { background-color: #e94560; border-color: #e94560; }
        .back-btn { margin-top: 20px; padding: 10px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>🧠 記憶翻牌</h2>
    <p>找出所有相同的配對！</p>
    <div class="grid" id="grid"></div>
    <br>
    <a href="index.html" class="back-btn">回大廳</a>

    <script>
        const symbols = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍉', '🍉', '🍒', '🍒', '🍍', '🍍', '🥝', '🥝', '🥑', '🥑'];
        let cardsChosen = [];
        let cardsChosenId = [];
        let cardsWon = [];

        // 洗牌
        symbols.sort(() => 0.5 - Math.random());

        const grid = document.getElementById('grid');

        function createBoard() {
            for (let i = 0; i < symbols.length; i++) {
                const card = document.createElement('div');
                card.setAttribute('data-id', i);
                card.classList.add('card');
                card.innerText = '❓';
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            }
        }

        function checkForMatch() {
            const cards = document.querySelectorAll('.card');
            const optionOneId = cardsChosenId[0];
            const optionTwoId = cardsChosenId[1];

            if (cardsChosen[0] === cardsChosen[1] && optionOneId !== optionTwoId) {
                cards[optionOneId].classList.add('matched');
                cards[optionTwoId].classList.add('matched');
                cardsWon.push(cardsChosen);
            } else {
                cards[optionOneId].innerText = '❓';
                cards[optionOneId].classList.remove('flipped');
                cards[optionTwoId].innerText = '❓';
                cards[optionTwoId].classList.remove('flipped');
            }
            cardsChosen = [];
            cardsChosenId = [];

            if (cardsWon.length === symbols.length / 2) {
                setTimeout(() => alert('恭喜！你完成了所有配對！'), 500);
            }
        }

        function flipCard() {
            let cardId = this.getAttribute('data-id');
            if (!this.classList.contains('flipped') && !this.classList.contains('matched') && cardsChosen.length < 2) {
                cardsChosen.push(symbols[cardId]);
                cardsChosenId.push(cardId);
                this.classList.add('flipped');
                this.innerText = symbols[cardId];
                if (cardsChosen.length === 2) {
                    setTimeout(checkForMatch, 500);
                }
            }
        }

        createBoard();
    </script>
</body>
</html>
