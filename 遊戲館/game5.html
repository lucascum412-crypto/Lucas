<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>記憶翻牌 - 遊戲館</title>
    <style>
        body { background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: Arial; }
        .memory-game { width: 440px; height: 440px; display: flex; flex-wrap: wrap; perspective: 1000px; }
        .card { width: 100px; height: 100px; position: relative; margin: 5px; transform: scale(1); transform-style: preserve-3d; transition: transform .5s; cursor: pointer; }
        .card.flip { transform: rotateY(180deg); }
        .front-face, .back-face { width: 100%; height: 100%; position: absolute; border-radius: 5px; background: #16213e; border: 2px solid #0f3460; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; }
        .front-face { transform: rotateY(180deg); background: #fff; color: #333; font-size: 3em; }
        .back-face { color: #e94560; font-size: 2em; }
        .back-btn { margin-top: 20px; padding: 10px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>🧠 記憶翻牌挑戰</h2>
    <div class="memory-game" id="grid"></div>
    <a href="index.html" class="back-btn">回大廳</a>
    <script>
        const cardsArray = ['🐱', '🐱', '🐶', '🐶', '🦊', '🦊', '🐸', '🐸', '🦄', '🦄', '🐲', '🐲', '🐙', '🐙', '🦋', '🦋'];
        const grid = document.getElementById('grid');
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedCount = 0;

        function createBoard() {
            cardsArray.sort(() => 0.5 - Math.random());
            cardsArray.forEach(text => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.framework = text;
                card.innerHTML = `<div class="front-face">${text}</div><div class="back-face">❓</div>`;
                grid.appendChild(card);
                card.addEventListener('click', flipCard);
            });
        }

        function flipCard() {
            if (lockBoard || this === firstCard) return;
            this.classList.add('flip');
            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }
            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;
            if (isMatch) {
                firstCard.removeEventListener('click', flipCard);
                secondCard.removeEventListener('click', flipCard);
                matchedCount += 2;
                resetBoard();
                if(matchedCount === cardsArray.length) setTimeout(() => alert("恭喜獲勝！"), 500);
            } else {
                lockBoard = true;
                setTimeout(() => {
                    firstCard.classList.remove('flip');
                    secondCard.classList.remove('flip');
                    resetBoard();
                }, 1000);
            }
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }
        createBoard();
    </script>
</body>
</html>
