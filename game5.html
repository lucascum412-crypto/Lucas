<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>記憶翻牌進化版 - 遊戲館</title>
    <style>
        :root { 
            --primary: #00f2ff; 
            --bg: #0d0d1a; 
            --danger: #e94560; 
            --card-size: min(80px, 15vw);
            --card-margin: min(5px, 1.5vw);
        }
        body { 
            background: var(--bg); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: Arial; 
            touch-action: manipulation;
            padding: min(10px, 2vw);
        }
        .stats { 
            margin-bottom: min(15px, 3vw); 
            font-size: clamp(1em, 4vw, 1.2em); 
            color: var(--primary); 
            font-weight: bold; 
        }
        .memory-game { 
            display: flex; 
            flex-wrap: wrap; 
            perspective: 1000px; 
            margin: 0 auto; 
            max-width: 100%;
            justify-content: center;
        }
        .card { 
            width: var(--card-size); 
            height: var(--card-size); 
            margin: var(--card-margin); 
            position: relative; 
            transform-style: preserve-3d; 
            transition: transform .5s; 
            cursor: pointer; 
        }
        .card.flip { transform: rotateY(180deg); }
        .card:active { transform: rotateY(180deg) scale(0.95); }
        .front, .back { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            border-radius: min(8px, 1.5vw); 
            backface-visibility: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid var(--primary); 
            box-sizing: border-box; 
        }
        .front { 
            background: #fff; 
            transform: rotateY(180deg); 
            font-size: clamp(1.5em, 5vw, 2em); 
        }
        .back { 
            background: #16213e; 
            color: var(--danger); 
            font-size: clamp(1em, 4vw, 1.5em); 
            font-weight: bold; 
        }
        .back-btn { 
            margin-top: min(30px, 6vw); 
            padding: min(10px, 2.5vw) min(25px, 5vw); 
            background: var(--danger); 
            color: white; 
            text-decoration: none; 
            border-radius: clamp(25px, 5vw, 50px); 
            font-weight: bold; 
            font-size: clamp(14px, 3.5vw, 16px);
        }
        
        @media (max-width: 480px) {
            .memory-game { max-width: 95vw; }
        }
    </style>
</head>
<body>
    <div class="stats">
        關卡: <span id="lvl">1</span>/5 | 時間: <span id="timer">0</span>s
    </div>
    <div class="memory-game" id="game-board"></div>
    <button onclick="window.location.href='index.html#back'">返回大廳</button>

    <script>
        const emojis = ['🐱','🐶','🦊','🐸','🦄','🐲','🐙','🦋','🦁','🐯','🐼','🐨','🐷','🐸','🐵','🐔','🐧','🐦'];
        let level = 1;
        let matched = 0;
        let hasFlipped = false, lock = false, first, second;
        let startTime = Date.now();
        let timerInterval;

        const levels = [
            { pairs: 6, cols: 4 }, // 12 張
            { pairs: 8, cols: 4 }, // 16 張
            { pairs: 10, cols: 5 }, // 20 張
            { pairs: 12, cols: 6 }, // 24 張
            { pairs: 18, cols: 6 }  // 36 張
        ];

        function startTimer() {
            timerInterval = setInterval(() => {
                document.getElementById('timer').innerText = Math.floor((Date.now() - startTime) / 1000);
            }, 1000);
        }

        function createBoard() {
            const config = levels[level-1];
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            board.style.width = `${config.cols * 90}px`;
            
            let gameEmojis = emojis.slice(0, config.pairs);
            let deck = [...gameEmojis, ...gameEmojis];
            deck.sort(() => Math.random() - 0.5);

            matched = 0;
            document.getElementById('lvl').innerText = level;

            deck.forEach(emoji => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.icon = emoji;
                card.innerHTML = `<div class="front">${emoji}</div><div class="back">?</div>`;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lock || this === first) return;
            this.classList.add('flip');
            if (!hasFlipped) { hasFlipped = true; first = this; return; }
            second = this;
            checkMatch();
        }

        function checkMatch() {
            let isMatch = first.dataset.icon === second.dataset.icon;
            if (isMatch) {
                matched += 2;
                resetCards();
                if(matched === levels[level-1].pairs * 2) {
                    setTimeout(() => {
                        if(level < 5) {
                            alert(`第 ${level} 關完成！`);
                            level++; createBoard();
                        } else {
                            alert(`全關卡達成！總耗時: ${document.getElementById('timer').innerText}秒`);
                            location.reload();
                        }
                    }, 500);
                }
            } else {
                lock = true;
                setTimeout(() => {
                    first.classList.remove('flip');
                    second.classList.remove('flip');
                    resetCards();
                }, 1000);
            }
        }

        function resetCards() { [hasFlipped, lock] = [false, false]; [first, second] = [null, null]; }

        createBoard();
        startTimer();
    </script>
</body>
</html>
