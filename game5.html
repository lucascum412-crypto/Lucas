<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>記憶翻牌 - 遊戲館</title>
    <style>
        body { background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: Arial; }
        .memory-game { width: 440px; display: flex; flex-wrap: wrap; perspective: 1000px; }
        .card { width: 100px; height: 100px; margin: 5px; position: relative; transform-style: preserve-3d; transition: transform .5s; cursor: pointer; }
        .card.flip { transform: rotateY(180deg); }
        .front, .back { width: 100%; height: 100%; position: absolute; border-radius: 8px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 3em; border: 2px solid #00f2ff; }
        .front { background: #fff; transform: rotateY(180deg); }
        .back { background: #16213e; color: #e94560; }
        .back-btn { margin-top: 20px; padding: 10px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>🧠 記憶翻牌</h2>
    <div class="memory-game" id="game-board"></div>
    <a href="index.html" class="back-btn">回大廳</a>
    <script>
        const cards = ['🐱','🐱','🐶','🐶','🦊','🦊','🐸','🐸','🦄','🦄','🐲','🐲','🐙','🐙','🦋','🦋'];
        let hasFlipped = false, lock = false, first, second, matched = 0;
        function create() {
            cards.sort(() => Math.random() - 0.5);
            const board = document.getElementById('game-board');
            cards.forEach(emoji => {
                const c = document.createElement('div');
                c.className = 'card'; c.dataset.icon = emoji;
                c.innerHTML = `<div class="front">${emoji}</div><div class="back">?</div>`;
                c.addEventListener('click', flip); board.appendChild(c);
            });
        }
        function flip() {
            if (lock || this === first) return;
            this.classList.add('flip');
            if (!hasFlipped) { hasFlipped = true; first = this; return; }
            second = this; check();
        }
        function check() {
            let isMatch = first.dataset.icon === second.dataset.icon;
            if (isMatch) { matched += 2; reset(); if(matched === 16) alert("完美記憶！"); }
            else { lock = true; setTimeout(() => { first.classList.remove('flip'); second.classList.remove('flip'); reset(); }, 1000); }
        }
        function reset() { [hasFlipped, lock] = [false, false]; [first, second] = [null, null]; }
        create();
    </script>
</body>
</html>
