<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>霓虹飛行員 - 遊戲館</title>
    <style>
        :root { --primary: #00f2ff; --bg: #0d0d1a; --danger: #e94560; --accent: #7000ff; }
        body { background: var(--bg); text-align: center; font-family: 'Segoe UI', Arial; color: white; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { background: #16213e; border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); border-radius: 10px; cursor: pointer; }
        .back-btn { margin-top: 15px; padding: 10px 30px; background: var(--danger); color: white; text-decoration: none; border-radius: 50px; font-weight: bold; transition: 0.3s; z-index: 10; }
        .back-btn:hover { box-shadow: 0 0 15px var(--danger); transform: scale(1.1); }
        .score-board { font-size: 28px; color: var(--primary); margin-bottom: 10px; font-weight: bold; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
    </style>
</head>
<body onclick="handleClick()">
    <div class="score-board">SCORE: <span id="s">0</span></div>
    <canvas id="c" width="400" height="500"></canvas>
    <button onclick="window.location.href='index.html#back'">返回大廳</button>

    <script>
        const cvs = document.getElementById("c");
        const ctx = cvs.getContext("2d");
        
        let birdY, v, g, pipes, score, over;

        // 初始化/重置遊戲狀態
        function initGame() {
            birdY = 250;
            v = 0;
            g = 0.25;
            pipes = [];
            score = 0;
            over = false;
            document.getElementById('s').innerText = score;
            draw(); 
        }

        // 處理跳躍與重新開始
        function handleClick() {
            if (over) {
                initGame(); // 輸掉後點擊重新開始
            } else {
                v = -5; // 遊戲中點擊跳躍
            }
        }

        // 鍵盤監聽
        window.addEventListener("keydown", e => {
            if (e.code === "Space") {
                if (over) {
                    initGame(); // 輸掉後按空白鍵重新開始
                } else {
                    v = -5; // 遊戲中按空白鍵跳躍
                }
                e.preventDefault(); // 防止網頁捲動
            }
        });

        function draw() {
            if (over) {
                // 繪製遊戲結束畫面
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, cvs.width, cvs.height);
                ctx.fillStyle = "#e94560";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", cvs.width/2, 220);
                
                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.fillText("得分: " + score, cvs.width/2, 260);
                
                ctx.fillStyle = "#00f2ff";
                ctx.font = "18px Arial";
                ctx.fillText("按空白鍵或點擊畫面重啟", cvs.width/2, 310);
                return;
            }

            ctx.clearRect(0, 0, cvs.width, cvs.height);
            
            // 繪製玩家 (霓虹青)
            v += g;
            birdY += v;
            ctx.fillStyle = "#00f2ff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f2ff";
            ctx.fillRect(50, birdY, 30, 30);
            ctx.shadowBlur = 0;

            // 障礙物邏輯
            if (pipes.length == 0 || pipes[pipes.length - 1].x < 220) {
                let gap = 130;
                let h = Math.random() * (cvs.height - gap - 100) + 50;
                pipes.push({ x: 400, t: h, b: cvs.height - h - gap });
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 3;
                
                // 繪製管子 (霓虹紫)
                ctx.fillStyle = "#7000ff";
                ctx.fillRect(pipes[i].x, 0, 60, pipes[i].t);
                ctx.fillRect(pipes[i].x, cvs.height - pipes[i].b, 60, pipes[i].b);
                
                // 碰撞檢查
                if (50 + 30 > pipes[i].x && 50 < pipes[i].x + 60 && 
                   (birdY < pipes[i].t || birdY + 30 > cvs.height - pipes[i].b)) {
                    over = true;
                }
                
                // 加分
                if (pipes[i].x === 49) { // 精確判斷通過瞬間
                    score++;
                    document.getElementById('s').innerText = score;
                }
                
                // 移除螢幕外的管子
                if (pipes[i].x < -60) pipes.splice(i, 1);
            }

            // 掉出邊界檢查
            if (birdY > cvs.height || birdY < -30) over = true;

            requestAnimationFrame(draw);
        }

        // 啟動遊戲
        initGame();
    </script>
</body>
</html>
