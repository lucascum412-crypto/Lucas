<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>飛行員 - 遊戲館</title>
    <style>
        body { background: #222; text-align: center; font-family: Arial; color: white; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;}
        canvas { background: #70c5ce; border: 2px solid #fff; }
        .back-btn { margin-top: 10px; padding: 10px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body onclick="jump()">
    <h2>🚀 方塊飛行員 (點擊跳躍)</h2>
    <canvas id="c" width="320" height="480"></canvas>
    <br><a href="index.html" class="back-btn">回大廳</a>
    <script>
        const cvs = document.getElementById("c"); const ctx = cvs.getContext("2d");
        let birdY = 200, v = 0, g = 0.2, pipes = [], score = 0, over = false;
        function jump() { if(over) location.reload(); v = -4.5; }
        window.addEventListener("keydown", e => { if(e.code==="Space") jump(); });
        function draw() {
            ctx.fillStyle = "#70c5ce"; ctx.fillRect(0,0,cvs.width,cvs.height);
            v += g; birdY += v; ctx.fillStyle = "yellow"; ctx.fillRect(50, birdY, 30, 30);
            if(pipes.length==0 || pipes[pipes.length-1].x < 170) {
                let h = Math.random()*200 + 50; pipes.push({x:320, t:h, b:480-h-120});
            }
            for(let i=pipes.length-1; i>=0; i--) {
                pipes[i].x -= 2; ctx.fillStyle = "green";
                ctx.fillRect(pipes[i].x, 0, 50, pipes[i].t);
                ctx.fillRect(pipes[i].x, 480-pipes[i].b, 50, pipes[i].b);
                if(50+30 > pipes[i].x && 50 < pipes[i].x+50 && (birdY < pipes[i].t || birdY+30 > 480-pipes[i].b)) over = true;
                if(pipes[i].x == 50) score++;
                if(pipes[i].x < -50) pipes.splice(i, 1);
            }
            if(birdY > 480 || birdY < 0) over = true;
            ctx.fillStyle = "white"; ctx.font = "20px Arial"; ctx.fillText("分數: "+score, 10, 25);
            if(!over) requestAnimationFrame(draw); else alert("遊戲結束！分數: "+score);
        }
        draw();
    </script>
</body>
</html>
