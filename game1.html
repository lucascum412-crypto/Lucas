<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>RONIN DUEL - 難度選擇</title>
    <style>
        :root {
            --bg: #0d0c0a; --p1-color: #8b0000; --ai-color: #2f4f4f;
            --gold: #d4af37; --paper: #e6dccd; --ink: #1a1a1a;
        }
        body { 
            margin: 0; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: serif; 
            overflow: hidden; 
            touch-action: none;
            padding: min(20px, 3vw);
        }
        #gameContainer { 
            position: relative; 
            border: min(8px, 1.5vw) double var(--ink); 
            background: var(--paper); 
            overflow: hidden; 
            max-width: 95vw;
            max-height: 80vh;
        }
        canvas { 
            display: block; 
            max-width: 100%;
            max-height: 100%;
        }
        
        /* UI 系統 */
        .hud { position: absolute; top: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 50px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .stats { width: 300px; }
        .label { font-size: 18px; margin-bottom: 5px; font-weight: 900; color: var(--ink); }
        .bar-outer { height: 14px; background: rgba(0,0,0,0.1); border: 2px solid var(--ink); position: relative; }
        .bar-inner { height: 100%; position: absolute; transition: width 0.2s; }
        #p1HP { background: var(--p1-color); }
        #aiHP { background: var(--ai-color); right: 0; }
        .stamina-bar { height: 4px; width: 0%; background: var(--gold); margin-top: 4px; }

        #overlay, #winScreen { position: absolute; inset: 0; background: var(--paper); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; width: 220px; }
        .btn { 
            padding: clamp(10px, 2.5vw, 12px); 
            background: var(--ink); 
            color: var(--paper); 
            border: 1px solid var(--gold); 
            cursor: pointer; 
            font-size: clamp(14px, 3.5vw, 18px); 
            letter-spacing: clamp(3px, 1vw, 5px); 
            font-weight: bold; 
            transition: transform 0.1s;
        }
        .btn:hover { background: var(--gold); color: var(--ink); }
        .btn:active { transform: scale(0.95); }
        .btn-diff { font-size: clamp(12px, 3vw, 14px); letter-spacing: clamp(2px, 0.8vw, 2px); }
        
        .difficulty-indicator { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--ink); letter-spacing: 5px; opacity: 0.5; }
        .hint { 
            position: absolute; 
            bottom: min(20px, 4vw); 
            color: var(--ink); 
            font-size: clamp(10px, 2.5vw, 12px); 
        }
        
        /* 觸控控制 */
        .touch-controls {
            position: fixed;
            bottom: min(30px, 5vw);
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: min(15px, 3vw);
            z-index: 1000;
        }
        
        .touch-btn {
            width: min(50px, 10vw);
            height: min(50px, 10vw);
            background: rgba(139, 0, 0, 0.3);
            border: 2px solid var(--p1-color);
            border-radius: 50%;
            color: var(--paper);
            font-size: clamp(12px, 3vw, 16px);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .touch-btn:active {
            background: rgba(139, 0, 0, 0.6);
            transform: scale(0.9);
        }
        
        .touch-controls-row {
            display: flex;
            gap: min(10px, 2vw);
            align-items: center;
        }
        
        .move-controls {
            position: fixed;
            left: min(30px, 5vw);
            bottom: min(30px, 5vw);
            display: none;
            z-index: 1000;
        }
        
        .dpad {
            position: relative;
            width: min(120px, 20vw);
            height: min(120px, 20vw);
        }
        
        .dpad-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--ink);
            color: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .dpad-btn:active {
            background: rgba(0, 0, 0, 0.8);
        }
        
        .dpad-up {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(40px, 8vw);
            height: min(40px, 8vw);
        }
        
        .dpad-down {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(40px, 8vw);
            height: min(40px, 8vw);
        }
        
        .dpad-left {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: min(40px, 8vw);
            height: min(40px, 8vw);
        }
        
        .dpad-right {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: min(40px, 8vw);
            height: min(40px, 8vw);
        }
        
        @media (max-width: 768px) {
            .touch-controls, .move-controls { display: block; }
            .hint { display: none; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="diffTag" class="difficulty-indicator"></div>

    <div class="hud" id="gameHUD" style="display:none;">
        <div class="stats">
            <div class="label">赤流</div>
            <div class="bar-outer"><div id="p1HP" class="bar-inner" style="width: 100%;"></div></div>
            <div id="p1EN" class="stamina-bar"></div>
        </div>
        <div class="stats" style="text-align:right;">
            <div class="label">墨影</div>
            <div class="bar-outer"><div id="aiHP" class="bar-inner" style="width: 100%;"></div></div>
            <div id="aiEN" class="stamina-bar" style="margin-left: auto;"></div>
        </div>
    </div>

    <div id="overlay">
        <h1 style="font-size: 60px; letter-spacing: 15px; margin-bottom: 30px;">浪人道</h1>
        <div class="btn-group">
            <button class="btn btn-diff" onclick="startGame('EASY')">入門 (EASY)</button>
            <button class="btn btn-diff" onclick="startGame('NORMAL')">劍士 (NORMAL)</button>
            <button class="btn btn-diff" onclick="startGame('MASTER')">劍聖 (MASTER)</button>
            <button onclick="window.location.href='index.html#back'">返回大廳</button>
        </div>
    </div>

    <div id="winScreen" style="display:none;">
        <h2 id="resultMsg" style="font-size:40px;">勝負已分</h2>
        <div class="btn-group">
            <button class="btn" onclick="location.reload()">再戰</button>
            <button onclick="window.location.href='index.html#back'">返回大廳</button>
        </div>
    </div>

    <canvas id="stage" width="1000" height="500"></canvas>
    <div class="hint">背後不設防 | 劍聖難度下 AI 會進行瞬移繞背</div>
    
    <!-- 觸控控制 -->
    <div class="touch-controls">
        <div class="touch-controls-row">
            <div class="touch-btn" id="attackBtn">攻</div>
            <div class="touch-btn" id="blockBtn">防</div>
            <div class="touch-btn" id="dashBtn">衝</div>
        </div>
    </div>
    
    <div class="move-controls">
        <div class="dpad">
            <div class="dpad-btn dpad-up" id="upBtn">↑</div>
            <div class="dpad-btn dpad-down" id="downBtn">↓</div>
            <div class="dpad-btn dpad-left" id="leftBtn">←</div>
            <div class="dpad-btn dpad-right" id="rightBtn">→</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const keys = {};
    let gameRunning = false, shake = 0, particles = [], hitStop = 0;
    let currentDifficulty = 'NORMAL';

    const COLOR_P1 = '#8b0000', COLOR_AI = '#2f4f4f', COLOR_GOLD = '#d4af37', COLOR_INK = '#1a1a1a', COLOR_PAPER = '#e6dccd';
    const MIN_Y = 280, MAX_Y = 460;

    // 難度配置表
    const DIFF_SETTINGS = {
        'EASY':   { aiReaction: 0.02, aiBlockChance: 0.1, aiDashChance: 0,   aiEnRegen: 0.2 },
        'NORMAL': { aiReaction: 0.05, aiBlockChance: 0.3, aiDashChance: 0.05, aiEnRegen: 0.4 },
        'MASTER': { aiReaction: 0.09, aiBlockChance: 0.6, aiDashChance: 0.15, aiEnRegen: 0.8 }
    };

    function backToHub() { window.location.href = `index.html`; }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random()-0.5)*8; this.vy = (Math.random()-0.5)*8;
            this.life = 1.0; this.color = color;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.05; }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, 3, 3);
            ctx.globalAlpha = 1.0; 
        }
    }

    class Fighter {
        constructor(x, y, color, isAI) {
            this.pos = {x, y}; this.vel = {x: 0, y: 0};
            this.color = color; this.isAI = isAI;
            this.hp = 100; this.en = 0;
            this.facing = isAI ? -1 : 1;
            this.state = 'IDLE'; this.timer = 0;
            this.blockHits = 0;
        }

        draw() {
            const scale = 0.75 + (this.pos.y - MIN_Y) / (MAX_Y - MIN_Y) * 0.45;
            ctx.save();
            ctx.translate(this.pos.x, this.pos.y);
            ctx.scale(scale * this.facing, scale);
            if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            ctx.fillStyle = 'rgba(0,0,0,0.15)'; // 影子
            ctx.beginPath(); ctx.ellipse(0, 0, 35, 8, 0, 0, Math.PI*2); ctx.fill();
            ctx.translate(0, -65);
            ctx.fillStyle = (this.state === 'HURT' || this.state === 'STUNNED') ? '#fff' : this.color;
            ctx.beginPath(); // 浪人模組
            ctx.moveTo(-25, 45); ctx.lineTo(25, 45); ctx.lineTo(15, -10); ctx.lineTo(-15, -10); ctx.fill();
            ctx.fillRect(-18, -35, 36, 30);
            ctx.fillStyle = COLOR_INK; ctx.fillRect(-20, -10, 40, 6);
            ctx.fillStyle = '#f3d1b0'; ctx.fillRect(-8, -52, 16, 18);
            ctx.fillStyle = '#7a6851'; ctx.beginPath(); ctx.moveTo(-40, -48); ctx.lineTo(40, -48); ctx.lineTo(0, -80); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = COLOR_INK; ctx.lineWidth = 3;
            if(this.state === 'ATTACK') { ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(65, -15); ctx.stroke(); }
            else if(this.state === 'BLOCK') { ctx.strokeStyle = COLOR_GOLD; ctx.beginPath(); ctx.moveTo(15, 20); ctx.lineTo(25, -50); ctx.stroke(); }
            ctx.restore();
        }

        update(target) {
            if(hitStop > 0) return;
            this.pos.x += this.vel.x; this.pos.y += this.vel.y;
            this.vel.x *= 0.8; this.vel.y *= 0.8;
            this.pos.x = Math.max(70, Math.min(canvas.width-70, this.pos.x));
            this.pos.y = Math.max(MIN_Y, Math.min(MAX_Y, this.pos.y));
            if(this.timer > 0) {
                this.timer--;
                if(this.timer === 0) this.state = 'IDLE';
            }
            const regen = this.isAI ? DIFF_SETTINGS[currentDifficulty].aiEnRegen : 0.4;
            this.en = Math.min(100, this.en + regen);
            document.getElementById(this.isAI ? 'aiEN' : 'p1EN').style.width = this.en + '%';
            this.draw();
        }

        perform(type, target) {
            if(this.state !== 'IDLE' && this.state !== 'BLOCK') return;
            if(type === 'ATTACK') {
                this.state = 'ATTACK'; this.timer = 18;
                if(Math.abs(this.pos.x - target.pos.x) < 135 && Math.abs(this.pos.y - target.pos.y) < 45) target.getHit(12, this.facing, this.pos.x);
            } else if(type === 'DASH' && this.en >= 35) {
                this.en -= 35; this.pos.x += this.facing * 200; this.state = 'IDLE';
            }
        }

        getHit(dmg, dir, attackerX) {
            const isFront = (attackerX > this.pos.x && this.facing === 1) || (attackerX < this.pos.x && this.facing === -1);
            if(this.state === 'BLOCK' && isFront) {
                this.blockHits++; shake = 5;
                if(this.blockHits >= 5) { this.state = 'STUNNED'; this.timer = 100; this.blockHits = 0; shake = 25; }
            } else {
                this.hp -= dmg; this.state = 'HURT'; this.timer = 15;
                this.vel.x = dir * 15; shake = 10; hitStop = 3;
                for(let i=0; i<10; i++) particles.push(new Particle(this.pos.x, this.pos.y-40, this.color));
            }
            document.getElementById(this.isAI ? 'aiHP' : 'p1HP').style.width = Math.max(0, this.hp) + '%';
            if(this.hp <= 0) endGame(this.isAI ? 'WIN' : 'LOSS');
        }
    }

    let p1, ai;
    function startGame(diff) {
        currentDifficulty = diff;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('gameHUD').style.display = 'flex';
        document.getElementById('diffTag').innerText = "難度：" + diff;
        p1 = new Fighter(200, 380, COLOR_P1, false);
        ai = new Fighter(800, 380, COLOR_AI, true);
        gameRunning = true; mainLoop();
    }

    function mainLoop() {
        if(!gameRunning) return;
        ctx.globalAlpha = 1.0; ctx.fillStyle = COLOR_PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);

        if(hitStop > 0) { hitStop--; p1.draw(); ai.draw(); requestAnimationFrame(mainLoop); return; }

        // P1
        if(p1.state === 'IDLE' || p1.state === 'BLOCK') {
            if(keys['w']) p1.vel.y = -6; if(keys['s']) p1.vel.y = 6;
            if(keys['a']) { p1.vel.x = -8; p1.facing = -1; }
            if(keys['d']) { p1.vel.x = 8; p1.facing = 1; }
            if(keys['j']) p1.perform('ATTACK', ai);
            if(keys['k']) p1.state = 'BLOCK'; else if(p1.state === 'BLOCK') p1.state = 'IDLE';
            if(keys['l']) p1.perform('DASH', ai);
        }

        // AI 邏輯 (難度感知)
        const cfg = DIFF_SETTINGS[currentDifficulty];
        if(ai.state === 'IDLE') {
            const dx = p1.pos.x - ai.pos.x;
            const dy = p1.pos.y - ai.pos.y;
            ai.facing = dx > 0 ? 1 : -1;

            // 劍聖特有：偵測玩家攻擊並進行瞬移繞背
            if(currentDifficulty === 'MASTER' && p1.state === 'ATTACK' && Math.abs(dx) < 150 && ai.en >= 35 && Math.random() < cfg.aiDashChance) {
                ai.perform('DASH', p1);
            } else {
                if(Math.abs(dx) > 110) ai.vel.x = ai.facing * 4;
                if(Math.abs(dy) > 20) ai.vel.y = dy > 0 ? 3 : -3;
                if(Math.abs(dx) < 140 && Math.abs(dy) < 50) {
                    if(Math.random() < cfg.aiReaction) ai.perform('ATTACK', p1);
                    if(p1.state === 'ATTACK' && Math.random() < cfg.aiBlockChance) ai.state = 'BLOCK';
                }
            }
        }

        p1.update(ai); ai.update(p1);
        particles = particles.filter(p => { p.update(); p.draw(); return p.life > 0; });
        if(shake > 0) shake--;
        requestAnimationFrame(mainLoop);
    }

    function endGame(res) {
        gameRunning = false;
        document.getElementById('winScreen').style.display = 'flex';
        document.getElementById('resultMsg').innerText = res === 'WIN' ? "一閃 · 勝立" : "殞落";
    }

    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;
    
    // 觸控控制
    function setupTouchControls() {
        const attackBtn = document.getElementById('attackBtn');
        const blockBtn = document.getElementById('blockBtn');
        const dashBtn = document.getElementById('dashBtn');
        const upBtn = document.getElementById('upBtn');
        const downBtn = document.getElementById('downBtn');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        
        // 攻擊按鈕
        attackBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['j'] = true;
        });
        
        attackBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys['j'] = false;
        });
        
        // 防禦按鈕
        blockBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['k'] = true;
        });
        
        blockBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys['k'] = false;
        });
        
        // 衝刺按鈕
        dashBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['l'] = true;
        });
        
        dashBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys['l'] = false;
        });
        
        // 方向按鈕
        upBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['w'] = true;
        });
        
        upBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys['w'] = false;
        });
        
        downBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['s'] = true;
        });
        
        downBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys['s'] = false;
        });
        
        leftBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['a'] = true;
        });
        
        leftBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys['a'] = false;
        });
        
        rightBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['d'] = true;
        });
        
        rightBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys['d'] = false;
        });
        
        // 滑動控制
        let touchStartX = null;
        let touchStartY = null;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (touchStartX === null || touchStartY === null) return;
            
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            const deltaX = touchX - touchStartX;
            const deltaY = touchY - touchStartY;
            
            // 重置所有方向鍵
            keys['w'] = false;
            keys['s'] = false;
            keys['a'] = false;
            keys['d'] = false;
            
            // 根據滑動方向設置移動
            if (Math.abs(deltaX) > 20) {
                if (deltaX > 0) keys['d'] = true;
                else keys['a'] = true;
            }
            
            if (Math.abs(deltaY) > 20) {
                if (deltaY > 0) keys['s'] = true;
                else keys['w'] = true;
            }
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchStartX = null;
            touchStartY = null;
            keys['w'] = false;
            keys['s'] = false;
            keys['a'] = false;
            keys['d'] = false;
        });
    }
    
    // 初始化觸控控制
    if (window.innerWidth <= 768) {
        setupTouchControls();
    }
</script>
</body>
</html>
