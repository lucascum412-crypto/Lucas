<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>ARCADE FIGHTER - Evolution</title>
    <style>
        :root {
            --bg-color: #050510;
            --primary: #00f2ff;
            --secondary: #e94560;
        }
        body { margin: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #gameContainer { position: relative; border: 4px solid #1a1a2e; box-shadow: 0 0 50px rgba(0, 242, 255, 0.15); border-radius: 12px; }
        canvas { background: radial-gradient(circle, #16213e 0%, #0d0d1a 100%); display: block; }
        
        /* UI 層級 */
        #mainMenu, #gameOverMenu { position: absolute; inset: 0; background: rgba(5, 5, 16, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .title { font-size: 50px; color: var(--primary); text-shadow: 0 0 20px var(--primary); margin-bottom: 40px; font-weight: 900; letter-spacing: 5px; }
        .mode-btn { padding: 15px 60px; font-size: 18px; cursor: pointer; background: #1a1a2e; color: white; border: 2px solid #333; margin: 10px; border-radius: 4px; transition: 0.2s; width: 300px; text-transform: uppercase; }
        .mode-btn:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); transform: scale(1.05); }
        
        .ui-overlay { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .health-container { width: 350px; }
        .bar-bg { height: 20px; background: #000; border: 2px solid #333; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.2s; }
        #p1Health { background: var(--primary); box-shadow: 0 0 15px var(--primary); }
        #p2Health { background: var(--secondary); box-shadow: 0 0 15px var(--secondary); }
        .energy-bar { height: 6px; background: #555; margin-top: 5px; width: 0%; transition: width 0.3s; background: #ffd700; }
        
        #abortBtn { position: absolute; bottom: 20px; right: 20px; padding: 10px 20px; background: rgba(233, 69, 96, 0.2); color: var(--secondary); border: 1px solid var(--secondary); cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="mainMenu">
        <div class="title">NEON STRIKER</div>
        <button class="mode-btn" onclick="initGame('single')">VS AI CHALLENGE</button>
        <button class="mode-btn" onclick="initGame('pvp')">LOCAL PVP</button>
        <button class="mode-btn" style="border-color:#e94560; color:#e94560;" onclick="backToLobby()">EXIT TO HUB</button>
    </div>

    <div class="ui-overlay" id="gameUI" style="visibility: hidden;">
        <div class="health-container">
            <div style="color:var(--primary); font-size:12px; margin-bottom:4px;">PLAYER 1</div>
            <div class="bar-bg"><div id="p1Health" class="bar-fill" style="width: 100%;"></div></div>
            <div id="p1Energy" class="energy-bar"></div>
        </div>
        <div class="health-container">
            <div id="p2Name" style="color:var(--secondary); font-size:12px; margin-bottom:4px; text-align:right;">PLAYER 2</div>
            <div class="bar-bg"><div id="p2Health" class="bar-fill" style="width: 100%;"></div></div>
            <div id="p2Energy" class="energy-bar" style="margin-left: auto;"></div>
        </div>
    </div>

    <div id="gameOverMenu" style="display: none;">
        <div id="winText" class="title" style="font-size: 40px;">P1 WIN</div>
        <button class="mode-btn" onclick="resetToMenu()">RETRY</button>
        <button class="mode-btn" onclick="backToLobby()">LOBBY</button>
    </div>

    <button id="abortBtn" style="display:none;" onclick="resetToMenu()">QUIT</button>
    <canvas id="gameCanvas" width="1000" height="500"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const keys = {};
    let particles = [];
    let screenShake = 0;
    let gameActive = false;
    let isSinglePlayer = true;

    function backToLobby() {
        const urlParams = new URLSearchParams(window.location.search);
        const gate = urlParams.get('gate') || 0;
        window.location.href = `index.html?back=true&gate=${gate}`;
    }

    // 特效類：粒子
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.alpha = 1;
            this.color = color;
            this.size = Math.random() * 4 + 2;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.alpha -= 0.02;
        }
        draw() {
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    class Fighter {
        constructor({x, y, color, id, isAI}) {
            this.id = id;
            this.pos = { x, y };
            this.vel = { x: 0, y: 0 };
            this.color = color;
            this.isAI = isAI;
            this.width = 50; this.height = 85;
            this.health = 100;
            this.energy = 0;
            this.facing = id === 1 ? 1 : -1;
            this.state = 'IDLE'; // IDLE, ATTACK, BLOCK, HURT, DASH
            this.timer = 0;
            this.animFrame = 0;
            this.isGrounded = true;
        }

        draw() {
            this.animFrame += 0.1;
            const breathe = Math.sin(this.animFrame) * 3;
            const {x, y} = this.pos;

            ctx.save();
            // 畫面震動偏移
            if (screenShake > 0) {
                ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            }

            // 陰影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(x + 25, y + 85, 25, 6, 0, 0, Math.PI*2); ctx.fill();

            // 角色主體 (加上呼吸壓縮感)
            ctx.translate(x + 25, y + 85);
            if (this.facing === -1) ctx.scale(-1, 1);
            
            // 判定受擊閃爍
            ctx.fillStyle = this.state === 'HURT' ? '#fff' : (this.state === 'BLOCK' ? '#FFD700' : this.color);
            
            // 身體 (隨呼吸縮放)
            const h = this.height + breathe;
            ctx.fillRect(-25, -h, 50, h);
            
            // 眼睛 (模組細節)
            ctx.fillStyle = '#fff';
            ctx.fillRect(5, -h + 15, 12, 6);

            // 手部動作
            ctx.fillStyle = this.color;
            if (this.state === 'ATTACK') {
                ctx.fillRect(20, -50, 35, 15); // 出拳
            } else if (this.state === 'BLOCK') {
                ctx.fillRect(5, -60, 15, 40); // 擋格
            }

            ctx.restore();
        }

        update() {
            this.pos.x += this.vel.x;
            this.pos.y += this.vel.y;
            this.vel.x *= 0.85; // 摩擦力

            // 邊界限制
            this.pos.x = Math.max(0, Math.min(canvas.width - this.width, this.pos.x));
            
            if (this.timer > 0) {
                this.timer--;
                if (this.timer === 0) this.state = 'IDLE';
            }

            if (this.energy < 100) this.energy += 0.1;
            document.getElementById(`p${this.id}Energy`).style.width = this.energy + '%';

            this.draw();
        }

        attack(target) {
            if (this.state !== 'IDLE') return;
            this.state = 'ATTACK';
            this.timer = 15;
            
            // 碰撞判定
            const range = 80;
            const hit = this.facing === 1 ? 
                (target.pos.x > this.pos.x && target.pos.x < this.pos.x + range) :
                (target.pos.x < this.pos.x && target.pos.x > this.pos.x - range);

            if (hit && Math.abs(target.pos.y - this.pos.y) < 50) {
                target.takeDamage(10, this.facing);
                this.energy = Math.min(100, this.energy + 15);
            }
        }

        dash() {
            if (this.state !== 'IDLE' || this.energy < 30) return;
            this.energy -= 30;
            this.state = 'DASH';
            this.timer = 10;
            this.vel.x = this.facing * 25;
            // 產生殘影粒子
            for(let i=0; i<5; i++) particles.push(new Particle(this.pos.x+25, this.pos.y+40, this.color));
        }

        takeDamage(amt, dir) {
            if (this.state === 'BLOCK') {
                amt /= 4;
                screenShake = 3;
            } else {
                this.state = 'HURT';
                this.timer = 10;
                this.vel.x = dir * 15;
                screenShake = 10;
                // 打擊火花
                for(let i=0; i<10; i++) particles.push(new Particle(this.pos.x+25, this.pos.y+40, '#ff0'));
            }
            this.health -= amt;
            document.getElementById(`p${this.id}Health`).style.width = Math.max(0, this.health) + '%';
            if (this.health <= 0) finishGame(this.id === 1 ? 2 : 1);
        }
    }

    let p1, p2;

    function initGame(mode) {
        isSinglePlayer = mode === 'single';
        gameActive = true;
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('gameUI').style.visibility = 'visible';
        document.getElementById('abortBtn').style.display = 'block';
        
        p1 = new Fighter({x: 150, y: 300, color: '#00f2ff', id: 1, isAI: false});
        p2 = new Fighter({x: 800, y: 300, color: '#e94560', id: 2, isAI: isSinglePlayer});
        
        loop();
    }

    function handleInput() {
        // P1 控制
        if (p1.state === 'IDLE') {
            if (keys['a']) { p1.vel.x = -6; p1.facing = -1; }
            if (keys['d']) { p1.vel.x = 6; p1.facing = 1; }
            if (keys['j']) p1.attack(p2);
            if (keys['k']) p1.state = 'BLOCK';
            if (keys['l']) p1.dash();
        }
        if (p1.state === 'BLOCK' && !keys['k']) p1.state = 'IDLE';

        // P2 控制 (雙人模式)
        if (!p2.isAI && p2.state === 'IDLE') {
            if (keys['arrowleft']) { p2.vel.x = -6; p2.facing = -1; }
            if (keys['arrowright']) { p2.vel.x = 6; p2.facing = 1; }
            if (keys['1']) p2.attack(p1);
            if (keys['2']) p2.state = 'BLOCK';
            if (keys['3']) p2.dash();
        }
    }

    function updateAI() {
        if (!p2.isAI || p2.state !== 'IDLE') return;
        const dist = p1.pos.x - p2.pos.x;
        p2.facing = dist > 0 ? 1 : -1;
        
        if (Math.abs(dist) > 70) {
            p2.vel.x = p2.facing * 4;
        } else {
            if (Math.random() < 0.05) p2.attack(p1);
            if (p1.state === 'ATTACK' && Math.random() < 0.1) p2.state = 'BLOCK';
        }
    }

    function loop() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 繪製背景裝飾 (網格)
        ctx.strokeStyle = '#1a1a2e';
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }

        handleInput();
        updateAI();
        
        p1.update();
        p2.update(p1);

        // 特效更新
        particles = particles.filter(p => p.alpha > 0);
        particles.forEach(p => { p.update(); p.draw(); });
        
        if (screenShake > 0) screenShake -= 1;

        requestAnimationFrame(loop);
    }

    function finishGame(winner) {
        gameActive = false;
        document.getElementById('gameOverMenu').style.display = 'flex';
        document.getElementById('winText').innerText = winner === 1 ? "PLAYER 1 WINS" : "PLAYER 2 WINS";
    }

    function resetToMenu() {
        location.reload(); // 最簡單的重置方式
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
</script>

</body>
</html>
