<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>ARCADE FIGHTER - 修復版</title>
    <style>
        :root { --bg: #0d0d1a; --primary: #00f2ff; --secondary: #e94560; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #gameBox { position: relative; width: 900px; height: 450px; border: 2px solid #333; }
        canvas { background: #16213e; display: block; width: 100%; height: 100%; }
        
        #menu { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .btn { padding: 12px 40px; margin: 10px; background: #1a1a2e; color: white; border: 1px solid var(--primary); border-radius: 50px; cursor: pointer; width: 250px; font-size: 16px; }
        .btn:hover { background: var(--primary); color: black; }
        
        #ui { position: absolute; top: 20px; width: 100%; display: none; justify-content: space-around; pointer-events: none; }
        .hp-bar { width: 300px; height: 15px; background: #000; border: 1px solid #555; border-radius: 10px; overflow: hidden; }
        .hp-fill { height: 100%; width: 100%; transition: 0.3s; }
        
        #exitBtn { position: absolute; bottom: 20px; right: 20px; padding: 5px 15px; background: var(--secondary); color: white; text-decoration: none; border-radius: 5px; font-size: 12px; display: none; z-index: 101; }
    </style>
</head>
<body>
    <div id="gameBox">
        <div id="menu">
            <h1 style="color:var(--primary)">ARCADE FIGHTER</h1>
            <button class="btn" onclick="startGame(true)">單人模式 (WASD / JKL)</button>
            <button class="btn" onclick="startGame(false)">雙人模式 (WASD / Arrows)</button>
            <a href="index.html" class="btn" style="border-color:var(--secondary); text-align:center; text-decoration:none;">返回大廳</a>
        </div>
        <div id="ui">
            <div class="hp-bar"><div id="p1h" class="hp-fill" style="background:var(--primary)"></div></div>
            <div class="hp-bar"><div id="p2h" class="hp-fill" style="background:var(--secondary)"></div></div>
        </div>
        <a href="index.html" id="exitBtn">放棄戰鬥</a>
        <canvas id="canvas" width="900" height="450"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let keys = {}, gameActive = false, isSingle = true;
        let p1, p2;

        class Player {
            constructor(x, color, id) {
                this.x = x; this.y = 300; this.color = color; this.id = id;
                this.hp = 100; this.vx = 0; this.vy = 0; this.state = 'IDLE'; this.dir = id === 1 ? 1 : -1;
            }
            draw() {
                ctx.fillStyle = this.state === 'HURT' ? 'white' : this.color;
                ctx.fillRect(this.x, this.y, 40, 60);
                if(this.state === 'ATK') {
                    ctx.fillStyle = 'white';
                    ctx.fillRect(this.dir === 1 ? this.x + 40 : this.x - 20, this.y + 20, 20, 10);
                }
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.8; this.vy *= 0.8;
                this.x = Math.max(0, Math.min(860, this.x));
                this.y = Math.max(200, Math.min(390, this.y));
                this.draw();
            }
            atk(target) {
                if(this.state !== 'IDLE') return;
                this.state = 'ATK';
                setTimeout(() => this.state = 'IDLE', 200);
                if(Math.abs(this.x - target.x) < 60 && Math.abs(this.y - target.y) < 40) target.hit();
            }
            hit() {
                this.hp -= 10; this.state = 'HURT';
                document.getElementById(`p${this.id}h`).style.width = this.hp + '%';
                setTimeout(() => this.state = 'IDLE', 200);
                if(this.hp <= 0) { alert('Game Over!'); location.reload(); }
            }
        }

        window.onkeydown = e => keys[e.key.toLowerCase()] = true;
        window.onkeyup = e => keys[e.key.toLowerCase()] = false;

        function startGame(mode) {
            isSingle = mode;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui').style.display = 'flex';
            document.getElementById('exitBtn').style.display = 'block';
            p1 = new Player(100, '#00f2ff', 1);
            p2 = new Player(750, '#e94560', 2);
            gameActive = true; loop();
        }

        function loop() {
            if(!gameActive) return;
            ctx.clearRect(0,0,900,450);
            // P1 控制
            if(keys['w']) p1.vy = -5; if(keys['s']) p1.vy = 5;
            if(keys['a']) { p1.vx = -5; p1.dir = -1; }
            if(keys['d']) { p1.vx = 5; p1.dir = 1; }
            if(keys['z'] || (isSingle && keys['j'])) p1.atk(p2);

            // P2 控制
            if(!isSingle) {
                if(keys['arrowup']) p2.vy = -5; if(keys['arrowdown']) p2.vy = 5;
                if(keys['arrowleft']) { p2.vx = -5; p2.dir = -1; }
                if(keys['arrowright']) { p2.vx = 5; p2.dir = 1; }
                if(keys['j']) p2.atk(p1);
            } else {
                p2.vx = p1.x > p2.x ? 2 : -2;
                if(Math.random() < 0.01) p2.atk(p1);
            }

            p1.update(); p2.update();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
