<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>RONIN DUEL - 浪人決鬥</title>
    <style>
        /* 1. 美術風格：浪人水墨風 */
        :root {
            --bg: #1a1712; /* 墨黑背景 */
            --p1-color: #c43e3e; /* 深紅 (P1) */
            --ai-color: #545e75; /* 藏藍 (AI) */
            --gold: #d4af37; /* 枯黃/金 */
            --ink: #111;
            --paper: #e6dccd;
        }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'serif'; overflow: hidden; color: var(--paper); }
        
        #gameContainer { position: relative; border: 4px double #3a352a; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 4px; overflow: hidden; background: var(--paper); }
        canvas { background: radial-gradient(circle at center, #e6dccd 0%, #c9bfa8 100%); display: block; cursor: crosshair; }
        
        /* HUD 介面 (仿古風) */
        .hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; pointer-events: none; z-index: 10; text-shadow: 1px 1px 2px var(--ink); }
        .stats { width: 350px; }
        .label { font-size: 16px; margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; border-bottom: 2px solid rgba(0,0,0,0.2); display: inline-block; }
        .bar-outer { height: 14px; background: rgba(0,0,0,0.2); border: 2px solid var(--ink); position: relative; }
        .bar-inner { height: 100%; width: 100%; transition: width 0.3s ease-out; }
        #p1HP { background: var(--p1-color); }
        #aiHP { background: var(--ai-color); }
        .stamina-bar { height: 6px; width: 0%; background: var(--gold); margin-top: 5px; border: 1px solid var(--ink); transition: width 0.2s; }

        /* 選單與覆蓋層 */
        #overlay, #winScreen { position: absolute; inset: 0; background: rgba(26, 23, 18, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; border: 4px double var(--gold); }
        h1 { font-size: 60px; margin: 0; letter-spacing: 10px; color: var(--p1-color); text-shadow: 2px 2px 0 var(--ink); font-family: 'serif'; }
        .btn { padding: 15px 50px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); cursor: pointer; font-size: 20px; font-family: 'serif'; transition: 0.2s; margin-top: 25px; letter-spacing: 3px; font-weight: bold; }
        .btn:hover { background: var(--p1-color); color: var(--paper); border-color: var(--gold); transform: scale(1.05); }
        
        .hint { position: absolute; bottom: 15px; width: 100%; text-align: center; color: var(--ink); font-size: 14px; font-weight: bold; background: rgba(230, 220, 205, 0.7); padding: 5px 0; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="hud" id="gameHUD" style="display:none;">
        <div class="stats">
            <div class="label" style="color:var(--p1-color)">浪人 (P1)</div>
            <div class="bar-outer"><div id="p1HP" class="bar-inner"></div></div>
            <div id="p1EN" class="stamina-bar"></div>
        </div>
        <div class="stats" style="text-align:right;">
            <div class="label" style="color:var(--ai-color)">劍豪 (AI)</div>
            <div class="bar-outer" style="justify-content: flex-end; display: flex;"><div id="aiHP" class="bar-inner"></div></div>
        </div>
    </div>

    <div id="overlay">
        <h1>浪人決鬥</h1>
        <p style="color:var(--gold); font-size:16px; margin-top:10px; letter-spacing: 2px;">生死一瞬 · 劍戟之道</p>
        <button class="btn" onclick="startGame()">拔刀開戰</button>
        <button class="btn" style="background:#3a352a; color:#ccc; border-color:#555;" onclick="backToHub()">返回庭院</button>
    </div>

    <div id="winScreen" style="display:none;">
        <h2 id="resultMsg" style="font-size:50px; letter-spacing:5px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink);">勝負已分</h2>
        <button class="btn" onclick="location.reload()">再戰一局</button>
    </div>

    <canvas id="stage" width="1000" height="500"></canvas>
    <div class="hint">WASD: 八方移動 | J: 斬擊 | K: 格擋 (最多承受5次) | L: 瞬步 (消耗氣力)</div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const keys = {};
    let gameRunning = false;
    let shake = 0;
    let particles = [];

    const COLOR_P1 = '#c43e3e';
    const COLOR_AI = '#545e75';
    const COLOR_GOLD = '#d4af37';
    const COLOR_INK = '#111';
    
    // 2.5D 移動邊界
    const MIN_Y = 250;
    const MAX_Y = 450;

    function backToHub() {
        const p = new URLSearchParams(window.location.search);
        window.location.href = `index.html?back=true&gate=${p.get('gate')||0}`;
    }

    // 水墨風格粒子
    class Particle {
        constructor(x, y, color, isBlade) {
            this.x = x; this.y = y;
            this.vx = (Math.random()-0.5)* (isBlade ? 15 : 8);
            this.vy = (Math.random()-0.5)* (isBlade ? 2 : 8);
            this.life = 1.0;
            this.color = color;
            this.size = Math.random()*(isBlade ? 4 : 6) + 2;
            this.isBlade = isBlade;
        }
        update() { 
            this.x += this.vx; this.y += this.vy; 
            this.life -= 0.03; 
            if(!this.isBlade) this.vy += 0.2; // 重力效果
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            // 畫出不規則的水墨點
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    class Fighter {
        constructor(x, y, color, isAI) {
            this.pos = {x, y};
            this.vel = {x: 0, y: 0};
            this.color = color;
            this.isAI = isAI;
            this.hp = 100;
            this.en = 0;
            this.facing = isAI ? -1 : 1;
            this.state = 'IDLE'; // IDLE, ATTACK, BLOCK, HURT, DASH, STUNNED
            this.timer = 0;
            this.frame = 0;
            // 3. 格擋崩解機制
            this.blockHits = 0;
            this.maxBlockHits = 5;
        }

        draw() {
            this.frame += 0.1;
            const breathe = Math.sin(this.frame) * 2;
            const {x, y} = this.pos;
            
            // 根據 Y 軸調整大小 (2.5D 透視感)
            const scale = 0.8 + (y - MIN_Y) / (MAX_Y - MIN_Y) * 0.4;

            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale); // 應用透視縮放
            if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            
            // 腳底陰影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(0, 10, 30, 8, 0, 0, Math.PI*2); ctx.fill();

            // 角色繪製中心點上移
            ctx.translate(0, -60); 
            if(this.facing === -1) ctx.scale(-1, 1);

            // --- 浪人模組繪製 ---
            
            // 身體 (道袍)
            ctx.fillStyle = this.state === 'HURT' || this.state === 'STUNNED' ? '#fff' : this.color;
            ctx.beginPath();
            ctx.moveTo(-20, -30 + breathe); ctx.lineTo(20, -30 + breathe);
            ctx.lineTo(30, 40); ctx.lineTo(-30, 40);
            ctx.closePath(); ctx.fill();
            
            // 腰帶
            ctx.fillStyle = COLOR_INK;
            ctx.fillRect(-22, 0 + breathe, 44, 8);

            // 頭部
            ctx.fillStyle = '#ffe0bd'; // 皮膚色
            ctx.fillRect(-10, -50 + breathe, 20, 20);

            // 陣笠 (浪人斗笠)
            ctx.fillStyle = '#8b7d6b'; // 稻草色
            ctx.beginPath();
            ctx.moveTo(-35, -45 + breathe); ctx.lineTo(35, -45 + breathe); ctx.lineTo(0, -75 + breathe);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = COLOR_INK; ctx.lineWidth = 2; ctx.stroke();

            // 手臂與武士刀
            ctx.lineWidth = 4;
            ctx.strokeStyle = COLOR_INK;
            ctx.fillStyle = '#ccc'; // 刀刃色

            ctx.beginPath();
            if(this.state === 'ATTACK') {
                // 揮刀動作
                ctx.moveTo(-10, -10); ctx.lineTo(40, -10); ctx.stroke();
                // 刀刃
                ctx.fillRect(40, -15, 30, 10);
                // 劍氣特效
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(30, 0, 50, -0.5, 0.5); ctx.stroke();
            } else if(this.state === 'BLOCK') {
                // 格擋動作
                ctx.moveTo(10, 0); ctx.lineTo(25, -30); ctx.stroke();
                ctx.fillRect(22, -45, 6, 30);
                
                // 格擋特效：顏色隨耐久度變化
                const blockRatio = this.blockHits / this.maxBlockHits;
                ctx.strokeStyle = `rgb(${255 * blockRatio}, ${255 * (1-blockRatio)}, 50)`;
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(30, -20, 25 + blockRatio*10, Math.PI/4, -Math.PI/4, true); ctx.stroke();

            } else if (this.state === 'STUNNED') {
                 // 暈眩動作
                 ctx.moveTo(-10, -10); ctx.lineTo(-20, 10); ctx.stroke();
                 ctx.moveTo(10, -10); ctx.lineTo(20, 10); ctx.stroke();
                 ctx.fillStyle = COLOR_GOLD; ctx.fillText("???", -15, -80);
            } else {
                // 待機持刀
                ctx.moveTo(-15, 0); ctx.lineTo(15, 20); ctx.stroke();
                ctx.fillRect(12, 15, 30, 4); // 刀鞘
            }

            ctx.restore();
        }

        update(target) {
            this.pos.x += this.vel.x;
            this.pos.y += this.vel.y;
            this.vel.x *= 0.8;
            this.vel.y *= 0.8;

            // 2.5D 邊界限制
            this.pos.x = Math.max(50, Math.min(canvas.width-50, this.pos.x));
            this.pos.y = Math.max(MIN_Y, Math.min(MAX_Y, this.pos.y));

            if(this.timer > 0) {
                this.timer--;
                if(this.timer === 0) {
                    this.state = 'IDLE';
                    // 如果從暈眩恢復，重置格擋計數
                    if(this.blockHits >= this.maxBlockHits) this.blockHits = 0;
                }
            }

            if(!this.isAI && this.state !== 'STUNNED') {
                this.en = Math.min(100, this.en + 0.3);
                document.getElementById('p1EN').style.width = this.en + '%';
            }

            this.draw();
        }

        perform(type, target) {
            if(this.state !== 'IDLE') return;

            if(type === 'ATTACK') {
                this.state = 'ATTACK'; this.timer = 15;
                this.vel.x = this.facing * 5; // 攻擊時小幅前進
                
                // 2.5D 攻擊判定：檢查 X軸距離 和 Y軸縱深
                const xDist = Math.abs(this.pos.x - target.pos.x);
                const yDist = Math.abs(this.pos.y - target.pos.y);

                if(xDist < 110 && yDist < 35) { // 縱深差距小於 35 才算打中
                    // 揮刀粒子
                    for(let i=0; i<5; i++) particles.push(new Particle(this.pos.x + this.facing*40, this.pos.y-40, '#fff', true));
                    target.getHit(12, this.facing);
                    if(!this.isAI) this.en = Math.min(100, this.en + 15);
                }
            } else if(type === 'DASH' && this.en >= 30) {
                this.en -= 30; this.state = 'DASH'; this.timer = 12;
                this.vel.x = this.facing * 40;
                // 瞬步煙塵
                for(let i=0; i<10; i++) particles.push(new Particle(this.pos.x, this.pos.y, '#ddd', false));
            }
        }

        getHit(dmg, dir) {
            if(this.state === 'BLOCK') {
                this.blockHits++;
                this.vel.x = dir * 8; shake = 5;
                // 格擋火花
                for(let i=0; i<5; i++) particles.push(new Particle(this.pos.x+dir*20, this.pos.y-40, COLOR_GOLD, true));
                
                // 3. 格擋崩解判定
                if(this.blockHits >= this.maxBlockHits) {
                    this.state = 'STUNNED'; // 破防暈眩
                    this.timer = 90; // 長時間僵直
                    shake = 20;
                    this.vel.x = dir * 25;
                    // 破防大爆炸特效
                    for(let i=0; i<30; i++) particles.push(new Particle(this.pos.x, this.pos.y-40, COLOR_P1, false));
                }

            } else if (this.state !== 'STUNNED') {
                this.hp -= dmg; this.state = 'HURT'; this.timer = 18;
                this.vel.x = dir * 20; shake = 12;
                // 噴血特效 (水墨風)
                for(let i=0; i<20; i++) particles.push(new Particle(this.pos.x, this.pos.y-40, this.color, false));
            }
            
            const barId = this.isAI ? 'aiHP' : 'p1HP';
            document.getElementById(barId).style.width = Math.max(0, this.hp) + '%';
            if(this.hp <= 0) endGame(this.isAI ? 'WIN' : 'LOSS');
        }
    }

    let p1, ai;

    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('gameHUD').style.display = 'flex';
        p1 = new Fighter(200, 350, COLOR_P1, false);
        ai = new Fighter(800, 350, COLOR_AI, true);
        gameRunning = true;
        mainLoop();
    }

    function mainLoop() {
        if(!gameRunning) return;
        
        // 繪製背景 (枯山水庭院風格)
        ctx.fillStyle = '#e6dccd'; ctx.fillRect(0,0,canvas.width,canvas.height);
        // 地面紋理
        ctx.fillStyle = '#d9cfae'; ctx.fillRect(0, MIN_Y-20, canvas.width, MAX_Y-MIN_Y+40);
        ctx.strokeStyle = '#c9bfa8'; ctx.lineWidth = 2;
        for(let i=MIN_Y; i<=MAX_Y; i+=30) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        // P1 控制輸入 (加入 W/S 移動)
        if(p1.state === 'IDLE' || p1.state === 'BLOCK') {
            if(keys['w']) p1.vel.y = -6;
            if(keys['s']) p1.vel.y = 6;
            if(keys['a']) { p1.vel.x = -8; p1.facing = -1; }
            if(keys['d']) { p1.vel.x = 8; p1.facing = 1; }
            
            if(keys['j']) p1.perform('ATTACK', ai);
            if(keys['k']) p1.state = 'BLOCK'; else if(p1.state === 'BLOCK') p1.state = 'IDLE';
            if(keys['l']) p1.perform('DASH', ai);
        }

        // AI 邏輯 (加入 2.5D 追蹤)
        if(ai.state === 'IDLE') {
            const xDist = p1.pos.x - ai.pos.x;
            const yDist = p1.pos.y - ai.pos.y;
            ai.facing = xDist > 0 ? 1 : -1;

            // 在 X 軸和 Y 軸上接近玩家
            if(Math.abs(xDist) > 100) ai.vel.x = ai.facing * 4;
            if(Math.abs(yDist) > 20) ai.vel.y = yDist > 0 ? 3 : -3;

            // 攻擊決策
            if(Math.abs(xDist) < 120 && Math.abs(yDist) < 40) {
                if(Math.random() < 0.05) ai.perform('ATTACK', p1);
                // 如果玩家攻擊且自己格擋次數不多，則嘗試格擋
                if(p1.state === 'ATTACK' && ai.blockHits < 3 && Math.random() < 0.4) ai.state = 'BLOCK';
            }
        }

        // 根據 Y 軸排序渲染順序 (前面的蓋住後面的)
        if(p1.pos.y > ai.pos.y) { ai.update(p1); p1.update(ai); }
        else { p1.update(ai); ai.update(p1); }

        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(); });

        if(shake > 0) shake--;
        requestAnimationFrame(mainLoop);
    }

    function endGame(result) {
        gameRunning = false;
        setTimeout(() => {
            document.getElementById('winScreen').style.display = 'flex';
            const msg = document.getElementById('resultMsg');
            msg.innerText = result === 'WIN' ? "敵將討取" : "勝敗乃兵家常事";
            msg.style.color = result === 'WIN' ? COLOR_P1 : COLOR_AI;
        }, 1000);
    }

    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;
</script>
</body>
</html>
