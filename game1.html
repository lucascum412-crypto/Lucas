<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>LF2 終極對戰 - 破防與暈眩系統</title>
    <style>
        body { margin: 0; background-color: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        #gameContainer { position: relative; border: 5px solid #333; }
        canvas { background-color: #5d9ba3; display: block; }
        .ui-layer { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; }
        .health-box { width: 280px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 4px; border-top: 4px solid #2b58de; }
        .health-box.p2 { border-top: 4px solid #d11d1d; text-align: right; }
        .bar-bg { width: 100%; height: 18px; background: #330000; border: 1px solid #555; margin-top: 5px; position: relative; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #4ef037, #228b22); width: 100%; transition: width 0.15s; }
        .shield-dots { display: flex; gap: 3px; margin-top: 5px; justify-content: inherit; }
        .dot { width: 12px; height: 6px; background: #ffcc00; border-radius: 2px; transition: opacity 0.2s; }
        .cooldown-bar { width: 60px; height: 4px; background: #444; margin-top: 5px; }
        .cooldown-fill { height: 100%; background: #00ffff; width: 0%; }
        #restartBtn { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); padding: 15px 35px; font-size: 20px; cursor: pointer; background: #fff; border: none; border-radius: 5px; font-weight: bold; display: none; z-index: 100; }
        #status { position: absolute; bottom: 15px; background: rgba(0,0,0,0.8); padding: 8px 25px; border-radius: 5px; font-size: 13px; display: flex; gap: 30px; }
        .win-text { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 56px; font-weight: bold; text-shadow: 4px 4px 0px #000; display: none; z-index: 10; text-align: center;}
        .key { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="ui-layer">
        <div class="health-box">
            <div>P1 武術家</div>
            <div class="bar-bg"><div id="p1Health" class="bar-fill"></div></div>
            <div class="shield-dots" id="p1Shield">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div style="font-size: 10px; margin-top:3px">破防技 CD:</div>
            <div class="cooldown-bar"><div id="p1CD" class="cooldown-fill"></div></div>
        </div>
        <div class="health-box p2">
            <div>P2 忍者</div>
            <div class="bar-bg"><div id="p2Health" class="bar-fill" style="background: linear-gradient(90deg, #ff4d4d, #b30000);"></div></div>
            <div class="shield-dots" id="p2Shield">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div style="font-size: 10px; margin-top:3px">破防技 CD:</div>
            <div class="cooldown-bar" style="margin-left: auto;"><div id="p2CD" class="cooldown-fill"></div></div>
        </div>
    </div>
    <div id="winDisplay" class="win-text"></div>
    <button id="restartBtn" onclick="resetGame()">再次對決</button>
    <canvas id="gameCanvas" width="900" height="450"></canvas>
    <div id="status">
        <div>P1: <span class="key">WASD</span> 移動 | <span class="key">J</span> 拳 | <span class="key">K</span> 擋 | <span class="key">U</span> 破防</div>
        <div>P2: <span class="key">↑↓←→</span> 移動 | <span class="key">I</span> 拳 | <span class="key">O</span> 擋 | <span class="key">P</span> 破防</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const keys = {};

    let gameActive = true;

    class Fighter {
        constructor({position, color, id}) {
            this.id = id;
            this.position = position;
            this.velocity = { x: 0, y: 0 };
            this.width = 50;
            this.height = 80;
            this.color = color;
            this.health = 100;
            
            this.state = 'IDLE'; // IDLE, ATTACK, SKILL, HURT, BLOCK, STUNNED
            this.facing = id === 1 ? 1 : -1;
            this.hitstun = 0;
            this.stunTimer = 0;
            this.shieldHP = 5;
            this.skillCD = 0; // 180 frames = 3 seconds
        }

        draw() {
            const {x, y} = this.position;
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(x + 25, y + 80, 25, 8, 0, 0, Math.PI*2); ctx.fill();

            // 繪製角色顏色邏輯
            if (this.state === 'STUNNED') ctx.fillStyle = '#aa00ff'; // 暈眩紫色
            else if (this.state === 'HURT') ctx.fillStyle = 'white';
            else if (this.state === 'BLOCK') ctx.fillStyle = '#FFD700';
            else ctx.fillStyle = this.color;

            // 繪製主體
            ctx.fillRect(x + 10, y + 25, 30, 40);
            ctx.fillStyle = '#ffdbac';
            ctx.fillRect(x + 15, y, 20, 25);

            // 手部動作
            ctx.fillStyle = (this.state === 'BLOCK') ? '#FFD700' : this.color;
            if (this.state === 'ATTACK') {
                ctx.fillRect(this.facing === 1 ? x + 35 : x - 15, y + 30, 30, 15);
            } else if (this.state === 'SKILL') {
                ctx.fillStyle = '#00ffff'; // 破防技發光
                ctx.fillRect(this.facing === 1 ? x + 35 : x - 25, y + 20, 40, 30);
            } else if (this.state === 'BLOCK') {
                ctx.fillRect(x + 5, y + 15, 12, 35);
                ctx.fillRect(x + 33, y + 15, 12, 35);
            } else if (this.state === 'STUNNED') {
                // 暈眩小圈圈裝飾
                ctx.strokeStyle = 'white';
                ctx.beginPath(); ctx.arc(x+25, y-10, 10, 0, Math.PI); ctx.stroke();
            }
        }

        update() {
            if (this.health <= 0) return;

            // 計時器處理
            if (this.stunTimer > 0) {
                this.stunTimer--;
                if (this.stunTimer === 0) {
                    this.state = 'IDLE';
                    this.shieldHP = 5; // 暈眩結束恢復護盾
                    this.updateShieldUI();
                }
            }
            if (this.hitstun > 0) {
                this.hitstun--;
                if (this.hitstun === 0 && this.state !== 'STUNNED') this.state = 'IDLE';
            }
            if (this.skillCD > 0) {
                this.skillCD--;
                document.getElementById(`p${this.id}CD`).style.width = (this.skillCD / 180 * 100) + '%';
            }

            this.draw();

            if (this.state !== 'STUNNED') {
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;
            }
            this.velocity.x *= 0.8;
            this.velocity.y *= 0.8;

            // 邊界
            this.position.y = Math.max(180, Math.min(canvas.height - 90, this.position.y));
            this.position.x = Math.max(0, Math.min(canvas.width - 50, this.position.x));
        }

        // 普通攻擊
        attack(target) {
            if (this.state !== 'IDLE' || this.health <= 0) return;
            this.state = 'ATTACK';
            this.checkHit(target, 10, false);
            setTimeout(() => { if(this.state === 'ATTACK') this.state = 'IDLE'; }, 200);
        }

        // 破防技
        guardBreak(target) {
            if (this.state !== 'IDLE' || this.skillCD > 0 || this.health <= 0) return;
            this.state = 'SKILL';
            this.skillCD = 180; // 3秒
            this.checkHit(target, 15, true);
            setTimeout(() => { if(this.state === 'SKILL') this.state = 'IDLE'; }, 400);
        }

        checkHit(target, damage, isBreakSkill) {
            const dx = target.position.x - this.position.x;
            const dy = target.position.y - this.position.y;
            const hitRange = isBreakSkill ? 80 : 70;

            if (Math.sign(dx) === this.facing && Math.abs(dx) < hitRange && Math.abs(dy) < 35) {
                target.takeDamage(damage, this.facing, isBreakSkill);
            }
        }

        takeDamage(amt, direction, isBreakSkill) {
            if (this.state === 'BLOCK' && !isBreakSkill) {
                this.shieldHP--;
                this.updateShieldUI();
                this.velocity.x = direction * 5;
                if (this.shieldHP <= 0) this.triggerStun();
            } else if (isBreakSkill && this.state === 'BLOCK') {
                // 被破防技打中且正在格擋 -> 直接暈眩
                this.triggerStun();
                this.health -= amt;
            } else {
                this.health -= amt;
                this.state = 'HURT';
                this.hitstun = 15;
                this.velocity.x = direction * 12;
            }

            document.getElementById(`p${this.id}Health`).style.width = Math.max(0, this.health) + '%';
            if (this.health <= 0) endGame(this.id === 1 ? 2 : 1);
        }

        triggerStun() {
            this.state = 'STUNNED';
            this.stunTimer = 120; // 2秒
            this.shieldHP = 0;
            this.updateShieldUI();
            this.velocity.x = 0;
        }

        updateShieldUI() {
            const dots = document.getElementById(`p${this.id}Shield`).children;
            for(let i=0; i<5; i++) {
                dots[i].style.opacity = (i < this.shieldHP) ? "1" : "0.1";
            }
        }
    }

    let p1 = new Fighter({ position: {x: 150, y: 280}, color: '#2b58de', id: 1 });
    let p2 = new Fighter({ position: {x: 700, y: 280}, color: '#d11d1d', id: 2 });

    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    function handleInput() {
        if (!gameActive) return;

        // P1 控制
        if (p1.state === 'IDLE') {
            if (keys['w']) p1.velocity.y = -5;
            if (keys['s']) p1.velocity.y = 5;
            if (keys['a']) { p1.velocity.x = -5; p1.facing = -1; }
            if (keys['d']) { p1.velocity.x = 5; p1.facing = 1; }
            if (keys['j']) p1.attack(p2);
            if (keys['u']) p1.guardBreak(p2);
            if (keys['k']) p1.state = 'BLOCK';
        } else if (p1.state === 'BLOCK' && !keys['k']) { p1.state = 'IDLE'; }

        // P2 控制
        if (p2.state === 'IDLE') {
            if (keys['arrowup']) p2.velocity.y = -5;
            if (keys['arrowdown']) p2.velocity.y = 5;
            if (keys['arrowleft']) { p2.velocity.x = -5; p2.facing = -1; }
            if (keys['arrowright']) { p2.velocity.x = 5; p2.facing = 1; }
            if (keys['i']) p2.attack(p1);
            if (keys['p']) p2.guardBreak(p1);
            if (keys['o']) p2.state = 'BLOCK';
        } else if (p2.state === 'BLOCK' && !keys['o']) { p2.state = 'IDLE'; }
    }

    function resetGame() {
        p1 = new Fighter({ position: {x: 150, y: 280}, color: '#2b58de', id: 1 });
        p2 = new Fighter({ position: {x: 700, y: 280}, color: '#d11d1d', id: 2 });
        p1.updateShieldUI(); p2.updateShieldUI();
        document.getElementById('p1Health').style.width = '100%';
        document.getElementById('p2Health').style.width = '100%';
        document.getElementById('restartBtn').style.display = 'none';
        document.getElementById('winDisplay').style.display = 'none';
        gameActive = true;
    }

    function endGame(winnerId) {
        if (!gameActive) return;
        gameActive = false;
        const winDisplay = document.getElementById('winDisplay');
        winDisplay.style.display = 'block';
        winDisplay.innerText = `玩家 ${winnerId} 獲勝！\nSHIELD CRUSHED!`;
        winDisplay.style.color = winnerId === 1 ? "#4ef037" : "#ff4d4d";
        document.getElementById('restartBtn').style.display = 'block';
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#4a7a80'; ctx.fillRect(0, 200, canvas.width, canvas.height - 200);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        for(let i=0; i<10; i++) { ctx.strokeRect(0, 200 + i*30, canvas.width, 1); }

        handleInput();
        p1.update();
        p2.update();
        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
