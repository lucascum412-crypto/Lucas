<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>ARCADE FIGHTER - 終極修復版</title>
    <style>
        :root {
            --bg-color: #0d0d1a;
            --card-bg: #1a1a2e;
            --primary-color: #00f2ff;
            --secondary-color: #e94560;
            --text-color: #e0e0e0;
        }

        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: var(--text-color); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            overflow: hidden; 
        }

        #gameContainer { 
            position: relative; 
            border: 3px solid #333; 
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); 
            background: #000; 
            border-radius: 10px; 
            width: 900px; 
            height: 450px;
        }

        canvas { 
            background-color: #16213e; 
            display: block; 
            border-radius: 7px;
        }

        /* 選單樣式 */
        #mainMenu { 
            position: absolute; 
            inset: 0; 
            background: rgba(13, 13, 26, 0.95); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
        }

        .title { 
            font-size: 45px; 
            color: var(--primary-color); 
            margin-bottom: 30px; 
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.6); 
            letter-spacing: 3px; 
            font-weight: bold; 
        }

        .mode-btn { 
            padding: 15px 50px; 
            font-size: 18px; 
            cursor: pointer; 
            background: var(--card-bg); 
            color: white; 
            border: 1px solid #444; 
            margin: 10px; 
            border-radius: 50px; 
            transition: 0.3s; 
            width: 350px; 
            font-weight: bold; 
            text-align: center; 
        }

        .mode-btn:hover { 
            background: var(--primary-color); 
            color: #000; 
            transform: translateY(-3px); 
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); 
        }

        .exit-btn { 
            border-color: var(--secondary-color); 
            color: var(--secondary-color); 
            text-decoration: none;
            display: inline-block;
            line-height: 20px;
        }

        .exit-btn:hover { background: var(--secondary-color); color: white; }

        /* 戰鬥 UI */
        #gameUI { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            right: 20px; 
            display: none; 
            justify-content: space-between; 
            pointer-events: none; 
        }

        .health-box { width: 320px; background: rgba(26, 26, 46, 0.8); padding: 12px; border-radius: 10px; border: 1px solid #333; }
        .bar-bg { width: 100%; height: 18px; background: #000; border-radius: 9px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s; }
        #p1Health { background: linear-gradient(90deg, #00f2ff, #0066ff); }
        #p2Health { background: linear-gradient(90deg, #e94560, #8b0000); }

        #midGameExit { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            padding: 8px 15px; 
            background: rgba(233, 69, 96, 0.6); 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-size: 12px; 
            display: none; 
            z-index: 110;
        }

        .win-text { 
            position: absolute; 
            top: 40%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 60px; 
            font-weight: bold; 
            display: none; 
            z-index: 105; 
            text-shadow: 0 0 30px rgba(0,0,0,1); 
        }

        #gameOverMenu { 
            position: absolute; 
            top: 60%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            display: none; 
            flex-direction: column; 
            gap: 15px; 
            z-index: 106; 
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="mainMenu">
        <div class="title">ARCADE FIGHTER</div>
        <button class="mode-btn" onclick="initGame('single')">單人挑戰 (JKL 鍵可用)</button>
        <button class="mode-btn" onclick="initGame('pvp')">雙人對戰 (僅限 ZXC)</button>
        <a href="index.html" class="mode-btn exit-btn">返回遊戲大廳</a>
    </div>

    <a href="index.html" id="midGameExit">放棄戰鬥 (退出)</a>

    <div id="gameUI">
        <div class="health-box">
            <div style="color: var(--primary-color); font-weight: bold;">PLAYER 1</div>
            <div class="bar-bg"><div id="p1Health" class="bar-fill"></div></div>
        </div>
        <div class="health-box">
            <div id="p2Name" style="color: var(--secondary-color); font-weight: bold; text-align: right;">PLAYER 2</div>
            <div class="bar-bg"><div id="p2Health" class="bar-fill"></div></div>
        </div>
    </div>

    <div id="winDisplay" class="win-text"></div>
    
    <div id="gameOverMenu">
        <button class="mode-btn" onclick="location.reload()">再戰一局</button>
        <a href="index.html" class="mode-btn exit-btn">回大廳</a>
    </div>

    <canvas id="gameCanvas" width="900" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const keys = {};
    let gameActive = false;
    let isSinglePlayer = true;
    let p1, p2;

    class Fighter {
        constructor({position, color, id, isAI}) {
            this.id = id;
            this.position = position;
            this.velocity = { x: 0, y: 0 };
            this.width = 50;
            this.height = 80;
            this.color = color;
            this.isAI = isAI;
            this.health = 100;
            this.state = 'IDLE'; 
            this.facing = id === 1 ? 1 : -1;
            this.hitstun = 0;
        }

        draw() {
            // 繪製陰影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(this.position.x + 25, this.position.y + 80, 25, 8, 0, 0, Math.PI*2); ctx.fill();

            // 繪製身體
            ctx.fillStyle = this.state === 'HURT' ? 'white' : (this.state === 'BLOCK' ? '#FFD700' : this.color);
            ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
            
            // 繪製攻擊動作
            if (this.state === 'ATTACK') {
                ctx.fillStyle = 'white';
                ctx.fillRect(this.facing === 1 ? this.position.x + 50 : this.position.x - 30, this.position.y + 30, 30, 15);
            }
        }

        update() {
            if (this.hitstun > 0) {
                this.hitstun--;
                if (this.hitstun === 0) this.state = 'IDLE';
            } else {
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;
                // 阻力
                this.velocity.x *= 0.8;
                this.velocity.y *= 0.8;
            }

            // 邊界限制
            this.position.x = Math.max(0, Math.min(canvas.width - this.width, this.position.x));
            this.position.y = Math.max(180, Math.min(canvas.height - this.height - 10, this.position.y));

            this.draw();
        }

        attack(target) {
            if (this.state !== 'IDLE' || this.health <= 0) return;
            this.state = 'ATTACK';
            
            // 碰撞檢測
            const hit = Math.abs(this.position.x - target.position.x) < 80 && 
                        Math.abs(this.position.y - target.position.y) < 50;
            
            if (hit && ((this.facing === 1 && target.position.x > this.position.x) || 
                        (this.facing === -1 && target.position.x < this.position.x))) {
                target.takeDamage(10);
            }

            setTimeout(() => { if(this.state === 'ATTACK') this.state = 'IDLE'; }, 200);
        }

        takeDamage(amt) {
            if (this.state === 'BLOCK') amt /= 5;
            this.health -= amt;
            this.state = 'HURT';
            this.hitstun = 15;
            document.getElementById(`p${this.id}Health`).style.width = Math.max(0, this.health) + '%';
            if (this.health <= 0) endGame(this.id === 1 ? 2 : 1);
        }
    }

    function initGame(mode) {
        isSinglePlayer = mode === 'single';
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('gameUI').style.display = 'flex';
        document.getElementById('midGameExit').style.display = 'block';
        
        p1 = new Fighter({ position: {x: 100, y: 250}, color: '#00f2ff', id: 1, isAI: false });
        p2 = new Fighter({ position: {x: 750, y: 250}, color: '#e94560', id: 2, isAI: isSinglePlayer });
        
        if (isSinglePlayer) document.getElementById('p2Name').innerText = "AI BOT";

        gameActive = true;
        update();
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function handleInput() {
        if (!gameActive) return;

        // P1 操作 (WASD)
        if (p1.state === 'IDLE' || p1.state === 'BLOCK') {
            if (keys['w']) p1.velocity.y = -5;
            if (keys['s']) p1.velocity.y = 5;
            if (keys['a']) { p1.velocity.x = -5; p1.facing = -1; }
            if (keys['d']) { p1.velocity.x = 5; p1.facing = 1; }
            
            // P1 攻擊: Z (恆定) 或 J (僅單人)
            if (keys['z'] || (isSinglePlayer && keys['j'])) p1.attack(p2);
            // P1 格擋: X (恆定) 或 K (僅單人)
            if (keys['x'] || (isSinglePlayer && keys['k'])) p1.state = 'BLOCK';
            else if (p1.state === 'BLOCK') p1.state = 'IDLE';
        }

        // P2 操作
        if (!p2.isAI) {
            if (keys['arrowup']) p2.velocity.y = -5;
            if (keys['arrowdown']) p2.velocity.y = 5;
            if (keys['arrowleft']) { p2.velocity.x = -5; p2.facing = -1; }
            if (keys['arrowright']) { p2.velocity.x = 5; p2.facing = 1; }
            if (keys['j']) p2.attack(p1);
            if (keys['k']) p2.state = 'BLOCK';
            else if (p2.state === 'BLOCK') p2.state = 'IDLE';
        } else {
            // 簡單 AI 邏輯
            const dx = p1.position.x - p2.position.x;
            if (Math.abs(dx) > 70) {
                p2.velocity.x = dx > 0 ? 3 : -3;
                p2.facing = dx > 0 ? 1 : -1;
            } else {
                if (Math.random() < 0.05) p2.attack(p1);
            }
        }
    }

    function endGame(winner) {
        gameActive = false;
        const disp = document.getElementById('winDisplay');
        disp.innerText = winner === 1 ? "PLAYER 1 WINS!" : "PLAYER 2 WINS!";
        disp.style.color = winner === 1 ? '#00f2ff' : '#e94560';
        disp.style.display = 'block';
        document.getElementById('gameOverMenu').style.display = 'flex';
        document.getElementById('midGameExit').style.display = 'none';
    }

    function update() {
        if (!gameActive && !p1) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 繪製背景線條
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.1)';
        for(let i=0; i<canvas.height; i+=40) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        handleInput();
        p1.update();
        p2.update();

        if (gameActive) requestAnimationFrame(update);
    }
</script>

</body>
</html>
