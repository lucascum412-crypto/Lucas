<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>RONIN DUEL - 流暢修正版</title>
    <style>
        :root {
            --bg: #0d0c0a; --p1: #8b0000; --ai: #2f4f4f;
            --gold: #d4af37; --paper: #e6dccd; --ink: #1a1a1a;
        }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: serif; overflow: hidden; }
        #gameContainer { position: relative; border: 8px double var(--ink); background: var(--paper); box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        canvas { display: block; }
        
        .hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; pointer-events: none; }
        .stats { width: 280px; }
        .label { font-size: 16px; margin-bottom: 5px; font-weight: bold; color: var(--ink); }
        .bar-outer { height: 10px; background: rgba(0,0,0,0.1); border: 1.5px solid var(--ink); }
        .bar-inner { height: 100%; width: 100%; transition: width 0.15s; }
        #p1HP { background: var(--p1); }
        #aiHP { background: var(--ai); float: right; }

        #overlay, #winScreen { position: absolute; inset: 0; background: var(--paper); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .btn { padding: 15px 60px; background: var(--ink); color: var(--paper); border: 1px solid var(--gold); cursor: pointer; font-size: 20px; letter-spacing: 10px; margin: 10px; }
        .btn:hover { background: var(--gold); color: var(--ink); }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="hud" id="gameHUD" style="display:none;">
        <div class="stats"><div class="label">赤</div><div class="bar-outer"><div id="p1HP" class="bar-inner"></div></div></div>
        <div class="stats" style="text-align:right;"><div class="label">墨</div><div class="bar-outer"><div id="aiHP" class="bar-inner"></div></div></div>
    </div>

    <div id="overlay">
        <h1 style="font-size: 70px; letter-spacing: 20px; margin-bottom: 30px; color: var(--ink);">浪人道</h1>
        <button class="btn" onclick="startGame('EASY')">入門</button>
        <button class="btn" onclick="startGame('NORMAL')">劍士</button>
        <button class="btn" onclick="startGame('MASTER')">劍聖</button>
    </div>

    <div id="winScreen" style="display:none;">
        <h2 id="resultMsg" style="font-size:40px; margin-bottom:20px;">勝負已分</h2>
        <button class="btn" onclick="location.reload()">再戰</button>
    </div>

    <canvas id="stage" width="1000" height="500"></canvas>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const keys = {}; // 鍵盤狀態池
    let gameRunning = false, hitStop = 0, diffMode = 'NORMAL';

    const COLOR_P1 = '#8b0000', COLOR_AI = '#2f4f4f', COLOR_INK = '#1a1a1a', COLOR_PAPER = '#e6dccd';
    const MIN_Y = 280, MAX_Y = 460;

    class Fighter {
        constructor(x, y, color, isAI) {
            this.pos = {x, y}; this.vel = {x: 0, y: 0};
            this.color = color; this.isAI = isAI;
            this.hp = 100; this.facing = isAI ? -1 : 1;
            this.state = 'IDLE'; this.timer = 0; this.blockHits = 0;
            this.isBlocking = false;
        }

        draw() {
            const scale = 0.8 + (this.pos.y - MIN_Y) / 500;
            ctx.save();
            ctx.translate(this.pos.x, this.pos.y);
            ctx.scale(scale * this.facing, scale);
            
            // 影子
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.beginPath(); ctx.ellipse(0, 0, 30, 6, 0, 0, Math.PI*2); ctx.fill();

            // 模組
            ctx.translate(0, -65);
            ctx.fillStyle = (this.state === 'HURT' || this.state === 'STUNNED') ? '#fff' : this.color;
            ctx.beginPath(); 
            ctx.moveTo(-22, 45); ctx.lineTo(22, 45); ctx.lineTo(15, -10); ctx.lineTo(-15, -10); ctx.fill();
            ctx.fillRect(-18, -35, 36, 30); 
            ctx.fillStyle = COLOR_INK; ctx.fillRect(-20, -10, 40, 5); 
            ctx.fillStyle = '#f3d1b0'; ctx.fillRect(-7, -50, 14, 16); 
            ctx.fillStyle = '#6d5a41'; 
            ctx.beginPath(); ctx.moveTo(-38, -48); ctx.lineTo(38, -48); ctx.lineTo(0, -75); ctx.fill();

            // 武器
            ctx.strokeStyle = COLOR_INK; ctx.lineWidth = 3;
            if(this.state === 'ATTACK') {
                ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(70, -15); ctx.stroke();
            } else if(this.isBlocking) {
                ctx.strokeStyle = '#d4af37';
                ctx.beginPath(); ctx.moveTo(15, 20); ctx.lineTo(25, -50); ctx.stroke();
            }
            ctx.restore();
        }

        update(target) {
            // 位移邏輯：HURT 或 STUNNED 時不能移動，其餘皆可
            if(this.state !== 'HURT' && this.state !== 'STUNNED') {
                this.pos.x += this.vel.x;
                this.pos.y += this.vel.y;
            }
            this.vel.x *= 0.8; this.vel.y *= 0.8;
            
            // 邊界限制
            this.pos.x = Math.max(60, Math.min(940, this.pos.x));
            this.pos.y = Math.max(MIN_Y, Math.min(MAX_Y, this.pos.y));

            if(this.timer > 0) {
                this.timer--;
                if(this.timer === 0) this.state = 'IDLE';
            }
            this.draw();
        }

        attack(target) {
            if(this.state !== 'IDLE') return;
            this.state = 'ATTACK'; this.timer = 18;
            const dx = Math.abs(this.pos.x - target.pos.x);
            const dy = Math.abs(this.pos.y - target.pos.y);
            if(dx < 135 && dy < 45) target.getHit(12, this.facing, this.pos.x);
        }

        dash() {
            this.pos.x += this.facing * 180;
            this.state = 'IDLE';
        }

        getHit(dmg, dir, atkX) {
            const isFront = (atkX > this.pos.x && this.facing === 1) || (atkX < this.pos.x && this.facing === -1);
            if(this.isBlocking && isFront && this.state !== 'STUNNED') {
                this.blockHits++;
                if(this.blockHits >= 5) { this.state = 'STUNNED'; this.timer = 90; this.blockHits = 0; this.isBlocking = false; }
            } else {
                this.hp -= dmg; this.state = 'HURT'; this.timer = 15;
                this.vel.x = dir * 12;
                hitStop = 4;
            }
            document.getElementById(this.isAI ? 'aiHP' : 'p1HP').style.width = Math.max(0, this.hp) + '%';
            if(this.hp <= 0) endGame(this.isAI ? 'WIN' : 'LOSS');
        }
    }

    let p1, ai;
    function startGame(m) {
        diffMode = m;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('gameHUD').style.display = 'flex';
        p1 = new Fighter(200, 350, COLOR_P1, false);
        ai = new Fighter(800, 350, COLOR_AI, true);
        gameRunning = true; mainLoop();
    }

    function mainLoop() {
        if(!gameRunning) return;
        
        ctx.globalAlpha = 1.0; 
        ctx.fillStyle = COLOR_PAPER;
        ctx.fillRect(0,0,1000,500);

        if(hitStop > 0) { hitStop--; p1.draw(); ai.draw(); requestAnimationFrame(mainLoop); return; }

        // P1 移動控制：與 state 無關，只要不是被打中或崩解
        if(p1.state !== 'HURT' && p1.state !== 'STUNNED') {
            if(keys['w']) p1.vel.y = -5;
            if(keys['s']) p1.vel.y = 5;
            if(keys['a']) { p1.vel.x = -7; p1.facing = -1; }
            if(keys['d']) { p1.vel.x = 7; p1.facing = 1; }
            
            // 攻擊與瞬移
            if(keys['j']) { p1.attack(ai); delete keys['j']; }
            if(keys['l']) { p1.dash(); delete keys['l']; }
            
            // 格擋：按住 K 即可格擋，且格擋時可以行走
            p1.isBlocking = !!keys['k'];
        }

        // AI 邏輯
        if(ai.state === 'IDLE') {
            const dx = p1.pos.x - ai.pos.x;
            const dy = p1.pos.y - ai.pos.y;
            ai.facing = dx > 0 ? 1 : -1;

            if(diffMode === 'MASTER' && p1.state === 'ATTACK' && Math.abs(dx) < 160 && Math.random() < 0.1) {
                ai.dash();
            } else {
                if(Math.abs(dx) > 110) ai.vel.x = ai.facing * (diffMode==='MASTER'?5:3);
                if(Math.abs(dy) > 15) ai.vel.y = dy > 0 ? 3 : -3;
                if(Math.abs(dx) < 140 && Math.abs(dy) < 50) {
                    if(Math.random() < (diffMode==='MASTER'?0.08:0.03)) ai.attack(p1);
                    ai.isBlocking = (p1.state === 'ATTACK' && Math.random() < (diffMode==='MASTER'?0.7:0.3));
                } else {
                    ai.isBlocking = false;
                }
            }
        }

        // 渲染更新
        p1.update(ai); ai.update(p1);
        requestAnimationFrame(mainLoop);
    }

    function endGame(res) {
        gameRunning = false;
        document.getElementById('winScreen').style.display = 'flex';
        document.getElementById('resultMsg').innerText = res === 'WIN' ? "一閃 · 勝立" : "殞落";
    }

    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
</script>
</body>
</html>
