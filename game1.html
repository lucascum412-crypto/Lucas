<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>簡易版 LF2 原型</title>
    <style>
        body {
            margin: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #87CEEB; /* 模擬天空/背景 */
            border-bottom: 20px solid #45a049; /* 地面 */
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 95%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .health-bar-container {
            width: 200px;
            height: 20px;
            background: #555;
            border: 2px solid #000;
        }
        .health-bar {
            height: 100%;
            background: limegreen;
            width: 100%;
            transition: width 0.1s;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: #333;
            background: rgba(255,255,255,0.7);
            padding: 5px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="ui-layer">
        <div>
            <div>P1 (藍色)</div>
            <div class="health-bar-container"><div id="p1Health" class="health-bar"></div></div>
        </div>
        <div>
            <div>P2 (紅色)</div>
            <div class="health-bar-container"><div id="p2Health" class="health-bar"></div></div>
        </div>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="controls">
        P1: WASD 移動, F 攻擊 | P2: 方向鍵 移動, L 攻擊
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 遊戲常數
    const GRAVITY = 0; // LF2 是 2.5D，通常沒有重力加速度讓角色往下掉，除非跳躍（此範例簡化不含跳躍）
    const SPEED = 4;

    class Fighter {
        constructor({position, velocity, color, offset, attackKey}) {
            this.position = position;
            this.velocity = velocity;
            this.width = 50;
            this.height = 80; // 模擬站立高度
            this.color = color;
            this.isAttacking = false;
            this.health = 100;
            this.attackBox = {
                position: { x: this.position.x, y: this.position.y },
                offset: offset,
                width: 80, // 攻擊距離
                height: 50
            };
            this.dead = false;
        }

        draw() {
            // 繪製角色
            ctx.fillStyle = this.color;
            ctx.fillRect(this.position.x, this.position.y, this.width, this.height);

            // 繪製影子 (增加立體感)
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(this.position.x + this.width/2, this.position.y + this.height, 20, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // 攻擊時顯示攻擊範圍 (Hitbox) - 用於除錯和視覺回饋
            if (this.isAttacking) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillRect(
                    this.attackBox.position.x, 
                    this.attackBox.position.y, 
                    this.attackBox.width, 
                    this.attackBox.height
                );
            }
        }

        update() {
            this.draw();
            
            // 更新位置
            this.position.x += this.velocity.x;
            this.position.y += this.velocity.y;

            // 邊界限制
            if (this.position.y < 100) this.position.y = 100; // 天際線
            if (this.position.y + this.height > canvas.height) this.position.y = canvas.height - this.height;
            if (this.position.x < 0) this.position.x = 0;
            if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;

            // 更新攻擊框位置 (跟隨角色)
            this.attackBox.position.x = this.position.x + this.attackBox.offset.x;
            this.attackBox.position.y = this.position.y + 10; // 稍微調整高度
        }

        attack() {
            if(!this.dead) {
                this.isAttacking = true;
                setTimeout(() => {
                    this.isAttacking = false;
                }, 100); // 攻擊持續 100ms
            }
        }
    }

    // 創建玩家
    const player = new Fighter({
        position: { x: 100, y: 200 },
        velocity: { x: 0, y: 0 },
        color: 'blue',
        offset: { x: 0, y: 0 }
    });

    const enemy = new Fighter({
        position: { x: 600, y: 200 },
        velocity: { x: 0, y: 0 },
        color: 'red',
        offset: { x: -30, y: 0 } // 攻擊框向左
    });

    const keys = {
        a: { pressed: false },
        d: { pressed: false },
        w: { pressed: false },
        s: { pressed: false },
        ArrowRight: { pressed: false },
        ArrowLeft: { pressed: false },
        ArrowUp: { pressed: false },
        ArrowDown: { pressed: false }
    };

    // 碰撞檢測函數 (Axis-Aligned Bounding Box)
    function rectangularCollision({ rectangle1, rectangle2 }) {
        return (
            rectangle1.attackBox.position.x + rectangle1.attackBox.width >= rectangle2.position.x &&
            rectangle1.attackBox.position.x <= rectangle2.position.x + rectangle2.width &&
            rectangle1.attackBox.position.y + rectangle1.attackBox.height >= rectangle2.position.y &&
            rectangle1.attackBox.position.y <= rectangle2.position.y + rectangle2.height
        );
    }

    function animate() {
        window.requestAnimationFrame(animate);
        ctx.fillStyle = '#87CEEB'; // 清除畫面並重繪背景
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 簡單的透視背景 (地板)
        ctx.fillStyle = '#654321'; // 土壤色
        ctx.fillRect(0, 150, canvas.width, canvas.height); 

        player.update();
        enemy.update();

        // 玩家 1 移動邏輯
        player.velocity.x = 0;
        player.velocity.y = 0;
        if (keys.a.pressed) { player.velocity.x = -SPEED; player.attackBox.offset.x = -30; } // 向左攻擊框調整
        else if (keys.d.pressed) { player.velocity.x = SPEED; player.attackBox.offset.x = 0; } // 向右
        if (keys.w.pressed) player.velocity.y = -SPEED;
        else if (keys.s.pressed) player.velocity.y = SPEED;

        // 玩家 2 移動邏輯
        enemy.velocity.x = 0;
        enemy.velocity.y = 0;
        if (keys.ArrowLeft.pressed) { enemy.velocity.x = -SPEED; enemy.attackBox.offset.x = -30;}
        else if (keys.ArrowRight.pressed) { enemy.velocity.x = SPEED; enemy.attackBox.offset.x = 0;}
        if (keys.ArrowUp.pressed) enemy.velocity.y = -SPEED;
        else if (keys.ArrowDown.pressed) enemy.velocity.y = SPEED;

        // 檢測 P1 攻擊 P2
        if (
            rectangularCollision({ rectangle1: player, rectangle2: enemy }) &&
            player.isAttacking
        ) {
            player.isAttacking = false; // 命中後重置，避免一擊多判
            enemy.health -= 10;
            document.getElementById('p2Health').style.width = enemy.health + '%';
            if(enemy.health <= 0) { enemy.dead = true; enemy.color = 'gray'; }
        }

        // 檢測 P2 攻擊 P1
        if (
            rectangularCollision({ rectangle1: enemy, rectangle2: player }) &&
            enemy.isAttacking
        ) {
            enemy.isAttacking = false;
            player.health -= 10;
            document.getElementById('p1Health').style.width = player.health + '%';
            if(player.health <= 0) { player.dead = true; player.color = 'gray'; }
        }
    }

    animate();

    // 鍵盤監聽
    window.addEventListener('keydown', (event) => {
        if (player.dead || enemy.dead) return; // 遊戲結束不能動

        switch (event.key) {
            case 'd': keys.d.pressed = true; break;
            case 'a': keys.a.pressed = true; break;
            case 'w': keys.w.pressed = true; break;
            case 's': keys.s.pressed = true; break;
            case 'f': player.attack(); break; // P1 攻擊

            case 'ArrowRight': keys.ArrowRight.pressed = true; break;
            case 'ArrowLeft': keys.ArrowLeft.pressed = true; break;
            case 'ArrowUp': keys.ArrowUp.pressed = true; break;
            case 'ArrowDown': keys.ArrowDown.pressed = true; break;
            case 'l': enemy.attack(); break; // P2 攻擊
        }
    });

    window.addEventListener('keyup', (event) => {
        switch (event.key) {
            case 'd': keys.d.pressed = false; break;
            case 'a': keys.a.pressed = false; break;
            case 'w': keys.w.pressed = false; break;
            case 's': keys.s.pressed = false; break;

            case 'ArrowRight': keys.ArrowRight.pressed = false; break;
            case 'ArrowLeft': keys.ArrowLeft.pressed = false; break;
            case 'ArrowUp': keys.ArrowUp.pressed = false; break;
            case 'ArrowDown': keys.ArrowDown.pressed = false; break;
        }
    });
</script>

</body>
</html>
