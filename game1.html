<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Cyber Striker - Ultimate Solo</title>
    <style>
        :root {
            --bg: #030308;
            --p1-neon: #00f2ff;
            --ai-neon: #ff0055;
            --gold: #ffd700;
        }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Orbitron', sans-serif; overflow: hidden; color: white; }
        
        #gameContainer { position: relative; border: 2px solid #1a1a2e; box-shadow: 0 0 100px rgba(0, 242, 255, 0.1); border-radius: 8px; overflow: hidden; }
        canvas { background: #050510; display: block; }
        
        /* HUD 介面 */
        .hud { position: absolute; top: 30px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 10; }
        .stats { width: 380px; }
        .label { font-size: 12px; margin-bottom: 6px; letter-spacing: 2px; text-transform: uppercase; font-weight: 900; }
        .bar-outer { height: 12px; background: rgba(255,255,255,0.05); border: 1px solid #333; position: relative; overflow: hidden; }
        .bar-inner { height: 100%; width: 100%; transition: width 0.4s cubic-bezier(0.1, 1, 0.1, 1); }
        #p1HP { background: var(--p1-neon); box-shadow: 0 0 15px var(--p1-neon); }
        #aiHP { background: var(--ai-neon); box-shadow: 0 0 15px var(--ai-neon); }
        .energy-slot { height: 4px; width: 0%; background: var(--gold); margin-top: 8px; box-shadow: 0 0 10px var(--gold); transition: width 0.2s; }

        /* 選單與覆蓋層 */
        #overlay, #winScreen { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; }
        .btn { padding: 16px 45px; background: transparent; color: var(--p1-neon); border: 2px solid var(--p1-neon); cursor: pointer; font-size: 18px; font-family: 'Orbitron'; transition: 0.3s; margin-top: 20px; letter-spacing: 2px; }
        .btn:hover { background: var(--p1-neon); color: black; box-shadow: 0 0 30px var(--p1-neon); transform: translateY(-2px); }
        
        .hint { position: absolute; bottom: 15px; width: 100%; text-align: center; color: #444; font-size: 11px; letter-spacing: 1px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="gameContainer">
    <div class="hud" id="gameHUD" style="display:none;">
        <div class="stats">
            <div class="label" style="color:var(--p1-neon)">P1 // STRIKER</div>
            <div class="bar-outer"><div id="p1HP" class="bar-inner"></div></div>
            <div id="p1EN" class="energy-slot"></div>
        </div>
        <div class="stats" style="text-align:right;">
            <div class="label" style="color:var(--ai-neon)">AI // SENTINEL</div>
            <div class="bar-outer"><div id="aiHP" class="bar-inner"></div></div>
        </div>
    </div>

    <div id="overlay">
        <h1 style="font-size:55px; margin:0; letter-spacing:8px; text-shadow: 0 0 20px var(--p1-neon);">CYBER STRIKER</h1>
        <p style="color:#666; font-size:14px; margin-top:10px;">NEURAL LINK ESTABLISHED</p>
        <button class="btn" onclick="startGame()">INITIATE COMBAT</button>
        <button class="btn" style="border-color:#444; color:#444; font-size:14px;" onclick="backToHub()">EXIT TO HUB</button>
    </div>

    <div id="winScreen" style="display:none;">
        <h2 id="resultMsg" style="font-size:45px; letter-spacing:5px;">MISSION COMPLETE</h2>
        <button class="btn" onclick="location.reload()">REBOOT SYSTEM</button>
    </div>

    <canvas id="stage" width="1000" height="500"></canvas>
    <div class="hint">W/A/S/D: MOVE | J: STRIKE | K: BLOCK | L: DASH (30% ENERGY)</div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const keys = {};
    let gameRunning = false;
    let shake = 0;
    let particles = [];

    // 固定顏色常量，修復之前的語法錯誤
    const COLOR_P1 = '#00f2ff';
    const COLOR_AI = '#ff0055';
    const COLOR_GOLD = '#ffd700';

    function backToHub() {
        const p = new URLSearchParams(window.location.search);
        window.location.href = `index.html?back=true&gate=${p.get('gate')||0}`;
    }

    class Particle {
        constructor(x, y, color, speed=6) {
            this.x = x; this.y = y;
            this.vx = (Math.random()-0.5)*speed;
            this.vy = (Math.random()-0.5)*speed;
            this.life = 1.0;
            this.color = color;
            this.size = Math.random()*3 + 1;
        }
        update() { 
            this.x += this.vx; this.y += this.vy; 
            this.life -= 0.025; 
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    class Fighter {
        constructor(x, y, color, isAI) {
            this.pos = {x, y};
            this.vel = {x: 0, y: 0};
            this.color = color;
            this.isAI = isAI;
            this.hp = 100;
            this.en = 0;
            this.facing = isAI ? -1 : 1;
            this.state = 'IDLE'; // IDLE, ATTACK, BLOCK, HURT, DASH
            this.timer = 0;
            this.frame = 0;
        }

        draw() {
            this.frame += 0.15;
            const float = Math.sin(this.frame) * 4;
            const {x, y} = this.pos;

            ctx.save();
            if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            
            // 投影
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(x+25, y+85, 22, 6, 0, 0, Math.PI*2); ctx.fill();

            // 繪製 Cyber-Frame 模組
            ctx.translate(x+25, y+45 + float);
            if(this.facing === -1) ctx.scale(-1, 1);

            // 1. 核心 Glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.state === 'HURT' ? '#fff' : this.color;
            
            // 軀幹 (幾何感)
            ctx.beginPath();
            ctx.moveTo(-15, -35); ctx.lineTo(15, -35); ctx.lineTo(22, 0);
            ctx.lineTo(15, 35); ctx.lineTo(-15, 35); ctx.lineTo(-22, 0);
            ctx.closePath(); ctx.fill();

            // 2. 獨立頭部
            ctx.fillStyle = '#fff';
            ctx.fillRect(-12, -55, 24, 14);
            ctx.fillStyle = this.color;
            ctx.fillRect(4, -50, 10, 4); // 護目鏡

            // 3. 肢體線條 (修正點)
            ctx.lineWidth = 4;
            ctx.strokeStyle = this.state === 'BLOCK' ? COLOR_GOLD : '#fff';
            ctx.shadowBlur = this.state === 'BLOCK' ? 10 : 0;
            
            ctx.beginPath(); 
            ctx.moveTo(-20, 0); 
            if(this.state === 'ATTACK') {
                ctx.lineTo(45, -5); 
                ctx.stroke();
                // 擊打光效
                ctx.fillStyle = '#fff'; ctx.fillRect(40, -10, 12, 12);
            } else if(this.state === 'BLOCK') {
                ctx.lineTo(15, -25); ctx.lineTo(15, 25); ctx.stroke();
            } else if(this.state === 'DASH') {
                ctx.lineTo(-50, 0); ctx.stroke(); // 衝刺拖尾
            } else {
                ctx.lineTo(-35, 25); ctx.stroke();
            }

            ctx.restore();
        }

        update(target) {
            this.pos.x += this.vel.x;
            this.vel.x *= 0.82;
            this.pos.x = Math.max(0, Math.min(canvas.width-50, this.pos.x));

            if(this.timer > 0) {
                this.timer--;
                if(this.timer === 0) this.state = 'IDLE';
            }

            if(!this.isAI) {
                this.en = Math.min(100, this.en + 0.2);
                document.getElementById('p1EN').style.width = this.en + '%';
            }

            this.draw();
        }

        perform(type, target) {
            if(this.state !== 'IDLE') return;

            if(type === 'ATTACK') {
                this.state = 'ATTACK'; this.timer = 12;
                const dist = Math.abs((this.pos.x + 25) - (target.pos.x + 25));
                if(dist < 100) {
                    target.getHit(10, this.facing);
                    if(!this.isAI) this.en = Math.min(100, this.en + 12);
                }
            } else if(type === 'DASH' && this.en >= 30) {
                this.en -= 30; this.state = 'DASH'; this.timer = 10;
                this.vel.x = this.facing * 35;
                // 衝刺粒子
                for(let i=0; i<12; i++) particles.push(new Particle(this.pos.x+25, this.pos.y+45, this.color));
            }
        }

        getHit(dmg, dir) {
            if(this.state === 'BLOCK') {
                this.vel.x = dir * 6; shake = 4;
            } else {
                this.hp -= dmg; this.state = 'HURT'; this.timer = 14;
                this.vel.x = dir * 18; shake = 12;
                // 電子火花粒子
                for(let i=0; i<15; i++) particles.push(new Particle(this.pos.x+25, this.pos.y+45, '#fff', 10));
            }
            const barId = this.isAI ? 'aiHP' : 'p1HP';
            document.getElementById(barId).style.width = Math.max(0, this.hp) + '%';
            if(this.hp <= 0) {
                // 死亡爆炸效果
                for(let i=0; i<40; i++) particles.push(new Particle(this.pos.x+25, this.pos.y+45, this.color, 15));
                endGame(this.isAI ? 'WIN' : 'LOSS');
            }
        }
    }

    let p1, ai;

    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('gameHUD').style.display = 'flex';
        p1 = new Fighter(150, 300, COLOR_P1, false);
        ai = new Fighter(800, 300, COLOR_AI, true);
        gameRunning = true;
        mainLoop();
    }

    function mainLoop() {
        if(!gameRunning) return;
        
        // 渲染背景
        ctx.fillStyle = '#050510'; ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // 科技感背景網格
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.05)';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let j=0; j<canvas.height; j+=50) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

        // P1 控制輸入
        if(p1.state === 'IDLE' || p1.state === 'BLOCK') {
            if(keys['a']) { p1.vel.x = -8; p1.facing = -1; }
            if(keys['d']) { p1.vel.x = 8; p1.facing = 1; }
            if(keys['j']) p1.perform('ATTACK', ai);
            if(keys['k']) p1.state = 'BLOCK'; else if(p1.state === 'BLOCK') p1.state = 'IDLE';
            if(keys['l']) p1.perform('DASH', ai);
        }

        // AI 邏輯
        if(ai.state === 'IDLE') {
            const dist = p1.pos.x - ai.pos.x;
            ai.facing = dist > 0 ? 1 : -1;
            if(Math.abs(dist) > 90) {
                ai.vel.x = ai.facing * 4.5;
            } else {
                if(Math.random() < 0.07) ai.perform('ATTACK', p1);
                if(p1.state === 'ATTACK' && Math.random() < 0.2) ai.state = 'BLOCK';
            }
        }

        p1.update(ai);
        ai.update(p1);

        // 特效處理
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(); });

        if(shake > 0) shake--;
        requestAnimationFrame(mainLoop);
    }

    function endGame(result) {
        gameRunning = false;
        setTimeout(() => {
            document.getElementById('winScreen').style.display = 'flex';
            const msg = document.getElementById('resultMsg');
            if(result === 'WIN') {
                msg.innerText = "MISSION ACCOMPLISHED";
                msg.style.color = COLOR_P1;
            } else {
                msg.innerText = "NEURAL LINK SEVERED";
                msg.style.color = COLOR_AI;
            }
        }, 1000);
    }

    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;
</script>
</body>
</html>
