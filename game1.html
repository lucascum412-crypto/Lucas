<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>RONIN DUEL - 流暢優化版</title>
    <style>
        :root {
            --bg: #1a1712;
            --p1-color: #c43e3e;
            --ai-color: #545e75;
            --gold: #d4af37;
            --ink: #111;
            --paper: #e6dccd;
        }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'serif'; overflow: hidden; color: var(--paper); }
        
        #gameContainer { position: relative; border: 4px double #3a352a; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 4px; overflow: hidden; background: var(--paper); }
        canvas { background: #e6dccd; display: block; }
        
        .hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .stats { width: 350px; }
        .label { font-size: 16px; margin-bottom: 8px; letter-spacing: 2px; font-weight: bold; color: var(--ink); border-bottom: 2px solid rgba(0,0,0,0.1); display: inline-block; }
        .bar-outer { height: 14px; background: rgba(0,0,0,0.1); border: 2px solid var(--ink); }
        .bar-inner { height: 100%; width: 100%; transition: width 0.3s ease-out; }
        #p1HP { background: var(--p1-color); }
        #aiHP { background: var(--ai-color); }
        .stamina-bar { height: 6px; width: 0%; background: var(--gold); margin-top: 5px; border: 1px solid var(--ink); }

        #overlay, #winScreen { position: absolute; inset: 0; background: rgba(26, 23, 18, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; }
        h1 { font-size: 60px; margin: 0; letter-spacing: 10px; color: var(--p1-color); text-shadow: 2px 2px 0 var(--ink); }
        .btn { padding: 15px 50px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); cursor: pointer; font-size: 20px; font-family: 'serif'; transition: 0.2s; margin-top: 25px; font-weight: bold; }
        .btn:hover { background: var(--p1-color); color: var(--paper); }
        
        .hint { position: absolute; bottom: 15px; width: 100%; text-align: center; color: var(--ink); font-size: 14px; font-weight: bold; z-index: 5; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="hud" id="gameHUD" style="display:none;">
        <div class="stats">
            <div class="label">浪人 (P1)</div>
            <div class="bar-outer"><div id="p1HP" class="bar-inner"></div></div>
            <div id="p1EN" class="stamina-bar"></div>
        </div>
        <div class="stats" style="text-align:right;">
            <div class="label">劍豪 (AI)</div>
            <div class="bar-outer"><div id="aiHP" class="bar-inner" style="margin-left: auto;"></div></div>
        </div>
    </div>

    <div id="overlay">
        <h1>浪人決鬥</h1>
        <button class="btn" onclick="startGame()">拔刀</button>
    </div>

    <div id="winScreen" style="display:none;">
        <h2 id="resultMsg" style="font-size:50px; color: var(--gold);">勝負已分</h2>
        <button class="btn" onclick="location.reload()">再戰</button>
    </div>

    <canvas id="stage" width="1000" height="500"></canvas>
    <div class="hint">WASD: 移動 | J: 斬擊 | K: 格擋 | L: 瞬步</div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const keys = {};
    let gameRunning = false;
    let shake = 0;
    let particles = [];
    const MAX_PARTICLES = 100; // 限制粒子總數防止Lag

    const COLOR_P1 = '#c43e3e';
    const COLOR_AI = '#545e75';
    const COLOR_GOLD = '#d4af37';
    const COLOR_INK = '#111';
    const MIN_Y = 250, MAX_Y = 460;

    class Particle {
        constructor(x, y, color, speed) {
            this.x = x; this.y = y;
            this.vx = (Math.random()-0.5)*speed;
            this.vy = (Math.random()-0.5)*speed;
            this.life = 1.0;
            this.color = color;
            this.size = Math.random()*5 + 2;
        }
        update() { 
            this.x += this.vx; this.y += this.vy; 
            this.life -= 0.03; 
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            // 優化點：使用 fillRect 代替 arc
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    function spawnParticles(x, y, color, count, speed) {
        for(let i=0; i<count; i++) {
            if(particles.length < MAX_PARTICLES) {
                particles.push(new Particle(x, y, color, speed));
            }
        }
    }

    class Fighter {
        constructor(x, y, color, isAI) {
            this.pos = {x, y};
            this.vel = {x: 0, y: 0};
            this.color = color;
            this.isAI = isAI;
            this.hp = 100; this.en = 0;
            this.facing = isAI ? -1 : 1;
            this.state = 'IDLE'; 
            this.timer = 0;
            this.blockHits = 0;
            this.maxBlockHits = 5;
            this.frame = 0;
        }

        draw() {
            this.frame += 0.1;
            const {x, y} = this.pos;
            const scale = 0.7 + (y - MIN_Y) / (MAX_Y - MIN_Y) * 0.5;

            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            
            // 陰影
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(0, 5, 30, 8, 0, 0, Math.PI*2); ctx.fill();

            ctx.translate(0, -60); 
            if(this.facing === -1) ctx.scale(-1, 1);

            // 繪製角色主體
            ctx.fillStyle = this.state === 'HURT' || this.state === 'STUNNED' ? '#fff' : this.color;
            
            // 道袍
            ctx.beginPath();
            ctx.moveTo(-20, -30); ctx.lineTo(20, -30); ctx.lineTo(30, 40); ctx.lineTo(-30, 40);
            ctx.fill();

            // 陣笠 (斗笠)
            ctx.fillStyle = '#8b7d6b';
            ctx.beginPath();
            ctx.moveTo(-35, -45); ctx.lineTo(35, -45); ctx.lineTo(0, -75);
            ctx.fill();

            // 武器動作
            ctx.strokeStyle = COLOR_INK;
            ctx.lineWidth = 4;
            ctx.beginPath();
            if(this.state === 'ATTACK') {
                ctx.moveTo(-10, -10); ctx.lineTo(50, -10);
                ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.fillRect(45, -15, 30, 8);
            } else if(this.state === 'BLOCK') {
                const bRatio = this.blockHits / this.maxBlockHits;
                ctx.strokeStyle = `rgb(200, ${200*(1-bRatio)}, 0)`;
                ctx.moveTo(10, 10); ctx.lineTo(20, -40);
                ctx.stroke();
            } else if(this.state === 'STUNNED') {
                ctx.moveTo(-10, 0); ctx.lineTo(-20, 20); ctx.stroke();
                ctx.fillStyle = COLOR_GOLD;
                ctx.fillText("破綻!", -10, -85);
            } else {
                ctx.moveTo(-15, 0); ctx.lineTo(15, 20); ctx.stroke();
            }

            ctx.restore();
        }

        update(target) {
            this.pos.x += this.vel.x;
            this.pos.y += this.vel.y;
            this.vel.x *= 0.8; this.vel.y *= 0.8;

            this.pos.x = Math.max(50, Math.min(canvas.width-50, this.pos.x));
            this.pos.y = Math.max(MIN_Y, Math.min(MAX_Y, this.pos.y));

            if(this.timer > 0) {
                this.timer--;
                if(this.timer === 0) {
                    this.state = 'IDLE';
                    if(this.blockHits >= this.maxBlockHits) this.blockHits = 0;
                }
            }
            if(!this.isAI) this.en = Math.min(100, this.en + 0.3);
            this.draw();
        }

        perform(type, target) {
            if(this.state !== 'IDLE') return;

            if(type === 'ATTACK') {
                this.state = 'ATTACK'; this.timer = 15;
                const xDist = Math.abs(this.pos.x - target.pos.x);
                const yDist = Math.abs(this.pos.y - target.pos.y);

                if(xDist < 120 && yDist < 40) {
                    target.getHit(10, this.facing);
                    if(!this.isAI) this.en = Math.min(100, this.en + 10);
                }
            } else if(type === 'DASH' && this.en >= 30) {
                this.en -= 30; this.state = 'DASH'; this.timer = 10;
                this.vel.x = this.facing * 40;
                spawnParticles(this.pos.x, this.pos.y, '#ddd', 8, 4);
            }
        }

        getHit(dmg, dir) {
            if(this.state === 'BLOCK') {
                this.blockHits++;
                this.vel.x = dir * 8;
                shake = 5;
                spawnParticles(this.pos.x + dir*30, this.pos.y-40, COLOR_GOLD, 5, 8);
                
                if(this.blockHits >= this.maxBlockHits) {
                    this.state = 'STUNNED';
                    this.timer = 80;
                    shake = 25; // 破防震動
                    this.vel.x = dir * 15;
                    spawnParticles(this.pos.x, this.pos.y-40, COLOR_INK, 20, 12);
                }
            } else if (this.state !== 'STUNNED') {
                this.hp -= dmg; this.state = 'HURT'; this.timer = 15;
                this.vel.x = dir * 15;
                shake = 10;
                spawnParticles(this.pos.x, this.pos.y-40, this.color, 15, 10);
            }
            
            document.getElementById(this.isAI ? 'aiHP' : 'p1HP').style.width = Math.max(0, this.hp) + '%';
            if(this.hp <= 0) endGame(this.isAI ? 'WIN' : 'LOSS');
        }
    }

    let p1, ai;

    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('gameHUD').style.display = 'flex';
        p1 = new Fighter(200, 350, COLOR_P1, false);
        ai = new Fighter(800, 350, COLOR_AI, true);
        gameRunning = true;
        mainLoop();
    }

    function mainLoop() {
        if(!gameRunning) return;
        
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#e6dccd'; ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // 地面裝飾
        ctx.strokeStyle = 'rgba(0,0,0,0.05)';
        for(let i=MIN_Y; i<=MAX_Y; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        // P1 輸入
        if(p1.state === 'IDLE' || p1.state === 'BLOCK') {
            if(keys['w']) p1.vel.y = -6; if(keys['s']) p1.vel.y = 6;
            if(keys['a']) { p1.vel.x = -7; p1.facing = -1; }
            if(keys['d']) { p1.vel.x = 7; p1.facing = 1; }
            if(keys['j']) p1.perform('ATTACK', ai);
            if(keys['k']) p1.state = 'BLOCK'; else if(p1.state === 'BLOCK') p1.state = 'IDLE';
            if(keys['l']) p1.perform('DASH', ai);
        }

        // AI 邏輯
        if(ai.state === 'IDLE') {
            const xDist = p1.pos.x - ai.pos.x;
            const yDist = p1.pos.y - ai.pos.y;
            ai.facing = xDist > 0 ? 1 : -1;
            if(Math.abs(xDist) > 110) ai.vel.x = ai.facing * 4;
            if(Math.abs(yDist) > 20) ai.vel.y = yDist > 0 ? 3 : -3;
            if(Math.abs(xDist) < 130 && Math.abs(yDist) < 40) {
                if(Math.random() < 0.04) ai.perform('ATTACK', p1);
                if(p1.state === 'ATTACK' && ai.blockHits < 4 && Math.random() < 0.3) ai.state = 'BLOCK';
            }
        }

        // 深度排序渲染
        if(p1.pos.y > ai.pos.y) { ai.update(p1); p1.update(ai); }
        else { p1.update(ai); ai.update(p1); }

        // 粒子更新
        ctx.save();
        for(let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if(particles[i].life <= 0) particles.splice(i, 1);
            else particles[i].draw();
        }
        ctx.restore();

        if(shake > 0) shake--;
        requestAnimationFrame(mainLoop);
    }

    function endGame(result) {
        gameRunning = false;
        setTimeout(() => {
            document.getElementById('winScreen').style.display = 'flex';
            document.getElementById('resultMsg').innerText = result === 'WIN' ? "勝負已分：敵將討取" : "勝負已分：敗北";
        }, 800);
    }

    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;
</script>
</body>
</html>
