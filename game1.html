<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>LF2 終極格鬥 - 霓虹進化版</title>
    <style>
        /* 保留你所有的 CSS */
        :root { --bg-color: #0d0d1a; --card-bg: #1a1a2e; --primary-color: #00f2ff; --secondary-color: #e94560; --text-color: #e0e0e0; }
        body { margin: 0; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-color); font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        #gameContainer { position: relative; border: 3px solid #333; box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); background: #000; border-radius: 10px; overflow: hidden; }
        canvas { background-color: #16213e; display: block; }
        #mainMenu { position: absolute; inset: 0; background: rgba(13, 13, 26, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .title { font-size: 45px; color: var(--primary-color); margin-bottom: 30px; text-shadow: 0 0 15px rgba(0, 242, 255, 0.6); letter-spacing: 3px; font-weight: bold; }
        .mode-btn { padding: 15px 50px; font-size: 20px; cursor: pointer; background: var(--card-bg); color: white; border: 1px solid #444; margin: 10px; border-radius: 50px; transition: 0.3s; width: 320px; font-weight: bold; text-decoration: none; text-align: center; }
        .mode-btn:hover { background: var(--primary-color); color: #000; border-color: #fff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); transform: translateY(-3px); }
        .exit-btn { border-color: var(--secondary-color); color: var(--secondary-color); }
        .exit-btn:hover { background: var(--secondary-color); color: white; box-shadow: 0 0 20px rgba(233, 69, 96, 0.4); }
        #abortBtn { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); padding: 8px 20px; background: rgba(233, 69, 96, 0.2); color: var(--secondary-color); border: 1px solid var(--secondary-color); border-radius: 5px; cursor: pointer; z-index: 80; display: none; transition: 0.3s; font-weight: bold; }
        .ui-layer { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; visibility: hidden; }
        .health-box { width: 320px; background: rgba(26, 26, 46, 0.8); padding: 12px; border-radius: 10px; border: 1px solid #333; }
        .bar-bg { width: 100%; height: 18px; background: #000; border-radius: 9px; overflow: hidden; margin-top: 5px; border: 1px solid #444; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #p1Health { background: linear-gradient(90deg, #00f2ff, #0066ff); }
        #p2Health { background: linear-gradient(90deg, #e94560, #8b0000); }
        .shield-dots { display: flex; gap: 5px; margin-top: 8px; }
        .dot { width: 18px; height: 6px; background: var(--primary-color); border-radius: 2px; }
        #gameOverMenu { position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 50; flex-direction: column; gap: 15px; }
        .end-btn { padding: 12px 50px; font-size: 18px; cursor: pointer; background: var(--primary-color); border: none; font-weight: bold; border-radius: 50px; text-decoration: none; color: #000; text-align: center; }
        #status { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(13, 13, 26, 0.9); padding: 10px 30px; border-radius: 50px; font-size: 12px; visibility: hidden; }
        .win-text { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; font-weight: bold; display: none; z-index: 10; text-align: center; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="mainMenu">
        <div class="title">ARCADE FIGHTER</div>
        <button class="mode-btn" onclick="initGame('single')">單人挑戰</button>
        <button class="mode-btn" onclick="initGame('pvp')">雙人對戰</button>
        <a href="javascript:backToLobby()" class="mode-btn exit-btn">返回遊戲中心</a>
    </div>

    <button id="abortBtn" onclick="backToLobby()">中止並返回</button>

    <div class="ui-layer" id="gameUI">
        <div class="health-box">
            <div id="p1Health" class="bar-fill"></div>
            <div class="shield-dots" id="p1Shield"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>
        <div class="health-box">
            <div id="p2Health" class="bar-fill"></div>
            <div class="shield-dots" id="p2Shield"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>
    </div>

    <div id="winDisplay" class="win-text"></div>
    
    <div id="gameOverMenu">
        <button class="end-btn" onclick="resetToMenu()">重賽</button>
        <a href="javascript:backToLobby()" class="end-btn end-exit">回遊戲大廳</a>
    </div>
    
    <canvas id="gameCanvas" width="900" height="450"></canvas>
    <div id="status">P1: WASD / P2: 方向鍵</div>
</div>

<script>
    // --- 新增返回邏輯 ---
    function backToLobby() {
        const urlParams = new URLSearchParams(window.location.search);
        const gate = urlParams.get('gate') || 0;
        window.location.href = `index.html?back=true&gate=${gate}`;
    }

    // --- 完全保留你原本的所有 Fighter 邏輯 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const keys = {};
    let gameActive = false;
    let isSinglePlayer = true;

    // ... 此處補回你原本所有的 Fighter 類別、updateLoop、AI 邏輯 ...
    // [請將你原本 script 標籤內的程式碼全部貼在此處，只需確保返回按鈕調用 backToLobby() 即可]
</script>
</body>
</html>
