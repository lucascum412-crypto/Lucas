<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Cyber Striker - Solo Edition</title>
    <style>
        :root {
            --bg: #030308;
            --p1-neon: #00f2ff;
            --ai-neon: #ff0055;
            --gold: #ffd700;
        }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Orbitron', sans-serif; overflow: hidden; color: white; }
        #gameContainer { position: relative; border: 2px solid #111; box-shadow: 0 0 100px rgba(0,0,0,0.5); }
        canvas { background: #050510; display: block; cursor: crosshair; }
        
        /* UI 介面 */
        .hud { position: absolute; top: 30px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .stats { width: 400px; }
        .label { font-size: 14px; margin-bottom: 5px; letter-spacing: 2px; text-transform: uppercase; }
        .bar-outer { height: 14px; background: rgba(255,255,255,0.1); border: 1px solid #333; position: relative; padding: 2px; }
        .bar-inner { height: 100%; width: 100%; transition: width 0.3s cubic-bezier(0.1, 1, 0.1, 1); }
        #p1HP { background: var(--p1-neon); box-shadow: 0 0 15px var(--p1-neon); }
        #aiHP { background: var(--ai-neon); box-shadow: 0 0 15px var(--ai-neon); }
        .energy-slot { height: 4px; width: 0%; background: var(--gold); margin-top: 8px; box-shadow: 0 0 10px var(--gold); }

        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .btn { padding: 15px 40px; background: transparent; color: var(--p1-neon); border: 2px solid var(--p1-neon); cursor: pointer; font-size: 20px; transition: 0.3s; margin-top: 20px; }
        .btn:hover { background: var(--p1-neon); color: black; box-shadow: 0 0 30px var(--p1-neon); }
        
        #winScreen { position: absolute; inset: 0; display: none; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 110; }
        .hint { position: absolute; bottom: 20px; color: #555; font-size: 12px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="gameContainer">
    <div class="hud" id="gameHUD" style="display:none;">
        <div class="stats">
            <div class="label" style="color:var(--p1-neon)">Striker - P1</div>
            <div class="bar-outer"><div id="p1HP" class="bar-inner"></div></div>
            <div id="p1EN" class="energy-slot"></div>
        </div>
        <div class="stats" style="text-align:right;">
            <div class="label" style="color:var(--ai-neon)">Sentinel - AI</div>
            <div class="bar-outer"><div id="aiHP" class="bar-inner"></div></div>
        </div>
    </div>

    <div id="overlay">
        <h1 style="font-size:60px; margin:0; text-shadow: 0 0 20px var(--p1-neon);">CYBER STRIKER</h1>
        <p style="color:#aaa;">SINGLE PLAYER CHALLENGE</p>
        <button class="btn" onclick="startGame()">INITIATE COMBAT</button>
        <button class="btn" style="border-color:#555; color:#555; font-size: 14px;" onclick="backToHub()">RETURN TO HUB</button>
    </div>

    <div id="winScreen">
        <h2 id="resultMsg" style="font-size:50px;">MISSION ACCOMPLISHED</h2>
        <button class="btn" onclick="location.reload()">REBOOT</button>
    </div>

    <canvas id="stage" width="1000" height="500"></canvas>
    <div class="hint">WASD: MOVE | J: ATTACK | K: BLOCK | L: DASH (30% Energy)</div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const keys = {};
    let gameRunning = false;
    let shake = 0;
    let particles = [];
    let ghosts = []; // 殘影

    function backToHub() {
        const p = new URLSearchParams(window.location.search);
        window.location.href = `index.html?back=true&gate=${p.get('gate')||0}`;
    }

    class Particle {
        constructor(x, y, color, speed=5) {
            this.x = x; this.y = y;
            this.vx = (Math.random()-0.5)*speed;
            this.vy = (Math.random()-0.5)*speed;
            this.life = 1.0;
            this.color = color;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.03; }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, 3, 3);
            ctx.globalAlpha = 1;
        }
    }

    class Fighter {
        constructor(x, y, color, isAI) {
            this.pos = {x, y};
            this.vel = {x: 0, y: 0};
            this.color = color;
            this.isAI = isAI;
            this.hp = 100;
            this.en = 0;
            this.facing = isAI ? -1 : 1;
            this.state = 'IDLE'; // IDLE, ATTACK, BLOCK, HURT
            this.timer = 0;
            this.w = 50; this.h = 80;
            this.frame = 0;
        }

        draw() {
            this.frame += 0.15;
            const float = Math.sin(this.frame) * 4;
            const {x, y} = this.pos;

            ctx.save();
            if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            
            // 角色投影
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath(); ctx.ellipse(x+25, y+85, 20, 5, 0, 0, Math.PI*2); ctx.fill();

            // 高級模組繪製
            ctx.translate(x+25, y+40 + float);
            if(this.facing === -1) ctx.scale(-1, 1);

            // 1. 核心 (Glow Core)
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.state === 'HURT' ? 'white' : this.color;
            
            // 身體主幹 (六角形感)
            ctx.beginPath();
            ctx.moveTo(-15, -30); ctx.lineTo(15, -30); ctx.lineTo(20, 0);
            ctx.lineTo(15, 30); ctx.lineTo(-15, 30); ctx.lineTo(-20, 0);
            ctx.closePath(); ctx.fill();

            // 2. 頭部 (分離式設計)
            ctx.fillStyle = '#fff';
            ctx.fillRect(-10, -50, 20, 12);
            ctx.fillStyle = this.color;
            ctx.fillRect(2, -46, 8, 3); // 護目鏡

            // 3. 手臂與腿部 (動態)
            ctx.lineWidth = 4;
            ctx.strokeStyle = this.state === 'BLOCK' ? var(--gold) : '#fff';
            
            // 左手
            ctx.beginPath(); ctx.moveTo(-20, 0); 
            if(this.state === 'ATTACK') {
                ctx.lineTo(40, 0); // 出擊
                ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.fillRect(35, -5, 10, 10);
            } else if(this.state === 'BLOCK') {
                ctx.lineTo(10, -20); ctx.lineTo(10, 20); ctx.stroke();
            } else {
                ctx.lineTo(-30, 20); ctx.stroke();
            }

            ctx.restore();
        }

        update() {
            this.pos.x += this.vel.x;
            this.vel.x *= 0.8;
            this.pos.x = Math.max(0, Math.min(canvas.width-50, this.pos.x));

            if(this.timer > 0) {
                this.timer--;
                if(this.timer === 0) this.state = 'IDLE';
            }
            if(!this.isAI) {
                this.en = Math.min(100, this.en + 0.2);
                document.getElementById('p1EN').style.width = this.en + '%';
            }
            this.draw();
        }

        action(type, target) {
            if(this.state !== 'IDLE') return;
            if(type === 'ATTACK') {
                this.state = 'ATTACK'; this.timer = 12;
                if(Math.abs(this.pos.x - target.pos.x) < 90) {
                    target.getHit(10, this.facing);
                    this.en = Math.min(100, this.en + 10);
                }
            } else if(type === 'DASH' && this.en >= 30) {
                this.en -= 30; this.state = 'DASH'; this.timer = 8;
                this.vel.x = this.facing * 30;
                for(let i=0; i<8; i++) particles.push(new Particle(this.pos.x+25, this.pos.y+40, this.color));
            }
        }

        getHit(dmg, dir) {
            if(this.state === 'BLOCK') {
                this.vel.x = dir * 5; shake = 4;
            } else {
                this.hp -= dmg; this.state = 'HURT'; this.timer = 15;
                this.vel.x = dir * 15; shake = 10;
                for(let i=0; i<12; i++) particles.push(new Particle(this.pos.x+25, this.pos.y+40, '#ff0', 8));
            }
            const id = this.isAI ? 'aiHP' : 'p1HP';
            document.getElementById(id).style.width = Math.max(0, this.hp) + '%';
            if(this.hp <= 0) endGame(this.isAI ? 'WIN' : 'LOSS');
        }
    }

    let p1, ai;

    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('gameHUD').style.display = 'flex';
        p1 = new Fighter(150, 300, '#00f2ff', false);
        ai = new Fighter(800, 300, '#ff0055', true);
        gameRunning = true;
        mainLoop();
    }

    function updateAI() {
        if(ai.state !== 'IDLE') return;
        const d = p1.pos.x - ai.pos.x;
        ai.facing = d > 0 ? 1 : -1;
        if(Math.abs(d) > 80) ai.vel.x = ai.facing * 4;
        else {
            if(Math.random() < 0.06) ai.action('ATTACK', p1);
            if(p1.state === 'ATTACK' && Math.random() < 0.2) ai.state = 'BLOCK';
        }
    }

    function mainLoop() {
        if(!gameRunning) return;
        ctx.fillStyle = '#050510'; ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // 背景網格特效
        ctx.strokeStyle = '#111';
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }

        // P1 控制
        if(p1.state === 'IDLE' || p1.state === 'BLOCK') {
            if(keys['a']) { p1.vel.x = -7; p1.facing = -1; }
            if(keys['d']) { p1.vel.x = 7; p1.facing = 1; }
            if(keys['j']) p1.action('ATTACK', ai);
            if(keys['k']) p1.state = 'BLOCK'; else if(p1.state === 'BLOCK') p1.state = 'IDLE';
            if(keys['l']) p1.action('DASH', ai);
        }

        updateAI();
        p1.update();
        ai.update();

        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(); });

        if(shake > 0) shake--;
        requestAnimationFrame(mainLoop);
    }

    function endGame(res) {
        gameRunning = false;
        document.getElementById('winScreen').style.display = 'flex';
        const msg = document.getElementById('resultMsg');
        msg.innerText = res === 'WIN' ? "MISSION ACCOMPLISHED" : "SYSTEM CRITICAL - FAILED";
        msg.style.color = res === 'WIN' ? "#00f2ff" : "#ff0055";
    }

    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;
</script>
</body>
</html>
