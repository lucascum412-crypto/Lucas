<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>ARCADE FIGHTER</title>
    <style>
        /* ... 保留之前的 CSS ... */
        #midGameExit { 
            position: absolute; bottom: 80px; right: 20px; 
            padding: 8px 15px; background: rgba(233, 69, 96, 0.5); 
            color: white; text-decoration: none; border-radius: 5px; 
            font-size: 12px; visibility: hidden; z-index: 60; border: 1px solid var(--secondary-color);
        }
        #midGameExit:hover { background: var(--secondary-color); }
    </style>
</head>
<body>
<div id="gameContainer">
    <div id="mainMenu">
        <div class="title">ARCADE FIGHTER</div>
        <button class="mode-btn" onclick="initGame('single')">單人挑戰 (J/K/L 鍵可用)</button>
        <button class="mode-btn" onclick="initGame('pvp')">雙人對戰 (僅限 Z/X/C)</button>
        <a href="index.html" class="mode-btn exit-btn">返回遊戲中心</a>
    </div>

    <a href="index.html" id="midGameExit">放棄戰鬥 (退出)</a>

    <div class="ui-layer" id="gameUI"> ... </div>
    <div id="winDisplay" class="win-text"></div>
    <div id="gameOverMenu"> ... </div>
    <canvas id="gameCanvas" width="900" height="450"></canvas>
    <div id="status"> ... </div>
</div>

<script>
    // ... Fighter 類別保持不變 ...

    function initGame(mode) {
        isSinglePlayer = (mode === 'single');
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('gameUI').style.visibility = 'visible';
        document.getElementById('status').style.visibility = 'visible';
        document.getElementById('midGameExit').style.visibility = 'visible'; // 顯示中途退出
        
        p1 = new Fighter({ position: {x: 150, y: 280}, color: '#00f2ff', id: 1, isAI: false });
        p2 = new Fighter({ position: {x: 700, y: 280}, color: '#e94560', id: 2, isAI: isSinglePlayer });
        
        gameActive = true;
        updateLoop();
    }

    function handleInput() {
        if (!gameActive) return;
        if (p1.state === 'IDLE' || p1.state === 'BLOCK' || p1.state === 'ATTACK') {
            // P1 移動 (WASD)
            if (keys['w']) p1.velocity.y = -5; if (keys['s']) p1.velocity.y = 5;
            if (keys['a']) { p1.velocity.x = -5; p1.facing = -1; }
            if (keys['d']) { p1.velocity.x = 5; p1.facing = 1; }
            
            // P1 攻擊邏輯
            if (keys['z']) p1.performAttack(p2);
            if (keys['c']) p1.performBreak(p2);
            
            // 單人模式額外支援 JKL
            if (isSinglePlayer) {
                if (keys['j']) p1.performAttack(p2);
                if (keys['l']) p1.performBreak(p2);
                if (keys['k']) p1.state = 'BLOCK';
                else if (p1.state === 'BLOCK' && !keys['x']) p1.state = 'IDLE';
            }

            if (keys['x']) p1.state = 'BLOCK';
            else if (p1.state === 'BLOCK' && (!isSinglePlayer || !keys['k'])) p1.state = 'IDLE';
        }

        // P2 操作 (僅雙人)
        if (!p2.isAI && (p2.state === 'IDLE' || p2.state === 'BLOCK')) {
            if (keys['arrowup']) p2.velocity.y = -5; if (keys['arrowdown']) p2.velocity.y = 5;
            if (keys['arrowleft']) { p2.velocity.x = -5; p2.facing = -1; }
            if (keys['arrowright']) { p2.velocity.x = 5; p2.facing = 1; }
            if (keys['j']) p2.performAttack(p1);
            if (keys['l']) p2.performBreak(p1);
            if (keys['k']) p2.state = 'BLOCK';
            else if (p2.state === 'BLOCK') p2.state = 'IDLE';
        }
    }
    // ... 其他邏輯保持不變 ...
</script>
</body>
</html>
