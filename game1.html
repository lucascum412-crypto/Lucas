<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>LF2 復刻版 - AI 對戰</title>
    <style>
        body { margin: 0; background-color: #222; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #gameContainer { position: relative; border: 4px solid #444; }
        canvas { background-color: #70c5ce; display: block; cursor: crosshair; }
        .ui-layer { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; }
        .health-box { width: 220px; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 5px; }
        .bar-bg { width: 100%; height: 15px; background: #440000; border: 1px solid #fff; margin-top: 5px; }
        .bar-fill { height: 100%; background: linear-gradient(to bottom, #00ff00, #008800); width: 100%; transition: width 0.2s; }
        #restartBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; font-size: 20px; cursor: pointer; background: #ffcc00; border: none; border-radius: 5px; font-weight: bold; display: none; pointer-events: auto; }
        #restartBtn:hover { background: #ffaa00; }
        #status { position: absolute; bottom: 20px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; font-size: 14px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="ui-layer">
        <div class="health-box">
            <div>P1: 藍色武術家</div>
            <div class="bar-bg"><div id="p1Health" class="bar-fill"></div></div>
        </div>
        <div class="health-box">
            <div>AI: 紅色忍者</div>
            <div class="bar-bg"><div id="p2Health" class="bar-fill" style="background: linear-gradient(to bottom, #ff3333, #880000);"></div></div>
        </div>
    </div>
    <button id="restartBtn" onclick="resetGame()">重新開始遊戲</button>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="status">P1: WASD 移動, J 攻擊 | AI 自動戰鬥中</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restartBtn');

    let gameActive = true;

    class Fighter {
        constructor({position, color, isAI}) {
            this.position = position;
            this.velocity = { x: 0, y: 0 };
            this.width = 50;
            this.height = 80;
            this.color = color;
            this.isAI = isAI;
            this.health = 100;
            this.isAttacking = false;
            this.facing = isAI ? -1 : 1; // 1 向右, -1 向左
            this.attackCooldown = false;
        }

        // 繪製皮膚 (像素風格小人)
        draw() {
            const {x, y} = this.position;
            
            // 陰影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(x + 25, y + 80, 20, 7, 0, 0, Math.PI*2); ctx.fill();

            // 身體
            ctx.fillStyle = this.color;
            ctx.fillRect(x + 10, y + 25, 30, 40); // 軀幹
            
            // 頭部
            ctx.fillStyle = '#ffdbac'; // 膚色
            ctx.fillRect(x + 15, y, 20, 25);
            ctx.fillStyle = this.isAI ? '#333' : '#222'; // 頭髮或面罩
            ctx.fillRect(x + 15, y, 20, 8);

            // 手部 (根據朝向)
            ctx.fillStyle = this.color;
            if (this.isAttacking) {
                ctx.fillRect(this.facing === 1 ? x + 35 : x - 15, y + 30, 30, 15);
            } else {
                ctx.fillRect(x + 5, y + 30, 10, 25);
                ctx.fillRect(x + 35, y + 30, 10, 25);
            }

            // 腿部
            ctx.fillStyle = '#333';
            ctx.fillRect(x + 10, y + 65, 12, 15);
            ctx.fillRect(x + 28, y + 65, 12, 15);
        }

        update() {
            if (this.health <= 0) return;
            this.draw();
            
            this.position.x += this.velocity.x;
            this.position.y += this.velocity.y;

            // 限制地圖範圍 (2.5D 地板)
            if (this.position.y < 200) this.position.y = 200;
            if (this.position.y > canvas.height - 90) this.position.y = canvas.height - 90;
            if (this.position.x < 0) this.position.x = 0;
            if (this.position.x > canvas.width - 50) this.position.x = canvas.width - 50;
        }

        attack() {
            if (this.attackCooldown || this.health <= 0) return;
            this.isAttacking = true;
            this.attackCooldown = true;

            // 碰撞檢測
            let target = this.isAI ? p1 : ai;
            let hitX = this.facing === 1 ? this.position.x + this.width : this.position.x - 30;
            
            if (
                hitX + 30 > target.position.x &&
                hitX < target.position.x + target.width &&
                this.position.y + 50 > target.position.y &&
                this.position.y < target.position.y + target.height
            ) {
                target.takeDamage(10);
            }

            setTimeout(() => { this.isAttacking = false; }, 150);
            setTimeout(() => { this.attackCooldown = false; }, 500); // 攻擊冷卻 0.5 秒
        }

        takeDamage(amt) {
            this.health -= amt;
            const barId = this.isAI ? 'p2Health' : 'p1Health';
            document.getElementById(barId).style.width = Math.max(0, this.health) + '%';
            if (this.health <= 0) endGame();
        }
    }

    let p1 = new Fighter({ position: {x: 100, y: 300}, color: '#2b58de', isAI: false });
    let ai = new Fighter({ position: {x: 600, y: 300}, color: '#d11d1d', isAI: true });

    const keys = { w:0, a:0, s:0, d:0 };

    window.addEventListener('keydown', (e) => {
        if (e.key === 'w') keys.w = 1; if (e.key === 's') keys.s = 1;
        if (e.key === 'a') { keys.a = 1; p1.facing = -1; }
        if (e.key === 'd') { keys.d = 1; p1.facing = 1; }
        if (e.key === 'j') p1.attack();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'w') keys.w = 0; if (e.key === 's') keys.s = 0;
        if (e.key === 'a') keys.a = 0; if (e.key === 'd') keys.d = 0;
    });

    function runAI() {
        if (!gameActive || ai.health <= 0) return;

        const dx = p1.position.x - ai.position.x;
        const dy = p1.position.y - ai.position.y;

        // AI 追蹤邏輯
        ai.velocity.x = Math.abs(dx) > 40 ? (dx > 0 ? 2 : -2) : 0;
        ai.velocity.y = Math.abs(dy) > 10 ? (dy > 0 ? 2 : -2) : 0;
        ai.facing = dx > 0 ? 1 : -1;

        // 隨機攻擊邏輯：如果距離夠近且隨機機率中，就攻擊
        if (Math.abs(dx) < 60 && Math.abs(dy) < 30 && Math.random() < 0.05) {
            ai.attack();
        }
    }

    function resetGame() {
        p1 = new Fighter({ position: {x: 100, y: 300}, color: '#2b58de', isAI: false });
        ai = new Fighter({ position: {x: 600, y: 300}, color: '#d11d1d', isAI: true });
        document.getElementById('p1Health').style.width = '100%';
        document.getElementById('p2Health').style.width = '100%';
        restartBtn.style.display = 'none';
        gameActive = true;
    }

    function endGame() {
        gameActive = false;
        restartBtn.style.display = 'block';
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 繪製背景地圖
        ctx.fillStyle = '#558833'; // 草地
        ctx.fillRect(0, 200, canvas.width, canvas.height - 200);

        if (gameActive) {
            p1.velocity.x = (keys.d - keys.a) * 4;
            p1.velocity.y = (keys.s - keys.w) * 4;
            runAI();
        } else {
            p1.velocity = {x:0, y:0};
            ai.velocity = {x:0, y:0};
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "white";
            ctx.font = "40px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p1.health <= 0 ? "AI 獲勝！" : "你贏了！", canvas.width/2, 180);
        }

        p1.update();
        ai.update();

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
