<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>HTML5 極速賽車模擬器</title>
    <style>
        body {
            background: #222;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* 防止捲動 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 4px solid #444;
        }

        canvas {
            display: block;
            background: #87CEEB; /* 天空藍 */
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 10px;
            display: none; /* 遊戲開始前隱藏 */
        }

        h1 { margin: 0 0 10px; color: #ffeb3b; }
        p { margin: 5px 0; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; border: 1px solid #666; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui-layer">
            <div>速度: <span id="speedDisplay">0</span> km/h</div>
            <div>距離: <span id="scoreDisplay">0</span> m</div>
        </div>

        <div id="overlay">
            <h1 id="overlayTitle">準備開始</h1>
            <p>使用 <span class="key">←</span> <span class="key">→</span> 轉向</p>
            <p>使用 <span class="key">↑</span> 加速</p>
            <p>按 <span class="key">Enter</span> 開始 / 重來</p>
        </div>
    </div>

<script>
/**
 * 簡易 HTML5 賽車引擎
 * 使用透視投影原理 (Perspective Projection)
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiSpeed = document.getElementById('speedDisplay');
const uiScore = document.getElementById('scoreDisplay');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');

// --- 遊戲狀態變數 ---
let gameState = 'START'; // START, PLAYING, GAME_OVER
let width = 800;
let height = 600;
let roadWidth = 2000; // 道路虛擬寬度
let segmentLength = 200; // 每個路段長度
let rumbleLength = 3; // 路緣石交替頻率
let laneWidth = 1200; // 車道寬度
let fieldOfView = 100; // 視野深度
let cameraHeight = 1000; // 攝影機高度
let cameraDepth = 0.84; // 攝影機距離螢幕的距離系数 (1 / tan(fov/2))
let drawDistance = 300; // 繪製多遠的路段

let playerX = 0; // 玩家橫向位置 (-1 到 1)
let playerZ = 0; // 玩家前進距離
let speed = 0;   // 當前速度
let maxSpeed = 12000; // 最大速度
let accel = 30; // 加速度
let breaking = -80; // 煞車
let decel = -10; // 自然減速
let offRoadDecel = -60; // 離開道路減速
let offRoadLimit = 1.2; // 掉出道路的邊界

let road = []; // 儲存道路資訊
let trackLength = 0;

// 按鍵狀態
const keys = {
    ArrowUp: false,
    ArrowDown: false,
    ArrowLeft: false,
    ArrowRight: false,
    Enter: false
};

// --- 初始化與工具函數 ---

function init() {
    createRoad();
    gameState = 'START';
    overlay.style.display = 'block';
    
    // 鍵盤監聽
    window.addEventListener('keydown', (e) => {
        if(keys.hasOwnProperty(e.code)) keys[e.code] = true;
        if(e.code === 'Enter') handleInput();
    });
    window.addEventListener('keyup', (e) => {
        if(keys.hasOwnProperty(e.code)) keys[e.code] = false;
    });

    requestAnimationFrame(gameLoop);
}

function handleInput() {
    if (gameState === 'START' || gameState === 'GAME_OVER') {
        resetGame();
    }
}

function resetGame() {
    gameState = 'PLAYING';
    speed = 0;
    playerX = 0;
    playerZ = 0;
    overlay.style.display = 'none';
}

function createRoad() {
    road = [];
    const totalSegments = 5000; // 總路段數
    for (let i = 0; i < totalSegments; i++) {
        // 產生一些隨機彎道
        let curve = 0;
        let height = 0;
        
        // 簡單的波浪路段生成邏輯
        if (i > 100 && i < 600) curve = 0.5;
        if (i > 700 && i < 1200) curve = -0.5;
        if (i > 1300 && i < 1800) curve = 1.5; // 急彎
        if (i > 1800 && i < 2500) curve = -1.5;
        
        // 加入起伏 (山坡)
        if (i > 500 && i % 1000 < 500) height = Math.sin(i/30.0) * 1500;

        road.push({
            p1: { world: { z: i * segmentLength }, camera: {}, screen: {} },
            p2: { world: { z: (i + 1) * segmentLength }, camera: {}, screen: {} },
            curve: curve,
            height: height,
            color: {
                grass: (Math.floor(i / rumbleLength) % 2) ? '#10aa10' : '#009a00',
                rumble: (Math.floor(i / rumbleLength) % 2) ? '#cc0000' : 'white',
                road: (Math.floor(i / rumbleLength) % 2) ? '#666' : '#646464'
            }
        });
    }
    trackLength = road.length * segmentLength;
}

// --- 數學與投影 ---

function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    p.camera.x = (p.world.x || 0) - cameraX;
    p.camera.y = (p.world.y || 0) - cameraY;
    p.camera.z = (p.world.z || 0) - cameraZ; // 這裡 cameraZ 是指玩家當前在路上的位置

    // 避免除以零
    if (p.camera.z <= 0) return;

    p.screen.scale = cameraDepth / p.camera.z;
    p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
    p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
    p.screen.w = Math.round(p.screen.scale * roadWidth * width / 2);
}

// --- 繪圖函數 ---

function renderPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function drawPlayer(ctx, width, height, steer, updown) {
    // 簡單的像素賽車繪製
    const w = 150;
    const h = 80;
    const x = width / 2 - w / 2;
    const y = height - h - 20;

    // 車體陰影
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(x + 10, y + 60, w - 20, 20);

    // 輪胎
    ctx.fillStyle = '#333';
    ctx.fillRect(x + 5, y + 40, 30, 35); // 左
    ctx.fillRect(x + w - 35, y + 40, 30, 35); // 右

    // 車身 (紅色跑車)
    ctx.fillStyle = '#d32f2f'; // 紅色
    
    // 轉向時車身稍微變形
    let turnOffset = steer * 20;
    
    ctx.beginPath();
    ctx.moveTo(x + 10 + turnOffset, y);
    ctx.lineTo(x + w - 10 + turnOffset, y);
    ctx.lineTo(x + w, y + 50);
    ctx.lineTo(x, y + 50);
    ctx.fill();

    // 擋風玻璃
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath();
    ctx.moveTo(x + 20 + turnOffset, y + 5);
    ctx.lineTo(x + w - 20 + turnOffset, y + 5);
    ctx.lineTo(x + w - 10, y + 30);
    ctx.lineTo(x + 10, y + 30);
    ctx.fill();

    // 尾燈
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(x + 10, y + 40, 20, 10);
    ctx.fillRect(x + w - 30, y + 40, 20, 10);
    
    // 煞車燈
    if(keys.ArrowDown) {
        ctx.fillStyle = '#ffaaaa';
        ctx.fillRect(x + 10, y + 40, 20, 10);
        ctx.fillRect(x + w - 30, y + 40, 20, 10);
    }
}

// --- 遊戲迴圈 ---

function update(dt) {
    if (gameState !== 'PLAYING') return;

    let position = playerZ;
    let playerSegment = road[Math.floor((playerZ / segmentLength) % road.length)];
    
    // 速度控制
    if (keys.ArrowUp) speed += accel;
    else if (keys.ArrowDown) speed += breaking;
    else speed += decel;

    // 越野減速
    if ((playerX < -1 || playerX > 1) && speed > 2000) {
        speed += offRoadDecel;
    }

    // 限制速度
    speed = Math.max(0, Math.min(speed, maxSpeed));

    // 移動
    playerZ = (playerZ + dt * speed); 
    
    // 轉向 (速度越快轉越快)
    let dx = dt * 2 * (speed / maxSpeed); 
    if (keys.ArrowLeft) playerX -= dx;
    if (keys.ArrowRight) playerX += dx;

    // 離心力 (彎道會把車甩出去)
    playerX -= (dx * speed / maxSpeed * playerSegment.curve * 2);

    // UI 更新
    uiSpeed.innerText = Math.round(speed / 100);
    uiScore.innerText = Math.round(playerZ / 100);

    // 無限循環賽道
    if (playerZ >= trackLength) {
        playerZ -= trackLength;
    }
}

function render() {
    ctx.clearRect(0, 0, width, height);

    // 找到當前所在的賽道段
    let baseSegmentIndex = Math.floor(playerZ / segmentLength);
    let basePercent = (playerZ % segmentLength) / segmentLength;
    let baseSegment = road[baseSegmentIndex % road.length];

    // 修正攝影機 X 位置 (模擬轉彎視角)
    let playerPercent = playerZ / segmentLength;
    let dx = - (baseSegment.curve * basePercent); 
    let x = 0;

    // 繪製路段
    let maxY = height; // 用於遮擋檢查 (Z-buffer概念)

    for (let i = 0; i < drawDistance; i++) {
        let n = (baseSegmentIndex + i) % road.length;
        let segment = road[n];
        
        // 攝影機位置
        // 這裡做了一個簡化的視角累積計算
        segment.looped = n < baseSegmentIndex;
        let segmentLoopOffset = segment.looped ? trackLength : 0;
        
        // 透視投影
        project(segment.p1, (playerX * roadWidth) - x, cameraHeight + baseSegment.height, playerZ - segmentLoopOffset, cameraDepth, width, height, roadWidth);
        project(segment.p2, (playerX * roadWidth) - x - dx, cameraHeight + baseSegment.height, playerZ - segmentLoopOffset, cameraDepth, width, height, roadWidth);

        x += dx;
        dx += segment.curve;

        // 如果這一段在螢幕下方或者被前面遮擋，就跳過
        if (segment.p1.camera.z <= cameraDepth || segment.p2.screen.y >= maxY || segment.p2.screen.y >= segment.p1.screen.y) {
            continue;
        }

        // 繪製草地
        renderPolygon(ctx, 0, segment.p2.screen.y, width, segment.p2.screen.y, width, segment.p1.screen.y, 0, segment.p1.screen.y, segment.color.grass);
        
        // 繪製路緣石
        let r1 = segment.p1.screen.w * 1.2;
        let r2 = segment.p2.screen.w * 1.2;
        renderPolygon(ctx, segment.p1.screen.x - r1, segment.p1.screen.y, segment.p1.screen.x + r1, segment.p1.screen.y, segment.p2.screen.x + r2, segment.p2.screen.y, segment.p2.screen.x - r2, segment.p2.screen.y, segment.color.rumble);

        // 繪製路面
        renderPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w, segment.p2.screen.y, segment.color.road);

        // 畫車道線
        if ((baseSegmentIndex + i) % 2) { // 虛線效果
            let l1 = segment.p1.screen.w * 0.02;
            let l2 = segment.p2.screen.w * 0.02;
            renderPolygon(ctx, segment.p1.screen.x - l1, segment.p1.screen.y, segment.p1.screen.x + l1, segment.p1.screen.y, segment.p2.screen.x + l2, segment.p2.screen.y, segment.p2.screen.x - l2, segment.p2.screen.y, 'white');
        }

        maxY = segment.p2.screen.y;
    }

    // 繪製玩家車輛
    let steer = (keys.ArrowLeft ? -1 : 0) + (keys.ArrowRight ? 1 : 0);
    drawPlayer(ctx, width, height, steer, 0);
}

let lastTime = 0;
function gameLoop(time) {
    if (!lastTime) lastTime = time;
    let dt = (time - lastTime) / 1000;
    lastTime = time;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

// 啟動遊戲
init();

</script>
</body>
</html>
