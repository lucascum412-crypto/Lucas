<!DOCTYPE html>
<html>
<head>
    <title>極速點擊 - 遊戲館</title>
    <style>
        body { background: #222; color: white; text-align: center; padding-top: 50px; font-family: Arial; }
        #clickArea { 
            width: 200px; height: 200px; background: #e94560; border-radius: 50%; margin: 20px auto; 
            display: flex; align-items: center; justify-content: center; font-size: 2em; cursor: pointer; user-select: none;
            box-shadow: 0 0 15px #e94560;
        }
        #clickArea:active { transform: scale(0.95); background: #ff2e4d; }
        .back-btn { margin-top: 20px; display: inline-block; padding: 10px 20px; background: #fff; color: #222; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>⚡ 極速點擊挑戰 ⚡</h1>
    <p>你有 10 秒鐘的時間！</p>
    <h2 id="timer">時間: 10.00</h2>
    <h2 id="score">點擊次數: 0</h2>
    
    <div id="clickArea" onclick="clickBtn()">開始</div>
    <br>
    <button onclick="window.location.href='index.html#back'">返回大廳</button>

    <script>
        let score = 0;
        let timeLeft = 10.00;
        let isPlaying = false;
        let timerInterval;

        function clickBtn() {
            if (timeLeft <= 0) return; // 時間到不能點

            if (!isPlaying) {
                isPlaying = true;
                document.getElementById("clickArea").innerText = "點我!";
                timerInterval = setInterval(() => {
                    timeLeft -= 0.01;
                    document.getElementById("timer").innerText = "時間: " + timeLeft.toFixed(2);
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timeLeft = 0;
                        document.getElementById("timer").innerText = "時間: 0.00";
                        document.getElementById("clickArea").innerText = "結束";
                        alert("時間到！你的手速是 " + score + " 次！");
                    }
                }, 10);
            }
            score++;
            document.getElementById("score").innerText = "點擊次數: " + score;
        }
    </script>
</body>
</html>
