<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Neon Life Museum</title>
    <style>
        :root {
            --bg: #050510;
            --primary: #00f2ff;
            --secondary: #ff0077;
            --accent: #7000ff;
            --grass: #39ff14;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: '微軟正黑體', sans-serif; }
        
        #welcomeOverlay {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .start-btn { 
            padding: 15px 60px; font-size: 22px; background: var(--primary); border: none;
            color: #000; cursor: pointer; border-radius: 5px; transition: 0.3s;
            font-weight: bold; box-shadow: 0 0 20px var(--primary);
        }
        .start-btn:hover { transform: scale(1.1); box-shadow: 0 0 40px var(--primary); }

        #hintUI {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 40px; background: #fff; border: 3px solid #000;
            color: #000; font-size: 20px; font-weight: bold; display: none; z-index: 10;
        }
    </style>
</head>
<body>

<div id="welcomeOverlay">
    <h1 style="color: var(--primary); font-size: 60px; margin-bottom: 30px;">遊戲博物館展廳</h1>
    <button class="start-btn" onclick="initGame()">進入博物館</button>
</div>

<div id="hintUI">按「空白鍵」進入：<span id="gameName"></span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hintUI = document.getElementById('hintUI');
    const nameLabel = document.getElementById('gameName');

    let player = { x: 0, y: 0, w: 36, h: 46, speed: 5, color: '#fff' };
    let keys = {};
    let running = false;
    const tileSize = 50;

    // NPC 系統
    let npcs = [
        { x: 300, y: 400, w: 30, h: 40, color: '#ffcc00', targetX: 300, targetY: 400, wait: 0 },
        { x: 1000, y: 300, w: 30, h: 40, color: '#ff00ff', targetX: 1000, targetY: 300, wait: 0 }
    ];

    // 裝飾物 (長椅, 街燈, 植物)
    const decorations = [
        { type: 'bench', x: 400, y: 450 }, { type: 'bench', x: 850, y: 450 },
        { type: 'lamp', x: 100, y: 350 }, { type: 'lamp', x: 1300, y: 350 },
        { type: 'plant', x: 600, y: 420 }, { type: 'plant', x: 750, y: 420 }
    ];

    const gates = [
        { name: "ARCADE FIGHTER", file: "game1.html", x: 200, y: 150, color: "#00f2ff" },
        { name: "NEON TETRIS", file: "game2.html", x: 500, y: 150, color: "#ff0077" },
        { name: "方塊拼圖", file: "game3.html", x: 800, y: 150, color: "#7000ff" },
        { name: "打磚塊進化", file: "game4.html", x: 1100, y: 150, color: "#00f2ff" },
        { name: "記憶翻牌", file: "game5.html", x: 200, y: 650, color: "#7000ff" },
        { name: "節奏大師", file: "game6.html", x: 500, y: 650, color: "#00f2ff" },
        { name: "平台跳躍", file: "game7.html", x: 800, y: 650, color: "#ff0077" },
        { name: "霓虹飛行員", file: "game8.html", x: 1100, y: 650, color: "#7000ff" }
    ];

    function initGame() {
        document.getElementById('welcomeOverlay').style.display = 'none';
        resize();
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        running = true;
        loop();
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    window.onresize = resize;
    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;

    function drawWorld() {
        // 地板
        ctx.fillStyle = '#0a0a20';
        ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.strokeStyle = '#151535';
        for(let x=0; x<canvas.width; x+=tileSize){ ctx.strokeRect(x,0,1,canvas.height); }
        for(let y=0; y<canvas.height; y+=tileSize){ ctx.strokeRect(0,y,canvas.width,1); }

        // 繪製裝飾物
        decorations.forEach(d => {
            if(d.type === 'bench') {
                ctx.fillStyle = '#1a1a2e'; ctx.fillRect(d.x, d.y, 80, 30);
                ctx.strokeStyle = '#444'; ctx.strokeRect(d.x, d.y, 80, 30);
            } else if(d.type === 'lamp') {
                ctx.fillStyle = '#333'; ctx.fillRect(d.x, d.y, 10, 80); // 燈柱
                ctx.shadowBlur = 20; ctx.shadowColor = 'yellow';
                ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(d.x+5, d.y, 15, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            } else if(d.type === 'plant') {
                ctx.fillStyle = '#00aa00'; ctx.beginPath(); ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x-20, d.y+30); ctx.lineTo(d.x+20, d.y+30); ctx.fill(); // 三角形植物
            }
        });
    }

    function drawGate(g) {
        // 實體拱門
        ctx.fillStyle = '#111'; ctx.fillRect(g.x, g.y, 100, 120);
        ctx.strokeStyle = g.color; ctx.lineWidth = 5;
        ctx.strokeRect(g.x, g.y, 100, 120);
        // 頂部圓弧裝飾
        ctx.beginPath(); ctx.arc(g.x+50, g.y, 50, Math.PI, 0); ctx.stroke();
        // 標題
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
        ctx.fillText(g.name, g.x+50, g.y - 60);
    }

    function drawRobot(r, isPlayer) {
        ctx.save();
        ctx.translate(r.x, r.y);
        // 身體
        ctx.fillStyle = '#222'; ctx.fillRect(-r.w/2, -r.h/2, r.w, r.h);
        ctx.strokeStyle = r.color; ctx.lineWidth = 2; ctx.strokeRect(-r.w/2, -r.h/2, r.w, r.h);
        // 頭部
        ctx.fillRect(-12, -r.h/2-20, 24, 20); ctx.strokeRect(-12, -r.h/2-20, 24, 20);
        // 眼睛
        ctx.fillStyle = isPlayer ? '#00f2ff' : '#fff';
        ctx.fillRect(-8, -38, 5, 5); ctx.fillRect(3, -38, 5, 5);
        ctx.restore();
    }

    function update() {
        if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
        if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

        // NPC AI
        npcs.forEach(n => {
            if (n.wait > 0) n.wait--;
            else {
                let dx = n.targetX - n.x;
                let dy = n.targetY - n.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 5) {
                    n.targetX = Math.random() * canvas.width;
                    n.targetY = Math.random() * canvas.height;
                    n.wait = 100;
                } else {
                    n.x += (dx/dist) * 2;
                    n.y += (dy/dist) * 2;
                }
            }
        });

        // 進入遊戲判斷
        let current = null;
        gates.forEach(g => {
            if (player.x > g.x && player.x < g.x+100 && player.y > g.y && player.y < g.y+120) current = g;
        });
        if(current) {
            hintUI.style.display = 'block';
            nameLabel.innerText = current.name;
            if(keys[' ']) window.location.href = current.file;
        } else hintUI.style.display = 'none';
    }

    function loop() {
        if (!running) return;
        update();
        drawWorld();
        gates.forEach(drawGate);
        npcs.forEach(n => drawRobot(n, false));
        drawRobot(player, true);
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
