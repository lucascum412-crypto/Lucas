<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Galaxy Hub</title>
    <style>
        :root { --bg: #020205; --primary: #00f2ff; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; }
        #welcomeOverlay {
            position: fixed; inset: 0; background: radial-gradient(circle, #0a0a25 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .start-btn { padding: 18px 70px; font-size: 24px; background: transparent; border: 3px solid var(--primary); color: var(--primary); cursor: pointer; border-radius: 4px; transition: 0.3s; font-weight: bold; }
        .start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 50px var(--primary); }
        #hintUI { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 45px; background: rgba(0, 0, 0, 0.9); border: 1px solid var(--primary); color: white; font-size: 20px; display: none; z-index: 2000; border-radius: 50px; }
    </style>
</head>
<body>
<div id="welcomeOverlay">
    <h1 style="color: white; font-size: 50px; letter-spacing: 15px;">GALAXY HUB</h1>
    <button class="start-btn" onclick="initGame()">ENTER SYSTEM</button>
</div>
<div id="hintUI">PRESS <b style="color:var(--primary)">[SPACE]</b> TO ENTER <span id="gameName"></span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hintUI = document.getElementById('hintUI');
    const nameLabel = document.getElementById('gameName');

    let player = { x: 0, y: 0, w: 24, h: 48, speed: 4.5, color: '#00f2ff', anim: 0, dir: 1 };
    let keys = {};
    let npcs = [];
    let running = false;
    let frameCount = 0;

    const gateData = [
        { name: "ARCADE FIGHTER", row: "top", color: "#00f2ff", file: "game1.html" },
        { name: "SPACE DRIFT", row: "top", color: "#ff0077", file: "game2.html" },
        { name: "CYBER PUZZLE", row: "top", color: "#7000ff", file: "game3.html" },
        { name: "BIO HAZARD", row: "top", color: "#39ff14", file: "game4.html" },
        { name: "GOLD MINER", row: "bottom", color: "#ffd700", file: "game5.html" },
        { name: "TECHNO RUN", row: "bottom", color: "#00f2ff", file: "game6.html" },
        { name: "RHYTHM BOT", row: "bottom", color: "#ff0077", file: "game7.html" },
        { name: "VOID ESCAPE", row: "bottom", color: "#7000ff", file: "game8.html" }
    ];
    let gates = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gates = [];
        const margin = canvas.width * 0.15;
        const spacing = (canvas.width - margin * 2) / 3;
        gateData.forEach((g, i) => {
            const col = i % 4;
            const x = margin + col * spacing - 65;
            const y = g.row === "top" ? 60 : canvas.height - 220;
            gates.push({ ...g, x, y, w: 130, h: 140 });
        });
    }

    function initGame() {
        document.getElementById('welcomeOverlay').style.display = 'none';
        resize();
        
        // 讀取 URL 參數
        const params = new URLSearchParams(window.location.search);
        const gateIndex = params.get('gate');

        if (gateIndex !== null && gates[gateIndex]) {
            player.x = gates[gateIndex].x + gates[gateIndex].w / 2;
            player.y = gates[gateIndex].y + gates[gateIndex].h + 30;
        } else {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
        }

        if(npcs.length === 0) {
            for(let i=0; i<7; i++) {
                npcs.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, w:24, h:48, color:`hsl(${Math.random()*360},70%,60%)`, tx:Math.random()*canvas.width, ty:Math.random()*canvas.height, anim: Math.random()*10, dir: 1, speed: 1 + Math.random() });
            }
        }
        running = true; loop();
    }

    window.onload = () => { if (window.location.search.includes("back")) initGame(); };
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function update() {
        if(!running) return;
        frameCount++;
        let nx = player.x, ny = player.y;
        if(keys['ArrowUp'] || keys['KeyW']) ny -= player.speed;
        if(keys['ArrowDown'] || keys['KeyS']) ny += player.speed;
        if(keys['ArrowLeft'] || keys['KeyA']) { nx -= player.speed; player.dir = -1; }
        if(keys['ArrowRight'] || keys['KeyD']) { nx += player.speed; player.dir = 1; }
        if(nx > 0 && nx < canvas.width) player.x = nx;
        if(ny > 0 && ny < canvas.height) player.y = ny;

        let curG = gates.find(g => player.x > g.x && player.x < g.x+130 && player.y > g.y && player.y < g.y+140);
        if(curG) {
            hintUI.style.display = 'block';
            nameLabel.innerText = curG.name;
            if(keys['Space']) {
                const idx = gates.indexOf(curG);
                window.location.href = curG.file + "?gate=" + idx;
            }
        } else { hintUI.style.display = 'none'; }

        npcs.forEach(n => {
            let dx = n.tx - n.x, dy = n.ty - n.y, dist = Math.hypot(dx, dy);
            if(dist < 10) { n.tx = Math.random()*canvas.width; n.ty = Math.random()*canvas.height; }
            else { n.x += (dx/dist)*n.speed; n.y += (dy/dist)*n.speed; n.dir = dx > 0 ? 1 : -1; }
        });
    }

    function drawCharacter(char) {
        ctx.save();
        ctx.translate(char.x, char.y);
        if (char.dir === -1) ctx.scale(-1, 1);
        ctx.fillStyle = char.color;
        ctx.fillRect(-12, -48, 24, 48); // 簡化展示，實際可放你的細緻繪圖代碼
        ctx.restore();
    }

    function draw() {
        ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        gates.forEach(g => {
            ctx.strokeStyle = g.color; ctx.lineWidth = 5;
            ctx.strokeRect(g.x, g.y, g.w, g.h);
            ctx.fillStyle = "white"; ctx.fillText(g.name, g.x + 20, g.y - 10);
        });
        drawCharacter(player);
        npcs.forEach(drawCharacter);
    }

    function loop() { if(running) { update(); draw(); requestAnimationFrame(loop); } }
</script>
</body>
</html>
