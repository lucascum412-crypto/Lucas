<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Neon Museum - Enhanced Edition</title>
    <style>
        :root {
            --bg: #030308;
            --primary: #00f2ff;
            --npc-gold: #ffcc00;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; }
        #welcomeOverlay {
            position: fixed; inset: 0; background: radial-gradient(circle, #0a0a20 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .start-btn { 
            padding: 18px 80px; font-size: 24px; background: transparent; border: 2px solid var(--primary);
            color: var(--primary); cursor: pointer; border-radius: 4px; transition: 0.3s; font-weight: bold;
        }
        .start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 50px var(--primary); }
        #hintUI {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; background: rgba(0, 0, 0, 0.9); border: 2px solid var(--primary);
            color: white; font-size: 22px; display: none; z-index: 10; border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="welcomeOverlay">
    <h1 style="color: white; font-size: 50px; letter-spacing: 10px; margin-bottom: 40px;">THE GALLERY</h1>
    <button class="start-btn" onclick="initGame()">進入展廳</button>
</div>

<div id="hintUI">按「空白鍵」啟動：<span id="gameName" style="color: var(--primary);"></span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hintUI = document.getElementById('hintUI');
    const nameLabel = document.getElementById('gameName');

    let player = { x: 0, y: 0, w: 40, h: 50, speed: 5 };
    let keys = {};
    let running = false;

    // NPC 系統 (增加平滑移動與隨機停頓)
    let npcs = [
        { x: 400, y: 300, w: 35, h: 45, color: '#ff55ff', tx: 400, ty: 300, state: 'wait', timer: 100 },
        { x: 1200, y: 500, w: 35, h: 45, color: '#ffcc00', tx: 1200, ty: 500, state: 'move', timer: 0 }
    ];

    // 精細裝飾物配置
    const decoList = [
        { type: 'bench', x: 0.25, y: 0.45 }, { type: 'bench', x: 0.75, y: 0.45 },
        { type: 'lamp', x: 0.1, y: 0.3 }, { type: 'lamp', x: 0.9, y: 0.3 },
        { type: 'tree', x: 0.45, y: 0.4 }, { type: 'tree', x: 0.55, y: 0.4 }
    ];

    const gateData = [
        { name: "ARCADE FIGHTER", file: "game1.html", color: "#00f2ff" },
        { name: "NEON TETRIS", file: "game2.html", color: "#ff0077" },
        { name: "方塊拼圖", file: "game3.html", color: "#7000ff" },
        { name: "打磚塊進化", file: "game4.html", color: "#00f2ff" },
        { name: "記憶翻牌", file: "game5.html", color: "#7000ff" },
        { name: "節奏大師", file: "game6.html", color: "#00f2ff" },
        { name: "平台跳躍", file: "game7.html", color: "#ff0077" },
        { name: "霓虹飛行員", file: "game8.html", color: "#7000ff" }
    ];

    let gates = [];

    function initGame() {
        document.getElementById('welcomeOverlay').style.display = 'none';
        resize();
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        running = true;
        loop();
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 動態計算間距 (上4下4)
        gates = [];
        const margin = canvas.width * 0.15;
        const spacing = (canvas.width - (margin * 2)) / 3;
        
        gateData.forEach((g, i) => {
            const row = Math.floor(i / 4);
            const col = i % 4;
            gates.push({
                ...g,
                x: margin + col * spacing - 50,
                y: row === 0 ? 120 : canvas.height - 250
            });
        });
    }

    window.onresize = resize;
    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;

    // 繪製精細長椅
    function drawBench(x, y) {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(x, y, 100, 40); // 座墊
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, 100, 40);
        ctx.fillStyle = '#111';
        ctx.fillRect(x-5, y, 5, 40); // 左扶手
        ctx.fillRect(x+100, y, 5, 40); // 右扶手
    }

    // 繪製精細樹木
    function drawTree(x, y) {
        ctx.fillStyle = '#0a330a';
        ctx.beginPath();
        ctx.arc(x, y, 25, 0, Math.PI*2); ctx.fill(); // 底層葉子
        ctx.beginPath();
        ctx.arc(x, y-20, 18, 0, Math.PI*2); ctx.fill(); // 頂層葉子
        ctx.fillStyle = '#39ff14'; // 葉尖發光
        ctx.beginPath(); ctx.arc(x, y-20, 3, 0, Math.PI*2); ctx.fill();
    }

    // 繪製精細街燈
    function drawLamp(x, y) {
        ctx.fillStyle = '#222';
        ctx.fillRect(x, y, 8, 100); // 燈柱
        ctx.shadowBlur = 30;
        ctx.shadowColor = 'rgba(255,255,0,0.5)';
        ctx.fillStyle = '#ffffaa';
        ctx.beginPath(); ctx.arc(x+4, y, 12, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    function drawRobot(r, isPlayer) {
        ctx.save();
        ctx.translate(r.x, r.y);
        // 身體與描邊
        ctx.fillStyle = '#111';
        ctx.fillRect(-r.w/2, -r.h/2, r.w, r.h);
        ctx.strokeStyle = isPlayer ? '#00f2ff' : r.color;
        ctx.lineWidth = 3;
        ctx.strokeRect(-r.w/2, -r.h/2, r.w, r.h);
        // 頭部與發光眼
        ctx.fillRect(-14, -r.h/2-22, 28, 22);
        ctx.strokeRect(-14, -r.h/2-22, 28, 22);
        ctx.fillStyle = isPlayer ? '#00f2ff' : '#fff';
        ctx.fillRect(-8, -38, 6, 6); ctx.fillRect(4, -38, 6, 6);
        ctx.restore();
    }

    function update() {
        if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
        if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

        // 自然 NPC AI
        npcs.forEach(n => {
            if (n.state === 'wait') {
                n.timer--;
                if (n.timer <= 0) {
                    n.state = 'move';
                    n.tx = Math.random() * (canvas.width - 100) + 50;
                    n.ty = Math.random() * (canvas.height - 100) + 50;
                }
            } else {
                let dx = n.tx - n.x;
                let dy = n.ty - n.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 2) {
                    n.state = 'wait';
                    n.timer = Math.random() * 200 + 50;
                } else {
                    n.x += (dx/dist) * 1.5; // 較慢的自然步速
                    n.y += (dy/dist) * 1.5;
                }
            }
        });

        // 碰撞與提示
        let current = null;
        gates.forEach(g => {
            if (Math.abs(player.x - (g.x+50)) < 60 && Math.abs(player.y - (g.y+60)) < 70) current = g;
        });
        if(current) {
            hintUI.style.display = 'block';
            nameLabel.innerText = current.name;
            if(keys[' ']) window.location.href = current.file;
        } else hintUI.style.display = 'none';
    }

    function loop() {
        if (!running) return;
        update();
        
        // 背景繪製
        ctx.fillStyle = '#050508';
        ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.strokeStyle = '#101020';
        for(let i=0; i<canvas.width; i+=60) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=60) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        // 門口繪製
        gates.forEach(g => {
            ctx.fillStyle = '#000'; ctx.fillRect(g.x, g.y, 100, 130);
            ctx.strokeStyle = g.color; ctx.lineWidth = 4; ctx.strokeRect(g.x, g.y, 100, 130);
            ctx.fillStyle = g.color + '22'; ctx.fillRect(g.x+5, g.y+5, 90, 120);
            ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = 'bold 16px Arial';
            ctx.fillText(g.name, g.x+50, g.y - 20);
        });

        // 物件渲染 (包含 Y-sorting 概念，先簡單畫裝飾再畫角色)
        decoList.forEach(d => {
            const rx = d.x * canvas.width;
            const ry = d.y * canvas.height;
            if(d.type === 'bench') drawBench(rx, ry);
            if(d.type === 'lamp') drawLamp(rx, ry);
            if(d.type === 'tree') drawTree(rx, ry);
        });

        npcs.forEach(n => drawRobot(n, false));
        drawRobot(player, true);

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
