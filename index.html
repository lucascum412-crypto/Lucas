<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Neon RPG Museum</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --primary: #00f2ff;
            --secondary: #e94560;
            --accent: #7000ff;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: '微軟正黑體', sans-serif; }
        
        #welcomeOverlay {
            position: fixed; inset: 0; background: radial-gradient(circle, #1a1a2e 0%, #050510 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .start-btn { 
            padding: 15px 60px; font-size: 22px; background: transparent; border: 3px solid var(--primary);
            color: var(--primary); cursor: pointer; border-radius: 10px; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 3px; font-weight: bold;
        }
        .start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 40px var(--primary); }

        #hintUI {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 30px; background: rgba(0, 0, 0, 0.85);
            border-bottom: 3px solid var(--primary); color: white;
            font-size: 20px; display: none; z-index: 10;
        }
    </style>
</head>
<body>

<div id="welcomeOverlay">
    <h1 style="color: white; font-size: 60px; margin-bottom: 30px; text-shadow: 0 0 20px var(--primary);">遊戲博物館</h1>
    <button class="start-btn" onclick="initGame()">ENTER</button>
</div>

<div id="hintUI">按「空白鍵」進入：<span id="gameName" style="color: var(--primary);"></span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hintUI = document.getElementById('hintUI');
    const nameLabel = document.getElementById('gameName');

    let player = { x: 0, y: 0, w: 40, h: 50, speed: 5, color: '#00f2ff' };
    let keys = {};
    let running = false;
    const tileSize = 60; // 背景格仔大小

    // 門口配置 (上四下四)
    const gates = [
        // 第一排
        { id: 1, name: "ARCADE FIGHTER", file: "game1.html", x: 200, y: 200, color: "#00f2ff" },
        { id: 2, name: "NEON TETRIS", file: "game2.html", x: 500, y: 200, color: "#e94560" },
        { id: 3, name: "方塊拼圖", file: "game3.html", x: 800, y: 200, color: "#7000ff" },
        { id: 4, name: "打磚塊進化", file: "game4.html", x: 1100, y: 200, color: "#00f2ff" },
        // 第二排
        { id: 5, name: "記憶翻牌", file: "game5.html", x: 200, y: 600, color: "#7000ff" },
        { id: 6, name: "節奏大師", file: "game6.html", x: 500, y: 600, color: "#00f2ff" },
        { id: 7, name: "平台跳躍", file: "game7.html", x: 800, y: 600, color: "#e94560" },
        { id: 8, name: "霓虹飛行員", file: "game8.html", x: 1100, y: 600, color: "#7000ff" }
    ];

    function initGame() {
        document.getElementById('welcomeOverlay').style.display = 'none';
        resize();
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        running = true;
        loop();
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    window.onresize = resize;
    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;

    function drawBackground() {
        // 鋪滿全螢幕的格仔線
        ctx.strokeStyle = '#161632';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += tileSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += tileSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
    }

    function drawGate(gate) {
        const gw = 100, gh = 120;
        
        // 繪製門的底座陰影
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(gate.x + gw/2, gate.y + gh, 60, 20, 0, 0, Math.PI*2);
        ctx.fill();

        // 繪製 2D 精細拱門 (外框)
        ctx.strokeStyle = gate.color;
        ctx.lineWidth = 4;
        ctx.shadowBlur = 15;
        ctx.shadowColor = gate.color;
        
        ctx.beginPath();
        ctx.moveTo(gate.x, gate.y + gh);
        ctx.lineTo(gate.x, gate.y + 30);
        ctx.arcTo(gate.x, gate.y, gate.x + gw/2, gate.y, 30);
        ctx.arcTo(gate.x + gw, gate.y, gate.x + gw, gate.y + 30, 30);
        ctx.lineTo(gate.x + gw, gate.y + gh);
        ctx.stroke();

        // 門內的光暈效果
        let grad = ctx.createLinearGradient(0, gate.y, 0, gate.y + gh);
        grad.addColorStop(0, gate.color + '55');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(gate.x + 5, gate.y + 10, gw - 10, gh - 10);

        // 遊戲名稱標籤
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'white';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(gate.name, gate.x + gw/2, gate.y - 15);
    }

    function drawRobot(p) {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        
        // 身體
        ctx.fillStyle = '#333';
        ctx.fillRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h);

        // 頭部
        ctx.fillStyle = '#333';
        ctx.fillRect(p.x - 15, p.y - p.h/2 - 25, 30, 25);
        ctx.strokeRect(p.x - 15, p.y - p.h/2 - 25, 30, 25);

        // 發光的眼睛
        ctx.fillStyle = p.color;
        let eyeFlash = Math.sin(Date.now() / 200) * 0.5 + 0.5;
        ctx.globalAlpha = 0.5 + eyeFlash * 0.5;
        ctx.fillRect(p.x - 10, p.y - p.h/2 - 18, 6, 6);
        ctx.fillRect(p.x + 4, p.y - p.h/2 - 18, 6, 6);
        ctx.globalAlpha = 1;

        // 手臂
        ctx.strokeRect(p.x - p.w/2 - 10, p.y - 10, 10, 25);
        ctx.strokeRect(p.x + p.w/2, p.y - 10, 10, 25);

        ctx.restore();
    }

    function update() {
        if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
        if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

        // 邊界限制
        player.x = Math.max(player.w, Math.min(canvas.width - player.w, player.x));
        player.y = Math.max(player.h + 30, Math.min(canvas.height - player.h, player.y));

        let currentGate = null;
        gates.forEach(g => {
            // 2D 碰撞：檢查玩家是否站在門的範圍內
            if (player.x > g.x && player.x < g.x + 100 &&
                player.y > g.y && player.y < g.y + 120) {
                currentGate = g;
            }
        });

        if (currentGate) {
            hintUI.style.display = 'block';
            nameLabel.innerText = currentGate.name;
            if (keys[' ']) { // 按空白鍵進入
                window.location.href = currentGate.file;
            }
        } else {
            hintUI.style.display = 'none';
        }
    }

    function loop() {
        if (!running) return;
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawBackground();
        gates.forEach(drawGate);
        drawRobot(player);
        update();
        
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
