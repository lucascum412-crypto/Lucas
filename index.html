<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Neon Museum - Portal Effect</title>
    <style>
        :root { --bg: #030308; --primary: #00f2ff; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; }
        #welcomeOverlay {
            position: fixed; inset: 0; background: radial-gradient(circle, #0a0a20 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .start-btn { 
            padding: 18px 80px; font-size: 24px; background: transparent; border: 2px solid var(--primary);
            color: var(--primary); cursor: pointer; border-radius: 4px; transition: 0.3s; font-weight: bold;
        }
        .start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 50px var(--primary); }
        #hintUI {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; background: rgba(0, 0, 0, 0.9); border: 2px solid var(--primary);
            color: white; font-size: 22px; display: none; z-index: 10; border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="welcomeOverlay">
    <h1 style="color: white; font-size: 50px; letter-spacing: 10px; margin-bottom: 40px;">GALAXY MUSEUM</h1>
    <button class="start-btn" onclick="initGame()">進入探索</button>
</div>

<div id="hintUI">按「空白鍵」進入：<span id="gameName" style="color: var(--primary);"></span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hintUI = document.getElementById('hintUI');
    const nameLabel = document.getElementById('gameName');

    // 1. 基礎配置
    let player = { x: 0, y: 0, w: 36, h: 46, speed: 4.5, color: '#00f2ff', alpha: 1 };
    let keys = {};
    let running = false;
    let npcs = [];
    const npcColors = ['#ff55ff', '#ffcc00', '#39ff14', '#ff4d00', '#7000ff', '#e94560', '#00ff77', '#ffffff'];

    const decoList = [
        { type: 'bench', x: 0.2, y: 0.45 }, { type: 'bench', x: 0.8, y: 0.45 },
        { type: 'lamp', x: 0.05, y: 0.15 }, { type: 'lamp', x: 0.95, y: 0.15 },
        { type: 'lamp', x: 0.05, y: 0.85 }, { type: 'lamp', x: 0.95, y: 0.85 },
        { type: 'tree', x: 0.4, y: 0.4 }, { type: 'tree', x: 0.6, y: 0.4 }
    ];

    const gateData = [
        { name: "ARCADE FIGHTER", file: "game1.html", color: "#00f2ff" },
        { name: "NEON TETRIS", file: "game2.html", color: "#ff0077" },
        { name: "方塊拼圖", file: "game3.html", color: "#7000ff" },
        { name: "打磚塊進化", file: "game4.html", color: "#00f2ff" },
        { name: "記憶翻牌", file: "game5.html", color: "#7000ff" },
        { name: "節奏大師", file: "game6.html", color: "#00f2ff" },
        { name: "平台跳躍", file: "game7.html", color: "#ff0077" },
        { name: "霓虹飛行員", file: "game8.html", color: "#7000ff" }
    ];
    let gates = [];

    function createNPCs() {
        npcs = [];
        for (let i = 0; i < 8; i++) {
            npcs.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                w: 32, h: 42, color: npcColors[i],
                tx: Math.random() * window.innerWidth,
                ty: Math.random() * window.innerHeight,
                state: 'move', timer: 0, alpha: 1
            });
        }
    }

    function initGame() {
        document.getElementById('welcomeOverlay').style.display = 'none';
        resize();
        createNPCs();
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        running = true;
        loop();
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gates = [];
        const margin = canvas.width * 0.12;
        const spacing = (canvas.width - (margin * 2)) / 3;
        gateData.forEach((g, i) => {
            const row = Math.floor(i / 4);
            const col = i % 4;
            gates.push({ ...g, x: margin + col * spacing - 50, y: row === 0 ? 100 : canvas.height - 230, w: 100, h: 130 });
        });
    }

    window.onresize = resize;
    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;

    function checkRectCollision(r1, r2) {
        return r1.x - r1.w/2 < r2.x + r2.w/2 && r1.x + r1.w/2 > r2.x - r2.w/2 &&
               r1.y - r1.h/2 < r2.y + r2.h/2 && r1.y + r1.h/2 > r2.y - r2.h/2;
    }

    // 檢查是否在門內 (用於消失效果)
    function isInPortal(entity) {
        return gates.some(g => 
            entity.x > g.x && entity.x < g.x + g.w &&
            entity.y > g.y && entity.y < g.y + g.h
        );
    }

    function getObstacles(excludeNPC = null) {
        let obs = [];
        decoList.forEach(d => {
            const rx = d.x * canvas.width, ry = d.y * canvas.height;
            if(d.type === 'bench') obs.push({ x: rx + 50, y: ry + 15, w: 110, h: 40 });
            if(d.type === 'tree') obs.push({ x: rx, y: ry, w: 40, h: 40 });
            if(d.type === 'lamp') obs.push({ x: rx + 3, y: ry + 40, w: 15, h: 80 });
        });
        // 注意：這裡不把門加進障礙物，或者只加門框的部分，為了讓你「走進去」
        // 我們把門的側邊定義為障礙，正面留空
        gates.forEach(g => {
            obs.push({ x: g.x - 2, y: g.y + 65, w: 4, h: 130 }); // 左門框
            obs.push({ x: g.x + 102, y: g.y + 65, w: 4, h: 130 }); // 右門框
            obs.push({ x: g.x + 50, y: g.y - 2, w: 100, h: 4 }); // 頂框
        });
        npcs.forEach(n => { if(n !== excludeNPC) obs.push({ x: n.x, y: n.y, w: n.w, h: n.h }); });
        return obs;
    }

    function update() {
        // --- 玩家移動 ---
        let nextX = player.x, nextY = player.y;
        if (keys['arrowup'] || keys['w']) nextY -= player.speed;
        if (keys['arrowdown'] || keys['s']) nextY += player.speed;
        if (keys['arrowleft'] || keys['a']) nextX -= player.speed;
        if (keys['arrowright'] || keys['d']) nextX += player.speed;

        const obstacles = getObstacles();
        let canMoveX = true, canMoveY = true;
        obstacles.forEach(o => {
            if (checkRectCollision({x: nextX, y: player.y, w: player.w, h: player.h}, o)) canMoveX = false;
            if (checkRectCollision({x: player.x, y: nextY, w: player.w, h: player.h}, o)) canMoveY = false;
        });
        if (canMoveX) player.x = nextX;
        if (canMoveY) player.y = nextY;

        // 消失效果邏輯
        player.alpha = isInPortal(player) ? 0 : 1;

        // --- NPC 移動 ---
        npcs.forEach(n => {
            if (n.state === 'wait') {
                n.timer--; if (n.timer <= 0) { n.state = 'move'; n.tx = Math.random() * canvas.width; n.ty = Math.random() * canvas.height; }
            } else {
                let dx = n.tx - n.x, dy = n.ty - n.y, dist = Math.hypot(dx, dy);
                if (dist < 2) { n.state = 'wait'; n.timer = 150; }
                else {
                    let nX = n.x + (dx/dist) * 1.2, nY = n.y + (dy/dist) * 1.2;
                    let blocked = false;
                    const nObs = [...getObstacles(n), {x: player.x, y: player.y, w: player.w, h: player.h}];
                    nObs.forEach(o => { if(checkRectCollision({x: nX, y: nY, w: n.w, h: n.h}, o)) blocked = true; });
                    if (!blocked) { n.x = nX; n.y = nY; } else { n.state = 'wait'; n.timer = 60; }
                }
            }
            n.alpha = isInPortal(n) ? 0 : 1; // NPC 進入也會消失
        });

        // --- 傳送檢查 ---
        let current = null;
        gates.forEach(g => { if (Math.abs(player.x - (g.x+50)) < 40 && Math.abs(player.y - (g.y+65)) < 50) current = g; });
        if(current) {
            hintUI.style.display = 'block'; nameLabel.innerText = current.name;
            if(keys[' ']) window.location.href = current.file;
        } else hintUI.style.display = 'none';
    }

    function draw() {
        ctx.fillStyle = '#050508'; ctx.fillRect(0,0,canvas.width, canvas.height);
        
        // 網格
        ctx.strokeStyle = '#101025';
        for(let i=0; i<canvas.width; i+=80) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=80) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        // 先畫裝飾
        decoList.forEach(d => {
            const rx = d.x * canvas.width, ry = d.y * canvas.height;
            if(d.type === 'bench') { ctx.fillStyle = '#1a1a2e'; ctx.fillRect(rx, ry, 100, 35); ctx.strokeStyle = '#444'; ctx.strokeRect(rx, ry, 100, 35); }
            if(d.type === 'lamp') { ctx.fillStyle = '#222'; ctx.fillRect(rx, ry, 6, 90); ctx.fillStyle = '#ffffaa'; ctx.beginPath(); ctx.arc(rx+3, ry, 10, 0, Math.PI*2); ctx.fill(); }
            if(d.type === 'tree') { ctx.fillStyle = '#0a220a'; ctx.beginPath(); ctx.arc(rx, ry, 22, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#39ff14'; ctx.beginPath(); ctx.arc(rx, ry-15, 2, 0, Math.PI*2); ctx.fill(); }
        });

        // 畫角色 (Alpha 處理)
        [...npcs, player].sort((a,b) => a.y - b.y).forEach(r => {
            if (r.alpha === 0) return; // 進入門內不渲染
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(-r.w/2, -r.h/2, r.w, r.h);
            ctx.strokeStyle = r === player ? '#00f2ff' : r.color;
            ctx.lineWidth = 3; ctx.strokeRect(-r.w/2, -r.h/2, r.w, r.h);
            ctx.restore();
        });

        // 最後畫門口 (確保覆蓋在角色消失的區域上方)
        gates.forEach(g => {
            ctx.fillStyle = '#000'; ctx.fillRect(g.x, g.y, g.w, g.h); // 門洞
            ctx.strokeStyle = g.color; ctx.lineWidth = 4; ctx.strokeRect(g.x, g.y, g.w, g.h);
            ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = 'bold 15px Arial';
            ctx.fillText(g.name, g.x+50, g.y - 15);
        });
    }

    function loop() { if (running) { update(); draw(); requestAnimationFrame(loop); } }
</script>
</body>
</html>
