<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Neon Museum - Social Hub</title>
    <style>
        :root {
            --bg: #030308;
            --primary: #00f2ff;
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; }
        #welcomeOverlay {
            position: fixed; inset: 0; background: radial-gradient(circle, #0a0a20 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .start-btn { 
            padding: 18px 80px; font-size: 24px; background: transparent; border: 2px solid var(--primary);
            color: var(--primary); cursor: pointer; border-radius: 4px; transition: 0.3s; font-weight: bold;
        }
        .start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 50px var(--primary); }
        #hintUI {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; background: rgba(0, 0, 0, 0.9); border: 2px solid var(--primary);
            color: white; font-size: 22px; display: none; z-index: 10; border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="welcomeOverlay">
    <h1 style="color: white; font-size: 50px; letter-spacing: 10px; margin-bottom: 40px;">GALAXY ARCADE</h1>
    <button class="start-btn" onclick="initGame()">進入展廳</button>
</div>

<div id="hintUI">按「空白鍵」進入：<span id="gameName" style="color: var(--primary);"></span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hintUI = document.getElementById('hintUI');
    const nameLabel = document.getElementById('gameName');

    let player = { x: 0, y: 0, w: 40, h: 50, speed: 5 };
    let keys = {};
    let running = false;
    let npcs = [];

    // NPC 顏色池
    const npcColors = ['#ff55ff', '#ffcc00', '#39ff14', '#ff4d00', '#7000ff', '#e94560', '#00ff77', '#ffffff'];

    // 初始化 8 個 NPC
    function createNPCs() {
        npcs = [];
        for (let i = 0; i < 8; i++) {
            npcs.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                w: 35, h: 45,
                color: npcColors[i],
                tx: Math.random() * window.innerWidth,
                ty: Math.random() * window.innerHeight,
                state: 'wait',
                timer: Math.random() * 200
            });
        }
    }

    const decoList = [
        { type: 'bench', x: 0.2, y: 0.45 }, { type: 'bench', x: 0.8, y: 0.45 },
        { type: 'lamp', x: 0.05, y: 0.2 }, { type: 'lamp', x: 0.95, y: 0.2 },
        { type: 'lamp', x: 0.05, y: 0.8 }, { type: 'lamp', x: 0.95, y: 0.8 },
        { type: 'tree', x: 0.4, y: 0.42 }, { type: 'tree', x: 0.6, y: 0.42 }
    ];

    const gateData = [
        { name: "ARCADE FIGHTER", file: "game1.html", color: "#00f2ff" },
        { name: "NEON TETRIS", file: "game2.html", color: "#ff0077" },
        { name: "方塊拼圖", file: "game3.html", color: "#7000ff" },
        { name: "打磚塊進化", file: "game4.html", color: "#00f2ff" },
        { name: "記憶翻牌", file: "game5.html", color: "#7000ff" },
        { name: "節奏大師", file: "game6.html", color: "#00f2ff" },
        { name: "平台跳躍", file: "game7.html", color: "#ff0077" },
        { name: "霓虹飛行員", file: "game8.html", color: "#7000ff" }
    ];

    let gates = [];

    function initGame() {
        document.getElementById('welcomeOverlay').style.display = 'none';
        resize();
        createNPCs();
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        running = true;
        loop();
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gates = [];
        const margin = canvas.width * 0.12;
        const spacing = (canvas.width - (margin * 2)) / 3;
        
        gateData.forEach((g, i) => {
            const row = Math.floor(i / 4);
            const col = i % 4;
            gates.push({
                ...g,
                x: margin + col * spacing - 50,
                y: row === 0 ? 100 : canvas.height - 230
            });
        });
    }

    window.onresize = resize;
    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;

    // --- 繪製組件 ---
    function drawBench(x, y) {
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(x, y, 100, 35);
        ctx.strokeStyle = '#444'; ctx.strokeRect(x, y, 100, 35);
        ctx.fillStyle = '#0a0a1a'; ctx.fillRect(x-5, y-5, 5, 45); ctx.fillRect(x+100, y-5, 5, 45); // 靠背柱
    }

    function drawTree(x, y) {
        ctx.fillStyle = '#0a220a'; 
        ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x, y-15, 15, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#39ff14'; ctx.beginPath(); ctx.arc(x, y-15, 2, 0, Math.PI*2); ctx.fill();
    }

    function drawLamp(x, y) {
        ctx.fillStyle = '#333'; ctx.fillRect(x, y, 6, 90);
        ctx.shadowBlur = 25; ctx.shadowColor = 'rgba(255,255,100,0.4)';
        ctx.fillStyle = '#fffFAA'; ctx.beginPath(); ctx.arc(x+3, y, 10, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    function drawRobot(r, isPlayer) {
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(-r.w/2, -r.h/2, r.w, r.h);
        ctx.strokeStyle = isPlayer ? '#00f2ff' : r.color;
        ctx.lineWidth = 3; ctx.strokeRect(-r.w/2, -r.h/2, r.w, r.h);
        // 頭部
        ctx.fillRect(-14, -r.h/2-20, 28, 20); ctx.strokeRect(-14, -r.h/2-20, 28, 20);
        // 發光眼
        ctx.fillStyle = isPlayer ? '#00f2ff' : r.color;
        ctx.fillRect(-8, -35, 5, 5); ctx.fillRect(3, -35, 5, 5);
        ctx.restore();
    }

    function update() {
        if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
        if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

        // 限制玩家不出界
        player.x = Math.max(20, Math.min(canvas.width-20, player.x));
        player.y = Math.max(20, Math.min(canvas.height-20, player.y));

        // NPC 邏輯
        npcs.forEach(n => {
            if (n.state === 'wait') {
                n.timer--;
                if (n.timer <= 0) {
                    n.state = 'move';
                    n.tx = Math.random() * (canvas.width - 60) + 30;
                    n.ty = Math.random() * (canvas.height - 60) + 30;
                }
            } else {
                let dx = n.tx - n.x, dy = n.ty - n.y, dist = Math.hypot(dx, dy);
                if (dist < 2) { n.state = 'wait'; n.timer = Math.random() * 300 + 100; }
                else { n.x += (dx/dist) * 1.2; n.y += (dy/dist) * 1.2; }
            }
        });

        // 傳送檢查
        let current = null;
        gates.forEach(g => {
            if (Math.abs(player.x - (g.x+50)) < 60 && Math.abs(player.y - (g.y+65)) < 70) current = g;
        });
        if(current) {
            hintUI.style.display = 'block';
            nameLabel.innerText = current.name;
            if(keys[' ']) window.location.href = current.file;
        } else hintUI.style.display = 'none';
    }

    function loop() {
        if (!running) return;
        update();
        ctx.fillStyle = '#050508'; ctx.fillRect(0,0,canvas.width, canvas.height);
        
        // 網格
        ctx.strokeStyle = '#101025';
        for(let i=0; i<canvas.width; i+=80) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=80) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        // 繪製門口
        gates.forEach(g => {
            ctx.fillStyle = '#000'; ctx.fillRect(g.x, g.y, 100, 130);
            ctx.strokeStyle = g.color; ctx.lineWidth = 4; ctx.strokeRect(g.x, g.y, 100, 130);
            ctx.fillStyle = g.color + '15'; ctx.fillRect(g.x+5, g.y+5, 90, 120);
            ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = 'bold 16px Arial';
            ctx.fillText(g.name, g.x+50, g.y - 15);
        });

        // 繪製裝飾物
        decoList.forEach(d => {
            const rx = d.x * canvas.width, ry = d.y * canvas.height;
            if(d.type === 'bench') drawBench(rx, ry);
            if(d.type === 'lamp') drawLamp(rx, ry);
            if(d.type === 'tree') drawTree(rx, ry);
        });

        // 繪製角色
        npcs.forEach(n => drawRobot(n, false));
        drawRobot(player, true);

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
