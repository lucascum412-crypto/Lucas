<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Neon Museum - 遊戲博物館</title>
    <style>
        :root {
            --bg: #050510;
            --primary: #00f2ff; /* 霓虹青 */
            --secondary: #e94560; /* 電玩紅 */
            --accent: #7000ff; /* 霓虹紫 */
        }

        body { margin: 0; background: var(--bg); overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #welcomeOverlay {
            position: fixed; inset: 0; background: radial-gradient(circle, #1a1a2e 0%, #050510 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .start-btn { 
            padding: 15px 50px; font-size: 20px; background: transparent; border: 2px solid var(--primary);
            color: var(--primary); cursor: pointer; border-radius: 50px; transition: 0.3s;
            box-shadow: 0 0 15px var(--primary);
        }
        .start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 30px var(--primary); }

        canvas { display: block; }

        #hintUI {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--primary); border-radius: 50px;
            color: var(--primary); font-weight: bold; font-size: 18px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            pointer-events: none; display: none;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="welcomeOverlay">
    <h1 style="color: white; font-size: 50px; text-shadow: 0 0 20px var(--primary);">NEON MUSEUM</h1>
    <button class="start-btn" onclick="start()">進入探索</button>
</div>

<div id="hintUI">傳送門：<span id="gameName">---</span></div>
<canvas id="c"></canvas>

<script>
    const cvs = document.getElementById('c');
    const ctx = cvs.getContext('2d');
    const hintUI = document.getElementById('hintUI');
    const nameLabel = document.getElementById('gameName');

    let w, h, player, keys = {}, running = false;
    
    // 遊戲配置 (上4下4 佈局)
    const gates = [
        // 第一排 (深處)
        { name: "ARCADE FIGHTER", file: "game1.html", x: -300, z: 400, color: "#00f2ff" },
        { name: "NEON TETRIS", file: "game2.html", x: -100, z: 400, color: "#e94560" },
        { name: "方塊拼圖", file: "game3.html", x: 100, z: 400, color: "#7000ff" },
        { name: "打磚塊進化", file: "game4.html", x: 300, z: 400, color: "#00f2ff" },
        // 第二排 (近處)
        { name: "記憶翻牌", file: "game5.html", x: -300, z: 150, color: "#7000ff" },
        { name: "節奏大師", file: "game6.html", x: -100, z: 150, color: "#00f2ff" },
        { name: "平台跳躍", file: "game7.html", x: 100, z: 150, color: "#e94560" },
        { name: "霓虹飛行員", file: "game8.html", x: 300, z: 150, color: "#7000ff" }
    ];

    function start() {
        document.getElementById('welcomeOverlay').style.display = 'none';
        resize();
        player = { x: 0, z: -100, rot: 0 };
        running = true;
        loop();
    }

    function resize() {
        w = cvs.width = window.innerWidth;
        h = cvs.height = window.innerHeight;
    }

    window.onresize = resize;
    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;

    // 透視投影函數
    function project(x, y, z) {
        let fov = 400;
        let scale = fov / (fov + z - player.z);
        let x2d = (x - player.x) * scale + w / 2;
        let y2d = h / 2 + y * scale;
        return { x: x2d, y: y2d, s: scale };
    }

    function drawGate(gate) {
        let pos = project(gate.x, 0, gate.z);
        if (pos.s < 0) return;

        let gw = 120 * pos.s;
        let gh = 180 * pos.s;
        
        ctx.save();
        ctx.shadowBlur = 15 * pos.s;
        ctx.shadowColor = gate.color;
        ctx.strokeStyle = gate.color;
        ctx.lineWidth = 3 * pos.s;

        // 繪製精細拱門
        ctx.beginPath();
        ctx.moveTo(pos.x - gw/2, pos.y);
        ctx.lineTo(pos.x - gw/2, pos.y - gh + gw/2);
        ctx.arc(pos.x, pos.y - gh + gw/2, gw/2, Math.PI, 0);
        ctx.lineTo(pos.x + gw/2, pos.y);
        ctx.stroke();

        // 繪製地面倒影
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.moveTo(pos.x - gw/2, pos.y);
        ctx.lineTo(pos.x - gw/2, pos.y + gh/2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x + gw/2, pos.y);
        ctx.lineTo(pos.x + gw/2, pos.y + gh/2);
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        // 文字
        ctx.fillStyle = gate.color;
        ctx.font = `bold ${14 * pos.s}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText(gate.name, pos.x, pos.y - gh - 10);
        ctx.restore();

        // 碰撞檢查
        let dx = player.x - gate.x;
        let dz = player.z - gate.z;
        if (Math.abs(dx) < 40 && Math.abs(dz) < 40) {
            window.location.href = gate.file;
        }
    }

    function drawPlayer() {
        let size = 20;
        let cx = w/2, cy = h/2 + 100;
        
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#00f2ff";
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        
        // 機器人頭部
        ctx.strokeRect(cx - 15, cy - 45, 30, 25);
        // 眼睛
        ctx.fillStyle = "#00f2ff";
        ctx.fillRect(cx - 10, cy - 35, 5, 5);
        ctx.fillRect(cx + 5, cy - 35, 5, 5);
        // 身體
        ctx.strokeRect(cx - 20, cy - 20, 40, 40);
        
        // 倒影
        ctx.globalAlpha = 0.2;
        ctx.strokeRect(cx - 20, cy + 25, 40, 20);
        ctx.restore();
    }

    function drawGrid() {
        ctx.strokeStyle = "rgba(0, 242, 255, 0.15)";
        ctx.lineWidth = 1;
        
        for (let i = -2000; i <= 2000; i += 100) {
            // 縱線 (透視)
            let p1 = project(i, 0, 0);
            let p2 = project(i, 0, 2000);
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            
            // 橫線
            let p3 = project(-2000, 0, i);
            let p4 = project(2000, 0, i);
            ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
        }
    }

    function update() {
        let speed = 4;
        if (keys['w']) player.z += speed;
        if (keys['s']) player.z -= speed;
        if (keys['a']) player.x -= speed;
        if (keys['d']) player.x += speed;

        // 檢查是否靠近門
        let near = false;
        gates.forEach(g => {
            let d = Math.hypot(player.x - g.x, player.z - g.z);
            if (d < 100) { near = true; nameLabel.innerText = g.name; }
        });
        hintUI.style.display = near ? 'block' : 'none';
    }

    function loop() {
        if (!running) return;
        update();
        ctx.fillStyle = "#050510";
        ctx.fillRect(0, 0, w, h);
        
        drawGrid();
        
        // 排序繪製 (從遠到近)
        let sortedGates = [...gates].sort((a,b) => b.z - a.z);
        sortedGates.forEach(drawGate);
        
        drawPlayer();
        requestAnimationFrame(loop);
    }
</script>

</body>
</html>
